<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Your GideonAbochie Studio membership dashboard.">
<title>My Membership — GideonAbochie Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<style>
:root{--content-max:1440px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0A1628;color:#CBD5E1;min-height:100vh;padding:100px 24px 24px}
.wrap{max-width:900px;margin:0 auto}
h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:#F1F5F9;margin-bottom:6px;letter-spacing:-.01em}
h1 span{color:#C9A84C}
.greeting{font-size:15px;color:#6B7F9A;margin-bottom:32px}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:16px;padding:28px;margin-bottom:20px}
.card h2{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#F1F5F9;margin-bottom:12px}
.card p{font-size:14px;color:#8A9BB5;line-height:1.6}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-family:'Barlow Condensed',sans-serif}
.badge-free{background:rgba(107,127,154,.15);color:#6B7F9A}
.badge-premium{background:rgba(201,168,76,.15);color:#C9A84C}
.badge-vip{background:rgba(201,168,76,.25);color:#F1F5F9}
.tier-info{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:24px}
.plan-card{background:#0A1628;border:1px solid #1E3250;border-radius:12px;padding:24px;text-align:center}
.plan-card h3{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#F1F5F9;margin-bottom:4px}
.plan-card .price{font-size:28px;font-weight:700;color:#C9A84C;margin-bottom:4px}
.plan-card .price small{font-size:14px;color:#6B7F9A}
.plan-card ul{list-style:none;padding:0;margin:16px 0;text-align:left}
.plan-card ul li{font-size:13px;color:#8A9BB5;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.plan-card ul li:last-child{border-bottom:none}
.plan-card .btn{display:inline-block;padding:10px 24px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;border:none}
.plan-card .btn-primary{background:#C9A84C;color:#0A1628}
.plan-card .btn-primary:hover{background:#D9B85C}
.plan-card .btn-current{background:rgba(107,127,154,.15);color:#6B7F9A;cursor:default}
.loading{text-align:center;padding:60px 0;color:#6B7F9A;font-size:14px}
.hidden{display:none}
.btn-logout{background:none;border:1px solid #1E3250;color:#6B7F9A;padding:8px 16px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all .2s}
.btn-logout:hover{border-color:#E8637A;color:#E8637A}
</style>
</head>
<body>
<nav class="nav" style="position:fixed;top:0;left:0;right:0;z-index:100;background:#0F1E38;border-bottom:1px solid #1E3250;padding:0 24px">
  <div class="nav-inner" style="display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1440px;margin:0 auto">
    <a href="/" style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#F1F5F9;text-decoration:none;letter-spacing:-.01em">Gideon<span style="color:#C9A84C">Abochie</span> Studio</a>
    <div style="display:flex;gap:12px;align-items:center">
      <button class="btn-logout" onclick="doLogout()">Log Out</button>
    </div>
  </div>
</nav>
<div class="wrap" id="app">
  <div class="loading" id="loading">Checking your session\u2026</div>
  <div id="content" class="hidden">
    <h1>My <span>Membership</span></h1>
    <p class="greeting" id="greeting"></p>
    <div class="card">
      <h2>Current Plan</h2>
      <div class="tier-info">
        <span class="badge" id="tierBadge"></span>
        <span style="font-size:14px;color:#8A9BB5" id="tierStatus"></span>
      </div>
    </div>
    <div class="card">
      <h2>Available Plans</h2>
      <p style="margin-bottom:16px">Choose a plan to unlock more content and features.</p>
      <div class="plan-grid" id="plans"></div>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
function getCookie(name) {
  var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : '';
}

function doLogout() {
  var token = getCookie('ga_session');
  if (token) {
    fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(function(){});
  }
  document.cookie = 'ga_session=; path=/; domain=.gideonabochie.org; max-age=0; SameSite=Lax; Secure';
  window.location.href = '/';
}

var currentTier = 'free';

function renderPlans(plans, currentTier) {
  var container = document.getElementById('plans');
  var html = '';
  for (var i = 0; i < plans.length; i++) {
    var p = plans[i];
    var isCurrent = p.tier === currentTier;
    var features = (typeof p.features === 'string' ? JSON.parse(p.features) : p.features) || [];
    var featureLis = '';
    for (var j = 0; j < features.length; j++) {
      featureLis += '<li>&#10003; ' + features[j] + '</li>';
    }
    var btnHtml = isCurrent
      ? '<button class="btn btn-current" disabled>Current Plan</button>'
      : '<button class="btn btn-primary" onclick="upgrade(\'' + p.tier + '\',' + p.price_ghs + ')">' + (p.price_ghs > 0 ? 'Upgrade &mdash; GHS ' + p.price_ghs + '/mo' : 'Free') + '</button>';
    html += '<div class="plan-card"><h3>' + p.name + '</h3><div class="price">' + (p.price_ghs > 0 ? 'GHS ' + p.price_ghs : 'Free') + '<small>' + (p.price_ghs > 0 ? '/mo' : '') + '</small></div><ul>' + featureLis + '</ul>' + btnHtml + '</div>';
  }
  container.innerHTML = html;
}

function upgrade(tier, price) {
  if (price === 0) return;
  alert('Flutterwave subscription integration coming in Phase 3. For now, contact us to upgrade.');
}

document.addEventListener('DOMContentLoaded', function() {
  var token = getCookie('ga_session');
  if (!token) { window.location.href = '/login/'; return; }
  fetch('/api/auth/session', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'ok') { window.location.href = '/login/'; return; }
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('greeting').textContent = 'Welcome back, ' + (d.user.name || d.user.email) + '!';
      currentTier = d.user.membership_tier || 'free';
      var badge = document.getElementById('tierBadge');
      badge.textContent = currentTier.charAt(0).toUpperCase() + currentTier.slice(1);
      badge.className = 'badge badge-' + currentTier;
      document.getElementById('tierStatus').textContent = 'You\'re on the ' + currentTier + ' plan.';
      return fetch('/api/membership/plans');
    })
    .then(function(r) { if (r) return r.json(); })
    .then(function(d) {
      if (d && d.status === 'ok') renderPlans(d.plans, currentTier);
    })
    .catch(function() { document.getElementById('loading').textContent = 'Something went wrong. Please refresh.'; });
});
</script>
</body>
</html>
