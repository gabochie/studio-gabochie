name: Hourly Cron — Email Queue + Cold Outreach

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process-emails:
    name: Process email + agent queue
    runs-on: ubuntu-latest
    steps:
      - name: Run email cron endpoint
        run: |
          curl -s -X GET 'https://gideonabochie.org/api/email/cron?secret=${{ secrets.CRON_SECRET }}' \
            -H 'Accept: application/json' || echo "Email cron call failed"

      - name: Process agent queue (cold outreach, analytics, fulfillment)
        run: |
          curl -s -X POST 'https://gideonabochie.org/api/agents/orchestrate' \
            -H 'Content-Type: application/json' \
            -H 'X-Agent-Auth: ${{ secrets.AGENT_AUTH_KEY }}' \
            -d '{"max_items":3}' || echo "Orchestrator call failed"
