name: Email Cron — Process Queue

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process-emails:
    name: Process email queue
    runs-on: ubuntu-latest
    steps:
      - name: Run email cron endpoint
        run: |
          curl -s -X GET 'https://gideonabochie.org/api/email/cron?secret=${{ secrets.CRON_SECRET }}' \
            -H 'Accept: application/json' || echo "Cron call failed"
