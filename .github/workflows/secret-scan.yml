name: secret-scan
# Token-free full-history scan: works on push + PR in every repo regardless of
# Actions permission settings (the gitleaks-action wrapper needs PR API access).
# Gitleaks is authoritative. Entries in .gitleaksbaseline are grandfathered only
# until the underlying credential is ROTATED — a baseline entry is not a fix.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Install Gitleaks (checksum verified)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/g.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/g.tar.gz' | sha256sum --check -
          tar xzf /tmp/g.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan full history against baseline (authoritative)
        run: gitleaks detect --source . --verbose --redact --baseline-path .gitleaksbaseline
      - name: Baseline audit (fail on new findings)
        run: |
          gitleaks detect --source . --baseline-path .gitleaksbaseline --report-format json --report-path gitleaks-fresh.json --redact
          node -e "const fs=require('fs');const fresh=JSON.parse(fs.readFileSync('gitleaks-fresh.json','utf8'));let baseline=[];try{baseline=JSON.parse(fs.readFileSync('.gitleaksbaseline','utf8'))}catch(_e){baseline=[]}const key=f=>[f.RuleID,f.File,f.Commit,f.StartLine].join('|');const known=new Set(baseline.map(key));const added=fresh.filter(f=>!known.has(key(f)));console.log('gitleaks:',JSON.stringify({findings:fresh.length,baselined:baseline.length,new:added.length}));if(added.length){for(const f of added.slice(0,20))console.error('NEW FINDING: '+f.RuleID+' at '+f.File+':'+f.StartLine+' — '+f.Description);process.exit(1)}"
      - name: Reject new baseline entries
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ]; then BASE="origin/${{ github.base_ref }}"; fi
          if git cat-file -e "$BASE:.gitleaksbaseline" 2>/dev/null; then
            git show "$BASE:.gitleaksbaseline" > /tmp/base-baseline.json
            if ! cmp -s /tmp/base-baseline.json .gitleaksbaseline; then
              echo "::error::Baseline changed. Rotate the exposed credential and remove the old entry; adding a baseline entry is not a fix."
              exit 1
            fi
          fi
          echo "Baseline unchanged — all grandfathered findings still require manual rotation"
