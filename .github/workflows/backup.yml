name: D1 Daily Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Dump all tables to JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run backup
        run: node scripts/db-backup.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup
          path: d1-backups/
          retention-days: 7
