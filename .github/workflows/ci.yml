name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  lint-html:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install HTMLHint
        run: npm install -g htmlhint
      - run: htmlhint "**/*.html" --ignore "node_modules/**,books/**"

  test-unit:
    name: Unit & API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  assets:
    name: Asset checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image sizes
        run: |
          fail=0
          for img in $(find . -path ./node_modules -prune -o \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' \) -print); do
            size=$(stat --format=%s "$img")
            if [ "$size" -gt 512000 ]; then
              echo "OVERSIZE ($((size/1024))KB): $img"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All images under 500KB"
      - name: Check for broken internal links
        run: |
          fail=0
          for file in $(find . -path ./node_modules -prune -o -name '*.html' -print); do
            for ref in $(grep -oE '(src|href)="[^"]+"' "$file" | cut -d'"' -f2); do
              path="${ref%%#*}"
              case "$path" in
                ''|http*|mailto:*|'#'*) continue ;;
              esac
              dir=$(dirname "$file")
              [ -f "$dir/$path" ] || [ -d "$dir/$path" ] || { echo "BROKEN: $file -> $path"; fail=1; }
            done
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All internal links valid"
