name: CI/CD — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  lint-html:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:html

  test-unit:
    name: Unit & API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: npx serve . -l 3000 &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null 2>&1 && echo "Server ready" && break
            sleep 1
          done
      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for potential secrets
        run: |
          fail=0
          # Check for private keys
          if grep -r 'BEGIN RSA PRIVATE KEY\|BEGIN OPENSSH PRIVATE KEY\|BEGIN DSA PRIVATE KEY\|BEGIN EC PRIVATE KEY' . --include='*' 2>/dev/null | grep -v node_modules | grep -v '.git/'; then
            echo "FAIL: Private key detected" >&2; fail=1
          fi
          # Check for .env files committed
          if find . -name '.env' -not -path './node_modules/*' -not -path './.git/*' | grep -q .; then
            echo "FAIL: .env file committed" >&2; fail=1
          fi
          # Check for Stripe live secret keys
          if grep -r 'sk_live_' . --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' 2>/dev/null | grep -v node_modules | grep -v '.git/'; then
            echo "FAIL: Stripe live secret key detected" >&2; fail=1
          fi
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "No secrets detected"

  assets:
    name: Asset checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image sizes
        run: |
          fail=0
          for img in $(find . -path ./node_modules -prune -o \( -name '*.jpg' -o -name '*.png' -o -name '*.webp' \) -print); do
            size=$(stat --format=%s "$img")
            if [ "$size" -gt 512000 ]; then
              echo "OVERSIZE ($((size/1024))KB): $img"
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All images under 500KB"
      - name: Check for broken internal links
        run: |
          fail=0
          for file in $(find . -path ./node_modules -prune -o -name '*.html' -print); do
            for ref in $(grep -oE '(src|href)="[^"]+"' "$file" | cut -d'"' -f2); do
              path="${ref%%#*}"
              # Skip empty, external, anchor-only
              echo "$path" | grep -qE '^(|http|mailto:|#)' && continue
              # Skip JS template literals (contain +) and API routes
              echo "$path" | grep -qE '[+]|/api' && continue
              dir=$(dirname "$file")
              # Handle absolute paths starting with /
              check="$dir/$path"
              echo "$path" | grep -qE '^/' && check=".$path"
              [ -f "$check" ] || [ -d "$check" ] || { echo "BROKEN: $file -> $path"; fail=1; }
            done
          done
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "All internal links valid"

  report:
    name: Report to dashboard
    if: github.ref == 'refs/heads/main'
    needs: [lint-js, lint-html, test-unit, coverage, test-e2e, audit, secrets, assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Get test results
        id: tests
        run: |
          npx vitest run --reporter=json 2>/dev/null > vitest-report.json || true
          echo "report=$(cat vitest-report.json | tr '\n' ' ')" >> $GITHUB_OUTPUT
      - name: Post to dashboard
        run: |
          REPORT=$(cat vitest-report.json 2>/dev/null || echo '{}')
          TOTAL=$(echo "$REPORT" | node -e "let d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{try{let r=JSON.parse(d.join(''));let t=r.totalTestFiles||0, p=r.numPassedTestSuites||0, f=r.numFailedTestSuites||0, tc=r.numTotalTests||0, tp=r.numPassedTests||0, tf=r.numFailedTests||0; console.log(JSON.stringify({total:t,passed:p,failed:f,tests_total:tc,tests_passed:tp,tests_failed:tf}))}catch(e){console.log('{}')}})")
          TOTAL_COUNT=$(echo "$TOTAL" | node -e "let d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{try{console.log(JSON.parse(d.join('')).tests_total||0)}catch(e){console.log(0)}})")
          PASSED=$(echo "$TOTAL" | node -e "let d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{try{console.log(JSON.parse(d.join('')).tests_passed||0)}catch(e){console.log(0)}})")
          FAILED=$(echo "$TOTAL" | node -e "let d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{try{console.log(JSON.parse(d.join('')).tests_failed||0)}catch(e){console.log(0)}})")
          STATUS="${{ needs.test-unit.result }}"
          if [ "$STATUS" = "success" ]; then STATUS="success"; else STATUS="failure"; fi
          curl -s -X POST 'https://gideonabochie.org/api/admin/ci/status' \
            -H 'Content-Type: application/json' \
            -H 'X-CI-Secret: ${{ secrets.CI_WEBHOOK_SECRET }}' \
            -d "$(cat <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "status": "$STATUS",
            "test_count": $TOTAL_COUNT,
            "test_passed": $PASSED,
            "test_failed": $FAILED,
            "coverage_pct": 0,
            "branch": "${{ github.ref_name }}",
            "triggered_by": "${{ github.event_name }}"
          }
          EOF
          )"

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint-js, lint-html, test-unit, coverage, test-e2e, audit, secrets, assets, report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Deploy
        run: npx wrangler pages deploy . --project-name gideonabochie-org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
