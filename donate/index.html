<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate — GideonAbochie Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
<script src="https://checkout.flutterwave.com/v3.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:#0A1628;color:#CBD5E1;min-height:100vh;padding:24px}
.wrap{max-width:600px;margin:0 auto}
.header{display:flex;align-items:center;gap:12px;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid #1E3250}
.header img{width:36px;height:36px;border-radius:50%}
.header h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:#F1F5F9}
.header h1 span{color:#C9A84C}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:16px;padding:32px 28px;margin-bottom:24px}
.card h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:#F1F5F9;margin-bottom:6px}
.card p{color:#6B7F9A;font-size:14px;line-height:1.7;margin-bottom:24px}
.amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.amount-btn{padding:14px 8px;border:2px solid #1E3250;border-radius:10px;background:transparent;color:#CBD5E1;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.amount-btn:hover{border-color:#3A5278;background:rgba(201,168,76,.06)}
.amount-btn.selected{border-color:#C9A84C;background:rgba(201,168,76,.1);color:#C9A84C}
.amount-btn.custom{font-size:13px;font-weight:400;color:#5A7A9F;font-family:'DM Sans',sans-serif}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:12px;color:#5A7A9F;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.input-group input{width:100%;padding:12px 16px;border:1px solid #1E3250;border-radius:8px;background:#0A1628;color:#CBD5E1;font-size:14px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif}
.input-group input:focus{border-color:#C9A84C}
.input-group input::placeholder{color:#3A5278}
.submit-btn{width:100%;padding:16px;border:none;border-radius:10px;background:#C9A84C;color:#0A1628;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:8px}
.submit-btn:hover{background:#D9B85C;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.alternatives{margin-top:24px;text-align:center}
.alternatives p{font-size:12px;color:#3A5278;margin-bottom:12px}
.alt-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.alt-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;transition:all .2s;font-family:'DM Sans',sans-serif}
.alt-btn.ko-fi{background:#13AA5E;color:#fff}
.alt-btn.ko-fi:hover{background:#15C06A}
.alt-btn.bmac{background:#FFDD00;color:#333}
.alt-btn.bmac:hover{background:#FFE44D}
.alt-btn.paypal{background:#0070BA;color:#fff}
.alt-btn.paypal:hover{background:#0085D9}
.footer{text-align:center;padding:16px 0;font-size:11px;color:#3A5278}
.footer a{color:#5A7A9F;text-decoration:none}
.footer a:hover{color:#C9A84C}
.secure-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:12px;color:#5A7A9F}
@media(max-width:500px){.amount-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="/assets/images/logo.png" alt="">
    <h1>GideonAbochie <span>Studio</span></h1>
  </div>

  <div class="card">
    <h2>Make a Donation</h2>
    <p>Your gift supports books, videos, and teachings that empower creative minds across Africa and beyond.</p>

    <div class="amount-grid" id="amountGrid">
      <button class="amount-btn" data-amount="50" onclick="selectAmount(50)">GH&#8373;50</button>
      <button class="amount-btn selected" data-amount="100" onclick="selectAmount(100)">GH&#8373;100</button>
      <button class="amount-btn" data-amount="250" onclick="selectAmount(250)">GH&#8373;250</button>
      <button class="amount-btn" data-amount="500" onclick="selectAmount(500)">GH&#8373;500</button>
      <button class="amount-btn" data-amount="1000" onclick="selectAmount(1000)">GH&#8373;1,000</button>
      <button class="amount-btn custom" id="customBtn" onclick="selectCustom()">Custom</button>
    </div>

    <div class="input-group" id="customAmountGroup" style="display:none">
      <label>Custom Amount (GHS)</label>
      <input type="number" id="customAmount" placeholder="Enter amount" min="5" oninput="if(this.value)custSelected=true;clearCustomSelection()">
    </div>

    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="donorName" placeholder="Your name">
    </div>
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="donorEmail" placeholder="your@email.com">
    </div>
    <div class="input-group">
      <label>Phone Number (optional)</label>
      <input type="tel" id="donorPhone" placeholder="+233 XX XXX XXXX">
    </div>

    <button class="submit-btn" id="payBtn" onclick="startPayment()">Donate Now</button>

    <div class="secure-badge">&#128274; Secured by Flutterwave</div>
  </div>

  <div class="alternatives">
    <p>or donate using</p>
    <div class="alt-grid">
      <a class="alt-btn ko-fi" href="https://ko-fi.com/gideonabochie" target="_blank">&#9749; Ko-fi</a>
      <a class="alt-btn bmac" href="https://buymeacoffee.com/gideonabochie" target="_blank">&#9749; Buy Me a Coffee</a>
      <a class="alt-btn paypal" href="https://paypal.me/gideonabochie" target="_blank">&#8364; PayPal</a>
    </div>
  </div>

  <div class="footer">
    <a href="/index.html">&larr; Back to Home</a> &nbsp; &middot; &nbsp; <a href="/donate.html">View Your Receipt</a>
  </div>
</div>

<script>
var selectedAmount = 100;
var custSelected = false;

function selectAmount(amt) {
  selectedAmount = amt;
  custSelected = false;
  document.getElementById('customAmountGroup').style.display = 'none';
  document.getElementById('customBtn').textContent = 'Custom';
  document.querySelectorAll('.amount-btn').forEach(function(b) {
    b.classList.remove('selected');
    if (parseInt(b.dataset.amount) === amt) b.classList.add('selected');
  });
}

function selectCustom() {
  document.getElementById('customAmountGroup').style.display = 'block';
  document.querySelectorAll('.amount-btn').forEach(function(b) { b.classList.remove('selected'); });
  document.getElementById('customBtn').classList.add('selected');
  document.getElementById('customBtn').textContent = 'Custom';
  custSelected = true;
}

function clearCustomSelection() {
  custSelected = true;
}

function startPayment() {
  var btn = document.getElementById('payBtn');
  var name = document.getElementById('donorName').value.trim();
  var email = document.getElementById('donorEmail').value.trim();
  var phone = document.getElementById('donorPhone').value.trim();

  if (!name) { alert('Please enter your name.'); return; }
  if (!email || !email.includes('@')) { alert('Please enter a valid email.'); return; }

  var amount = selectedAmount;
  if (custSelected) {
    var c = parseFloat(document.getElementById('customAmount').value);
    if (!c || c < 5) { alert('Please enter a valid amount (minimum GHS 5).'); return; }
    amount = c;
  }

  btn.disabled = true;
  btn.textContent = 'Processing...';

  var tx_ref = 'donate_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
  var redirectUrl = window.location.origin + '/donate.html?tx_ref=' + encodeURIComponent(tx_ref) + '&status=successful&amount=' + amount + '&name=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email) + '&phone=' + encodeURIComponent(phone);

  FlutterwaveCheckout({
    public_key: 'FLWPUBK-6b8e97034170a30c3e07c20e4eab58af-X',
    tx_ref: tx_ref,
    amount: amount,
    currency: 'GHS',
    payment_options: 'card, mobilemoneyghana, ussd',
    meta: {source: 'donate_standalone'},
    customer: { email: email, name: name, phone_number: phone },
    customizations: {
      title: 'Donation to GideonAbochie Studio',
      description: 'Support books, videos, and teachings',
      logo: window.location.origin + '/assets/images/logo.png'
    },
    callback: function(response) {
      window.location.href = redirectUrl;
    },
    onclose: function() {
      btn.disabled = false;
      btn.textContent = 'Donate Now';
    }
  });
}
</script>
</body>
</html>
