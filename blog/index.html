<style>
.hero{max-width:760px;margin:0 auto;padding:120px 24px 32px;text-align:center}
.hero-eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:#C9A84C;margin-bottom:12px}
.hero h1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(38px,6vw,60px);color:#fff;margin:0 0 12px}
.hero h1 span{color:#C9A84C}
.hero p{color:#8A9BB5;font-size:15px;line-height:1.7}
.grid{max-width:1000px;margin:0 auto;padding:24px 24px 64px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:14px;padding:28px;text-decoration:none;display:block}
.card:hover{border-color:#C9A84C}
.card .kicker{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:8px}
.card h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:#fff;margin:0 0 8px}
.card p{color:#8A9BB5;font-size:14px;line-height:1.6;margin:0 0 12px}
.card .meta{font-size:12px;color:#5A7A9F;font-family:'DM Sans',sans-serif}
.card .go{color:#C9A84C;font-size:13px;font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:#5A7A9F;font-size:14px;padding:32px}
.nl{max-width:560px;margin:0 auto;padding:0 24px 64px;text-align:center}
.nl input{width:100%;padding:12px 16px;border:1px solid #1E3250;border-radius:8px;background:#0F1E38;color:#E8EEF7;margin-bottom:10px;font-size:14px;box-sizing:border-box}
.nl button{width:100%;padding:12px;background:transparent;border:1px solid #C9A84C;color:#C9A84C;border-radius:8px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:.15em;text-transform:uppercase}
.nl .msg{font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="hero">
  <div class="hero-eyebrow">Studio Gabochie · Articles</div>
  <h1>Think. <span>Create.</span> Become.</h1>
  <p>Practical essays on creativity coaching — how to imagine, make, and finish work that matters. New pieces weekly.</p>
</div>
<div class="grid" id="postGrid"><div class="empty">Loading articles…</div></div>
<div class="nl">
  <h2 style="font-family:'Barlow Condensed',sans-serif;color:#fff">Get the next article</h2>
  <p style="color:#8A9BB5;font-size:13px">One practical essay a week. No spam.</p>
  <input id="nlEmail" type="email" placeholder="you@example.com">
  <button onclick="blogSubscribe()">Subscribe Free</button>
  <p class="msg" id="nlMsg"></p>
</div>
<div id="footer-placeholder"></div>
<script>
var STATIC_POSTS = [
  { slug: 'what-is-creativity-coaching', title: 'What Is Creativity Coaching? A Practical Definition', excerpt: 'Creativity coaching is structured guidance that turns imagination into finished work. Learn what it is, who it serves, and the 4-part method behind it.', tags: '["creativity-coaching", "beginners"]', published_at: '2026-09-20' },
  { slug: 'systems-thinking-for-creatives', title: 'Systems Thinking for Creatives: See the Whole, Not the Parts', excerpt: 'Creative work fails at the root, not the surface. Learn how systems thinking helps creatives find leverage points and build work that lasts.', tags: '["systems-thinking", "creativity-coaching"]', published_at: '2026-09-27' },
  { slug: 'creative-confidence', title: 'Creative Confidence: How to Ship Work That Scares You', excerpt: "Confidence doesn't come before the work — it comes from it. A practical 4-step method to ship creative work even when you feel like a fraud.", tags: '["creative-confidence", "creativity-coaching"]', published_at: '2026-10-04' }
];
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
  catch (_e) { return ''; }
}
function card(p) {
  var tags = '';
  try {
    var t = JSON.parse(p.tags || '[]');
    if (t.length) tags = '<div class="kicker">' + t.slice(0, 2).join(' · ') + '</div>';
  } catch (_e) {}
  return '<a class="card" href="/blog/' + encodeURIComponent(p.slug) + '/">' + tags +
    '<h2>' + p.title.replace(/</g, '&lt;') + '</h2>' +
    '<p>' + (p.excerpt || '').replace(/</g, '&lt;') + '</p>' +
    '<div class="meta">' + fmtDate(p.published_at) + ' · Gideon Abochie</div>' +
    '<div class="go">Read article &rarr;</div></a>';
}
fetch('/api/posts?limit=20')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var grid = document.getElementById('postGrid');
    var all = STATIC_POSTS.concat((d && d.posts) || []);
    var seen = {};
    all = all.filter(function(p) { if (!p || !p.slug || seen[p.slug]) return false; seen[p.slug] = true; return true; });
    grid.innerHTML = all.length ? all.map(card).join('') : '<div class="empty">First articles are on the way. Check back soon.</div>';
  })
  .catch(function() {
    var grid = document.getElementById('postGrid');
    grid.innerHTML = STATIC_POSTS.length ? STATIC_POSTS.map(card).join('') : '<div class="empty">First articles are on the way. Check back soon.</div>';
  });
function blogSubscribe() {
  var e = document.getElementById('nlEmail').value.trim();
  var m = document.getElementById('nlMsg');
  if (!e || e.indexOf('@') < 0) { m.style.display = 'block'; m.style.color = '#E8637A'; m.textContent = 'Enter a valid email.'; return; }
  fetch('/api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: e, source: 'blog-index' }) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.status === 'ok') { m.style.display = 'block'; m.style.color = '#22C55E'; m.textContent = (d.existing && d.confirmed) ? 'You are already subscribed — welcome back!' : 'Check your inbox to confirm.'; }
      else { m.style.display = 'block'; m.style.color = '#E8637A'; m.textContent = (d && (d.message || d.error)) || 'Something went wrong.'; }
    })
    .catch(function() { m.style.display = 'block'; m.style.color = '#E8637A'; m.textContent = 'Something went wrong.'; });
}
</script>
<script defer src="../assets/js/main.js"></script>
<script src="/nav.js"></script>
</body>
</html>
