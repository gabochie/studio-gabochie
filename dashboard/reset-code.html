<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Reset Access Code — GideonAbochie Studio">
<meta property="og:description" content="Reset your access code">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gideonabochie.org/dashboard/reset-code.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<title>Reset Access Code — GideonAbochie Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:#0A1628;color:#CBD5E1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:12px;padding:32px;max-width:420px;width:100%}
.card h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:6px}
.card h1 span{color:#C9A84C}
.card p{color:#8A9BB5;font-size:13px;margin-bottom:24px;line-height:1.6}
.card label{display:block;color:#8A9BB5;font-size:12px;margin-bottom:4px}
.card input{width:100%;padding:12px 16px;background:#0A1628;border:1px solid #1E3250;border-radius:8px;color:#E8EEF7;font-size:14px;font-family:inherit;margin-bottom:16px;box-sizing:border-box}
.card input:focus{border-color:#C9A84C;outline:none}
.card .btn{width:100%;padding:12px;border:none;border-radius:8px;background:#C9A84C;color:#0A1628;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.card .btn:hover{background:#D9B85C}
.card .btn:disabled{background:rgba(201,168,76,.12);color:#5A7A9F;cursor:not-allowed}
.msg{font-size:12px;margin-top:12px;padding:8px 12px;border-radius:6px;display:none}
.msg.success{display:block;background:rgba(34,197,94,.1);color:#22C55E;border:1px solid rgba(34,197,94,.2)}
.msg.error{display:block;background:rgba(232,99,122,.1);color:#E8637A;border:1px solid rgba(232,99,122,.2)}
</style>
</head>
<body>
<div class="card">
  <h1>Reset <span>Access Code</span></h1>
  <p>Enter your email and a new access code. Use the link from your email to verify.</p>
  <form id="resetForm" onsubmit="handleReset();return false">
    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="you@example.com" required>
    <label for="newCode">New access code</label>
    <input id="newCode" type="password" placeholder="At least 4 characters" minlength="4" required>
    <label for="confirmCode">Confirm new code</label>
    <input id="confirmCode" type="password" placeholder="Repeat your new code" minlength="4" required>
    <button class="btn" id="resetBtn">Reset Access Code</button>
    <div class="msg" id="msg"></div>
  </form>
  <p style="margin-top:16px;text-align:center"><a href="/dashboard/" style="color:#C9A84C;font-size:12px;text-decoration:none">Back to Login</a></p>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token') || '';
  var email = params.get('email') || '';
  if (token) document.getElementById('email').value = decodeURIComponent(email);

  window.handleReset = function() {
    var emailVal = document.getElementById('email').value.trim().toLowerCase();
    var newCode = document.getElementById('newCode').value;
    var confirmCode = document.getElementById('confirmCode').value;
    var msg = document.getElementById('msg');
    var btn = document.getElementById('resetBtn');
    if (!emailVal || !newCode || !confirmCode) {
      msg.className = 'msg error'; msg.textContent = 'Please fill in all fields.'; return;
    }
    if (newCode.length < 4) {
      msg.className = 'msg error'; msg.textContent = 'Access code must be at least 4 characters.'; return;
    }
    if (newCode !== confirmCode) {
      msg.className = 'msg error'; msg.textContent = 'Codes do not match.'; return;
    }
    if (!token) {
      msg.className = 'msg error'; msg.textContent = 'Invalid reset link. Please request a new one.'; return;
    }
    tagOnboard(emailVal, '', 'dashboard');
    btn.disabled = true;
    btn.textContent = 'Resetting...';
    msg.className = 'msg';
    fetch('/api/auth/reset-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, email: emailVal, new_code: newCode })
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.status === 'ok') {
        msg.className = 'msg success';
        msg.textContent = 'Access code reset successfully! Redirecting to login...';
        setTimeout(function() { window.location.href = '/dashboard/'; }, 2000);
      } else {
        msg.className = 'msg error';
        msg.textContent = data.message || 'Could not reset access code.';
        btn.disabled = false;
        btn.textContent = 'Reset Access Code';
      }
    }).catch(function() {
      msg.className = 'msg error';
      msg.textContent = 'Network error. Try again.';
      btn.disabled = false;
      btn.textContent = 'Reset Access Code';
    });
  };
})();
</script>
</body>
</html>
