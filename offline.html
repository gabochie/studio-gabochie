<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A1628">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Offline — Studio Gabochie</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<link rel="stylesheet" href="/assets/css/main.css">
<style>
  .offline-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;background:#0A1628;color:#E8EDF4;
    font-family:'Barlow',system-ui,-apple-system,sans-serif;text-align:center;
  }
  .offline-card{max-width:520px;margin:0 auto}
  .offline-glyph{
    width:72px;height:72px;margin:0 auto 28px;border-radius:18px;
    background:#C9A84C;color:#0A1628;display:flex;align-items:center;
    justify-content:center;font-size:38px;font-weight:700;
  }
  .offline-card h1{
    font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;
    margin:0 0 12px;letter-spacing:.01em;color:#fff;
  }
  .offline-card p{font-size:16px;line-height:1.65;color:#9FB0C4;margin:0 0 28px}
  .offline-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:32px}
  .offline-btn{
    display:inline-block;padding:13px 26px;border-radius:6px;text-decoration:none;
    font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    background:#C9A84C;color:#0A1628;border:1px solid #C9A84C;
  }
  .offline-btn-ghost{background:transparent;color:#C9A84C}
  .offline-btn:hover{opacity:.88}
  .offline-note{font-size:13px;color:#6B7F9A;border-top:1px solid rgba(255,255,255,.08);padding-top:20px}
  .offline-note a{color:#C9A84C}
</style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-card">
      <div class="offline-glyph">G</div>
      <h1>You're Offline</h1>
      <p>This page hasn't been saved to your device yet. Pages you've already visited still work offline. Reconnect to load anything new.</p>
      <div class="offline-actions">
        <a href="/" class="offline-btn">Try Home</a>
        <a href="/courses/" class="offline-btn offline-btn-ghost">Courses</a>
      </div>
      <p class="offline-note">Your progress, payments and enrollment always need a connection. Questions? <a href="mailto:hello@gabochie.com">Email us</a>.</p>
    </div>
  </div>
</body>
</html>
