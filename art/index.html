<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Original artwork by Studio Gabochie — digital paintings, illustrations, and creative works celebrating faith, culture, and creativity.">
<meta property="og:title" content="Art — Studio Gabochie">
<meta property="og:description" content="Original digital artwork celebrating faith, culture, and creativity.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://studio.gabochie.com/art/">
<meta property="og:image" content="https://studio.gabochie.com/assets/images/banner.jpg">
<link rel="canonical" href="https://studio.gabochie.com/art/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Art — Studio Gabochie</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/fonts/tabler/tabler-icons.min.css">
<link rel="stylesheet" href="../assets/css/main.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--content-max:1440px}
body{font-family:'Libre Baskerville',Georgia,serif;background:#0A1628;color:#CBD5E1;min-height:100vh;padding:104px 24px 24px}
.wrap{max-width:var(--content-max);margin:0 auto;width:100%}
.intro{text-align:center;margin-bottom:40px}
.intro h2{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,4vw,42px);font-weight:700;color:#F1F5F9;margin-bottom:8px}
.intro h2 span{color:#C9A84C}
.intro p{color:#5A7A9F;font-size:14px;max-width:600px;margin:0 auto;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.art-card{background:#0F1E38;border:1px solid #1E3250;border-radius:12px;overflow:hidden;transition:border-color .3s}
.art-card:hover{border-color:#C9A84C}
.art-card .img-placeholder{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#1E3250,#0A1628);display:flex;align-items:center;justify-content:center;font-size:48px;color:#3A5278}
.art-card .info{padding:16px}
.art-card .info h3{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;color:#F1F5F9;margin-bottom:2px}
.art-card .info .medium{font-size:12px;color:#5A7A9F;margin-bottom:8px}
.art-card .info .price{font-size:16px;font-weight:700;color:#C9A84C;margin-bottom:10px}
.art-card .btn-buy{width:100%;padding:10px;background:transparent;border:1px solid #C9A84C;color:#C9A84C;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.art-card .btn-buy:hover{background:#C9A84C;color:#0A1628}
.loading{text-align:center;padding:60px 0;color:#5A7A9F}
.error{text-align:center;padding:60px 0;color:#E8637A}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="wrap">
  <div class="intro">
    <h2>Original <span>Artwork</span></h2>
    <p>Digital paintings and illustrations celebrating faith, culture, and the beauty of creation. Each piece is a unique expression of the Studio's vision.</p>
  </div>
  <div class="grid" id="artGrid">
    <div class="loading">Loading artwork...</div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script defer src="../assets/js/main.js"></script>
<script src="/nav.js"></script>
<script>
var artInventory = [
  { title: 'The Cross Over Ghana', medium: 'Digital Painting \u2014 2026', price: 50 },
  { title: 'Wisdom\u2019s Foundation', medium: 'Digital Illustration \u2014 2026', price: 35 },
  { title: 'Creativity\u2019s Flame', medium: 'Digital Art \u2014 2026', price: 45 },
  { title: 'Nation Builder', medium: 'Digital Portrait \u2014 2026', price: 40 }
];

function renderArt() {
  var grid = document.getElementById('artGrid');
  grid.innerHTML = artInventory.map(function(a) {
    return '<div class="art-card">' +
      '<div class="img-placeholder"><i class="ti ti-palette"></i></div>' +
      '<div class="info">' +
      '<h3>' + a.title + '</h3>' +
      '<div class="medium">' + a.medium + '</div>' +
      '<div class="price">GH¢ ' + a.price + '</div>' +
      '<button class="btn-buy" onclick="buyArtItem(\'' + a.title.replace(/'/g, "\\'") + '\', ' + a.price + ')"><i class="ti ti-shopping-cart"></i> Buy Artwork</button>' +
      '</div></div>';
  }).join('');
}

function buyArtItem(name, price) {
  showStoreModal(function(user) {
    fetch('/api/store/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ item_type: 'art', item_name: name, amount: price, currency: 'GHS', customer_name: user.name, customer_email: user.email, user_id: user.user_id || 0, phone: user.phone || '' })
    }).then(function(r){ return r.json(); }).then(function(d) {
      if (d.status !== 'ok' || !d.tx_ref) { alert('Could not start checkout. Please try again or email studio@gabochie.com'); return; }
      if (typeof window.payWithExpressPay === 'function') {
        window.payWithExpressPay({
          tx_ref: d.tx_ref, name: user.name, email: user.email, phone: user.phone || '',
          redirect: '/store/download', btn: null, btnLabel: '', context: 'art'
        });
        return;
      }
      alert('Payment system loading. Please refresh and try again.');
    }).catch(function(){ alert('Network error. Please try again or email studio@gabochie.com'); });
  });
}

renderArt();
</script>
</body>
</html>
