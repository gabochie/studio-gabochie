<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation Received — GideonAbochie Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:#0A1628;color:#CBD5E1;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{max-width:480px;width:100%;background:#0F1E38;border:1px solid #1E3250;border-radius:16px;padding:48px 32px}
.icon{font-size:56px;margin-bottom:16px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:700;color:#fff;margin-bottom:8px}
h1 span{color:#C9A84C}
p{color:#8A9BB5;line-height:1.7;margin-bottom:24px;font-size:15px}
.detail{background:rgba(0,0,0,.2);border:1px solid #1E3250;border-radius:8px;padding:16px;margin-bottom:24px;font-size:13px}
.detail span{color:#5A7A9F;display:block;margin-bottom:4px}
.detail strong{color:#C9A84C;font-size:15px;word-break:break-all}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border:none;cursor:pointer;text-decoration:none;background:#C9A84C;color:#0A1628;transition:all .2s}
.btn:hover{background:#D9B85C;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#10003;</div>
  <h1>Thank <span>You</span></h1>
  <p>Your generous gift makes every book, video, and teaching possible. You'll receive a confirmation email shortly.</p>
  <div class="detail" id="txDetail">
    <span>Transaction Reference</span>
    <strong id="txRef">—</strong>
  </div>
  <a href="index.html" class="btn">&larr; Back to Home</a>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var tx = params.get('tx_ref') || params.get('transaction_id') || '—';
document.getElementById('txRef').textContent = tx;
</script>
</body>
</html>
