<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donations — Admin · GideonAbochie Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.donor-info{display:flex;flex-direction:column;gap:2px}
.donor-info .name{color:#E8EEF7;font-weight:500;font-size:13px}
.donor-info .email{color:#5A7A9F;font-size:11px}
.status-pill.successful{background:rgba(52,199,123,.15);color:#34C77B}
.status-pill.pending{background:rgba(201,168,76,.12);color:#C9A84C}
.status-pill.failed{background:rgba(232,99,122,.12);color:#E8637A}
</style>
</head>
<body>
<div class="wrap">

  </div>

  <h1 class="page-title">Donation <span>Log</span></h1>
  <p class="page-desc">Incoming donations tracked from Flutterwave, Ko-fi, and Buy Me a Coffee.</p>

  <div class="stats" id="stats">
    <div class="stat-card"><span class="stat-num zero" id="totalReceived">—</span><span class="stat-label">Total Received</span><span class="stat-note">All time</span></div>
    <div class="stat-card"><span class="stat-num gold" id="totalAmount">—</span><span class="stat-label">Total (GHS)</span><span class="stat-note">Successful only</span></div>
    <div class="stat-card"><span class="stat-num green" id="donorCount">—</span><span class="stat-label">Successful Donors</span><span class="stat-note">Completed payments</span></div>
    <div class="stat-card"><span class="stat-num" id="avgGift">—</span><span class="stat-label">Avg Gift (GHS)</span><span class="stat-note">Per successful donation</span></div>
  </div>

  <div class="section-title">&#10003; Donation Records</div>
  <div class="refresh-bar">
    <span class="note" id="lastUpdated">Loading...</span>
    <button class="btn-sm" onclick="loadDonations()">&#8635; Refresh</button>
    <button class="btn-sm" onclick="exportDonationsCSV()">&#8595; Export CSV</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Donor</th><th>Amount</th><th>Currency</th><th>Date</th><th>Status</th><th>Phone</th><th>Tx Ref</th></tr></thead>
      <tbody id="donationsBody"></tbody>
    </table>
  </div>
</div>
<div class="footer"><a href="index.html">&larr; Dashboard</a></div>
<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
if (!getAdminKey()) ensureAdminKey();
async function loadDonations() {
  document.getElementById('lastUpdated').textContent = 'Loading...';
  try {
    var res = await adminFetch('/admin/api/donations', {headers:{'Referer':'/admin/donations.html'}});
    if (!res.ok) throw new Error('Failed to load');
    var data = await res.json();
    var items = data.items || [];
    _donations = items;
    var t = data.totals || {};
    var totalReceived = t.count || 0;
    var totalAmount = t.total_successful || 0;
    var successful = items.filter(function(i){return i.status === 'successful'});
    var avg = successful.length > 0 ? (totalAmount / successful.length) : 0;

    document.getElementById('totalReceived').textContent = totalReceived;
    document.getElementById('totalReceived').className = 'stat-num ' + (totalReceived > 0 ? 'green' : 'zero');
    document.getElementById('totalAmount').textContent = totalAmount > 0 ? totalAmount.toFixed(2) : '—';
    document.getElementById('totalAmount').className = 'stat-num ' + (totalAmount > 0 ? 'gold' : 'zero');
    document.getElementById('donorCount').textContent = successful.length || '—';
    document.getElementById('donorCount').className = 'stat-num ' + (successful.length > 0 ? 'green' : 'zero');
    document.getElementById('avgGift').textContent = avg > 0 ? avg.toFixed(2) : '—';
    document.getElementById('avgGift').className = 'stat-num ' + (avg > 0 ? '' : 'zero');

    var html = '';
    if (items.length === 0) {
      html = '<tr><td colspan="7" class="table-empty">No donations yet. Set up Flutterwave webhook to start tracking.</td></tr>';
    } else {
      items.forEach(function(d) {
        var date = d.created_at ? new Date(d.created_at).toLocaleDateString() : '—';
        var statusClass = d.status === 'successful' ? 'successful' : (d.status === 'failed' ? 'failed' : 'pending');
        html += '<tr><td><div class="donor-info"><span class="name">' + escapeHtml(d.donor_name || 'Anonymous') + '</span><span class="email">' + escapeHtml(d.donor_email || '') + '</span></div></td><td><strong>' + escapeHtml((d.amount || 0).toFixed(2)) + '</strong></td><td>' + escapeHtml(d.currency || 'GHS') + '</td><td>' + escapeHtml(date) + '</td><td><span class="status-pill ' + escapeHtml(statusClass) + '">' + escapeHtml(d.status) + '</span></td><td style="font-size:12px;color:#5A7A9F">' + escapeHtml(d.donor_phone || '—') + '</td><td style="font-size:11px;color:#5A7A9F;font-family:monospace">' + escapeHtml((d.tx_ref || '').slice(0, 20)) + '...</td></tr>';
      });
    }
    document.getElementById('donationsBody').innerHTML = html;
    document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('donationsBody').innerHTML = '<tr><td colspan="7" class="table-empty">Error loading donations. D1 not bound yet?</td></tr>';
    document.getElementById('lastUpdated').textContent = 'Error loading';
  }
}
function exportDonationsCSV() {
  if (!_donations || !_donations.length) return Toast.error('No data to export.');
  var rows = [['Donor','Email','Amount','Currency','Phone','Status','Tx Ref','Date']];
  _donations.forEach(function(d) {
    rows.push([d.donor_name||'', d.donor_email||'', d.amount||0, d.currency||'GHS', d.donor_phone||'', d.status||'', d.tx_ref||'', d.created_at||'']);
  });
  var csv = rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'donations-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

var _donations = [];

loadDonations();
</script>
</body>
</html>
