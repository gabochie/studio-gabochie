<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribers — GAHQ Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.kv-status{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:20px}
.kv-status.ok{background:rgba(52,199,123,0.1);border:1px solid rgba(52,199,123,0.2);color:#34C77B}
.kv-status.pending{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.2);color:#C9A84C}
.kv-status.error{background:rgba(232,99,122,0.1);border:1px solid rgba(232,99,122,0.2);color:#E8637A}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.empty-state{text-align:center;padding:60px 24px;background:#0F1E38;border:1px dashed #1E3250;border-radius:12px}
.empty-state h3{font-size:18px;color:#E8EEF7;margin-bottom:8px}
.empty-state p{font-size:13px;color:#5A7A9F}
.table-wrap .source-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:rgba(90,122,159,0.12);color:#5A7A9F;text-transform:uppercase}
.table-wrap .source-tag.subscribe{background:rgba(52,199,123,0.12);color:#34C77B}
.table-wrap .source-tag.booking{background:rgba(201,168,76,0.12);color:#C9A84C}
</style>
</head>
<body>

<div class="wrap">

  <h1 class="page-title">Subscriber <span>List</span></h1>
  <p class="page-desc">All email captures from lead forms, newsletter subscribe, and ad booking inquiries. Stored in D1 database.</p>

  <div id="dbStatus" class="kv-status pending">Checking database connection&hellip;</div>

  <div class="stats" id="statsRow">
    <div class="stat-card"><span class="stat-num" id="statTotal">-</span><span class="stat-label">Total Subscribers</span></div>
    <div class="stat-card"><span class="stat-num green" id="statNewsletter">-</span><span class="stat-label">Newsletter</span></div>
    <div class="stat-card"><span class="stat-num" id="statBookings">-</span><span class="stat-label">Ad Inquiries</span></div>
    <div class="stat-card"><span class="stat-num dim" id="statLeads">-</span><span class="stat-label">Book Leads</span></div>
  </div>

  <div class="toolbar">
    <input class="search-input" id="searchInput" placeholder="Search by name or email&hellip;" oninput="filterTable()">
    <select id="tagFilter" onchange="filterTable()" style="padding:8px 14px;border:1px solid #1E3250;border-radius:6px;background:#0F1E38;color:#CBD5E1;font-size:12px;outline:none;min-width:140px">
      <option value="">All Tags</option>
      <option value="newsletter">Newsletter</option>
      <option value="school">School</option>
      <option value="nationbuilding">Nation Building</option>
      <option value="book_download">Book Download</option>
      <option value="book_bundle">Book Bundle</option>
      <option value="donation">Donation</option>
      <option value="patron">Patron</option>
      <option value="sponsor">Sponsor</option>
      <option value="partner">Partner</option>
      <option value="dashboard">Dashboard</option>
      <option value="other">Other</option>
    </select>
    <button class="btn btn-gold" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-outline" onclick="refresh()">Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Edition</th>
          <th>Ref Code</th>
          <th>Source</th>
          <th>Onboarding Tag</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="subsBody">
        <tr><td colspan="7" style="text-align:center;color:#3A5278;padding:32px">Loading subscribers&hellip;</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
if (!getAdminKey()) ensureAdminKey();
var _items = [];

function refresh() {
  document.getElementById('subsBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#3A5278;padding:32px">Loading subscribers&hellip;</td></tr>';
  document.getElementById('kvStatus').className = 'kv-status pending';
  document.getElementById('kvStatus').textContent = 'Fetching subscriber data&hellip;';

  adminFetch('/admin/api/subscribers', {cache:'no-store'}).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data) {
    if (data.status !== 'ok') throw new Error(data.message || 'Unknown error');
    _items = data.items || [];
    renderTable(_items);
    renderStats(_items);
    document.getElementById('kvStatus').className = 'kv-status ok';
    document.getElementById('kvStatus').textContent = 'D1 connected — ' + _items.length + ' subscriber(s) found';
  }).catch(function(err) {
    document.getElementById('subsBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px"><div class="empty-state"><h3>D1 Not Connected</h3><p>' + err.message + '.</p></div></td></tr>';
    document.getElementById('kvStatus').className = 'kv-status error';
    document.getElementById('kvStatus').textContent = 'D1 error: ' + err.message;
  });
}

function renderTable(items) {
  var q = (document.getElementById('searchInput').value || '').toLowerCase();
  var tagFilter = document.getElementById('tagFilter').value;
  var filtered = items.filter(function(i) {
    if (tagFilter && i.onboarding_tag !== tagFilter) return false;
    return !q || (i.email && i.email.toLowerCase().indexOf(q) !== -1) || (i.name && i.name.toLowerCase().indexOf(q) !== -1);
  });
  if (!filtered.length) {
    document.getElementById('subsBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#3A5278">No subscribers found.</td></tr>';
    return;
  }
  var html = '';
  var flags = {GH:'&#127987;', UK:'&#127988;', NA:'&#127482;&#127480;', ROW:'&#127758;'};
  var tagLabels = {newsletter:'Newsletter', school:'School', nationbuilding:'Nation Building', book_download:'Book Download', book_bundle:'Book Bundle', donation:'Donation', patron:'Patron', sponsor:'Sponsor', partner:'Partner', dashboard:'Dashboard', contact:'Contact', other:'Other'};
  filtered.forEach(function(item) {
    var source = item.source || 'web';
    var srcClass = source === 'newsletter' ? 'subscribe' : '';
    var edition = item.edition || '';
    var flag = flags[edition] || '';
    var ref = item.ref_code || '';
    var tag = item.onboarding_tag || '';
    var tagLabel = tagLabels[tag] || tag;
    var date = item.subscribed_at ? new Date(item.subscribed_at).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '-';
    html += '<tr><td>' + escapeHtml(item.email || '-') + '</td><td>' + escapeHtml(item.name || '-') + '</td><td>' + flag + ' ' + escapeHtml(edition) + '</td><td style="font-family:monospace;color:#C9A84C;font-size:11px">' + escapeHtml(ref || '—') + '</td><td><span class="source-tag ' + escapeHtml(srcClass) + '">' + escapeHtml(source) + '</span></td><td><span class="source-tag" style="background:rgba(201,168,76,0.12);color:#C9A84C">' + escapeHtml(tagLabel) + '</span></td><td style="font-size:11px;color:#5A7A9F">' + date + '</td></tr>';
  });
  document.getElementById('subsBody').innerHTML = html;
}

function renderStats(items) {
  var total = items.length;
  var newsletter = items.filter(function(i) { return i.source === 'newsletter' || i.source === 'subscribe'; }).length;
  var gh = items.filter(function(i) { return i.edition === 'GH'; }).length;
  var uk = items.filter(function(i) { return i.edition === 'UK'; }).length;
  var na = items.filter(function(i) { return i.edition === 'NA'; }).length;
  var row = items.filter(function(i) { return i.edition === 'ROW' || !i.edition; }).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statNewsletter').textContent = newsletter;
  document.getElementById('statBookings').textContent = gh;
  document.getElementById('statLeads').textContent = uk + na + row;

  var existing = document.getElementById('editionBreakdown');
  if(!existing) {
    var div = document.createElement('div');
    div.id = 'editionBreakdown';
    div.style.cssText = 'display:flex;gap:10px;margin-bottom:16px;font-size:12px;color:#5A7A9F';
    document.getElementById('statsRow').after(div);
  }
  document.getElementById('editionBreakdown').innerHTML =
    '<span>&#127987; Ghana: <strong style="color:#F1F5F9">' + gh + '</strong></span>' +
    '<span>&#127988; UK: <strong style="color:#F1F5F9">' + uk + '</strong></span>' +
    '<span>&#127482;&#127480; NA: <strong style="color:#F1F5F9">' + na + '</strong></span>' +
    '<span>&#127758; ROW: <strong style="color:#F1F5F9">' + row + '</strong></span>';

  // Tag distribution bar chart
  var tagLabels = {newsletter:'Newsletter', school:'School', nationbuilding:'Nation Building', book_download:'Book Download', book_bundle:'Book Bundle', donation:'Donation', patron:'Patron', sponsor:'Sponsor', partner:'Partner', dashboard:'Dashboard', contact:'Contact', other:'Other'};
  var tagCounts = {};
  var tagOrder = ['newsletter','school','nationbuilding','book_download','book_bundle','donation','patron','sponsor','partner','dashboard','other'];
  items.forEach(function(i) {
    var t = i.onboarding_tag || 'other';
    if (!tagCounts[t]) tagCounts[t] = 0;
    tagCounts[t]++;
  });
  var chartEl = document.getElementById('tagChart');
  if (!chartEl) {
    var div = document.createElement('div');
    div.id = 'tagChart';
    div.style.cssText = 'margin-top:16px;padding:16px;background:#0F1E38;border:1px solid #1E3250;border-radius:8px';
    document.getElementById('editionBreakdown').after(div);
    chartEl = div;
  }
  var maxCount = Math.max.apply(null, tagOrder.map(function(t) { return tagCounts[t] || 0; })) || 1;
  var bars = '<div style="margin-bottom:8px;font-size:11px;color:#5A7A9F;text-transform:uppercase;letter-spacing:.1em">Tag Distribution</div>';
  tagOrder.forEach(function(t) {
    var count = tagCounts[t] || 0;
    var pct = Math.round(count / total * 100) || 0;
    var barW = Math.round(count / maxCount * 100) || 0;
    bars += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:#CBD5E1">' +
      '<span style="width:110px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (tagLabels[t] || t) + '</span>' +
      '<span style="flex:1;height:16px;background:#0A1628;border-radius:3px;position:relative;overflow:hidden">' +
      '<span style="display:block;height:100%;width:' + barW + '%;background:#C9A84C;border-radius:3px;transition:width .3s"></span></span>' +
      '<span style="width:50px;text-align:right;font-weight:600;color:#F1F5F9;font-family:monospace">' + count + '</span>' +
      '<span style="width:36px;text-align:right;color:#5A7A9F;font-family:monospace">' + pct + '%</span></div>';
  });
  chartEl.innerHTML = bars;
}

function filterTable() {
  renderTable(_items);
}

function exportCSV() {
  if (!_items.length) return alert('No data to export.');
  var rows = [['Email','Name','Edition','Ref Code','Source','Onboarding Tag','Date']];
  _items.forEach(function(i) {
    rows.push([i.email || '', i.name || '', i.edition || '', i.ref_code || '', i.source || '', i.onboarding_tag || '', i.subscribed_at || '']);
  });
  var csv = rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('
');
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'subscribers-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

refresh();
</script>
</body>
</html>
