<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrollments — Admin · GideonAbochie Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.stat-num.green{color:#34C77B}
.status-pill.active{background:rgba(34,197,94,.15);color:#34C77B}
.status-pill.pending{background:rgba(201,168,76,.12);color:#C9A84C}
.status-pill.completed{background:rgba(99,102,241,.12);color:#818CF8}
</style>
</head>
<body>
<div class="wrap">

  <h1 class="page-title">School <span>Enrollments</span></h1>
  <p class="page-desc">Student registrations across all programs.</p>

  <div class="stats" id="stats">
    <div class="stat-card"><span class="stat-num zero" id="totalEnrolled">—</span><span class="stat-label">Total Enrolled</span><span class="stat-note">All time</span></div>
    <div class="stat-card"><span class="stat-num green" id="totalActive">—</span><span class="stat-label">Active</span><span class="stat-note">Current students</span></div>
  </div>

  <div class="section-title">&#10003; Registration Records</div>
  <div class="refresh-bar">
    <span class="note" id="lastUpdated">Loading...</span>
    <button class="btn-sm" onclick="loadEnrollments()">&#8635; Refresh</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Student</th><th>Phone</th><th>Program</th><th>Enrolled</th><th>Status</th></tr></thead>
      <tbody id="enrollmentsBody"></tbody>
    </table>
  </div>
</div>
<div class="footer"><a href="index.html">&larr; Dashboard</a></div>
<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
if (!getAdminKey()) ensureAdminKey();
async function loadEnrollments() {
  document.getElementById('lastUpdated').textContent = 'Loading...';
  try {
    var res = await adminFetch('/admin/api/enrollments', {headers:{'Referer':'/admin/enrollments.html'}});
    if (!res.ok) throw new Error('Failed to load');
    var data = await res.json();
    var items = data.items || [];
    document.getElementById('totalEnrolled').textContent = items.length;
    document.getElementById('totalEnrolled').className = 'stat-num ' + (items.length > 0 ? 'green' : 'zero');
    var active = items.filter(function(i){return i.status === 'active'});
    document.getElementById('totalActive').textContent = active.length;
    document.getElementById('totalActive').className = 'stat-num ' + (active.length > 0 ? 'green' : 'zero');

    var html = '';
    if (items.length === 0) {
      html = '<tr><td colspan="5" class="table-empty">No enrollments yet.</td></tr>';
    } else {
      items.forEach(function(e) {
        var date = e.enrolled_at ? new Date(e.enrolled_at).toLocaleDateString() : '—';
        var statusClass = e.status === 'active' ? 'active' : (e.status === 'completed' ? 'completed' : 'pending');
        html += '<tr><td><div style="display:flex;flex-direction:column;gap:2px"><span style="color:#E8EEF7;font-weight:500;font-size:13px">' + escapeHtml(e.student_name || '—') + '</span><span style="color:#5A7A9F;font-size:11px">' + escapeHtml(e.student_email || '') + '</span></div></td><td style="font-size:12px;color:#5A7A9F">' + escapeHtml(e.student_phone || '—') + '</td><td style="font-size:13px;color:#CBD5E1">' + escapeHtml(e.program_title || '—') + '</td><td style="font-size:12px;color:#5A7A9F">' + escapeHtml(date) + '</td><td><span class="status-pill ' + escapeHtml(statusClass) + '">' + escapeHtml(e.status) + '</span></td></tr>';
      });
    }
    document.getElementById('enrollmentsBody').innerHTML = html;
    document.getElementById('lastUpdated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('enrollmentsBody').innerHTML = '<tr><td colspan="5" class="table-empty">Error loading enrollments. D1 not bound yet?</td></tr>';
    document.getElementById('lastUpdated').textContent = 'Error loading';
  }
}
loadEnrollments();
</script>
</body>
</html>
