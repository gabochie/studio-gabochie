<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content — Admin · Studio Gabochie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.tabs{display:flex;gap:4px;margin-bottom:24px;background:#0F1E38;border:1px solid #1E3250;border-radius:10px;padding:4px;overflow-x:auto}
.tab{flex:1;padding:10px 20px;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:transparent;color:#5A7A9F;transition:all .2s;white-space:nowrap}
.tab:hover{color:#E8EEF7}
.tab.active{background:#C9A84C;color:#0A1628}
.tab-content{display:none}
.tab-content.active{display:block}
.fields{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.field-row{display:flex;gap:12px;flex-wrap:wrap}
.field{flex:1;min-width:180px}
.field label{display:block;font-size:11px;color:#5A7A9F;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;background:#0A1628;border:1px solid #1E3250;border-radius:6px;padding:10px 14px;color:#E8EEF7;font-size:13px;font-family:inherit}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:#C9A84C}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:8px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card-content{flex:1}
.card-content .title{color:#E8EEF7;font-weight:600;font-size:14px;margin-bottom:4px}
.card-content .sub{color:#5A7A9F;font-size:12px}
.card-actions{display:flex;gap:6px;flex-shrink:0}
.card-actions button{padding:6px 12px;border-radius:4px;font-size:10px}
.inline-form{background:#0F1E38;border:1px solid #C9A84C;border-radius:8px;padding:20px;margin-bottom:16px}
.inline-form h3{color:#E8EEF7;font-size:14px;margin-bottom:12px}
.form-actions{display:flex;gap:8px;margin-top:8px}
.gallery-img{width:60px;height:60px;border-radius:6px;object-fit:cover;background:#1E3250;flex-shrink:0}
.item-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <h1 class="page-title">Content <span>Manager</span></h1>
  <p class="page-desc">Manage testimonials, impact stats, and gallery items. All changes save to D1 database.</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('testimonials')">Testimonials</button>
    <button class="tab" onclick="switchTab('stats')">Stats</button>
    <button class="tab" onclick="switchTab('gallery')">Gallery</button>
  </div>

  <!-- TESTIMONIALS -->
  <div id="tab-testimonials" class="tab-content active">
    <button class="btn btn-gold" onclick="showForm('testimonial')">+ Add Testimonial</button>
    <div id="testimonialForm" class="inline-form" style="display:none"></div>
    <div id="testimonialsList"></div>
  </div>

  <!-- STATS -->
  <div id="tab-stats" class="tab-content">
    <button class="btn btn-gold" onclick="showForm('stat')">+ Add Stat</button>
    <div id="statForm" class="inline-form" style="display:none"></div>
    <div id="statsList"></div>
  </div>

  <!-- GALLERY -->
  <div id="tab-gallery" class="tab-content">
    <button class="btn btn-gold" onclick="showForm('gallery')">+ Add Gallery Item</button>
    <div id="galleryForm" class="inline-form" style="display:none"></div>
    <div id="galleryList"></div>
  </div>

</div>
<div class="footer"><a href="index.html">&larr; Dashboard</a></div>

<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
if (!getAdminKey()) ensureAdminKey();
var currentTab = 'testimonials';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('.tab[onclick*="' + tab + '"]').classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  loadTab(tab);
}

function loadTab(tab) {
  if (tab === 'testimonials') loadTestimonials();
  else if (tab === 'stats') loadStats();
  else if (tab === 'gallery') loadGallery();
}

// ── API helper ──
function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  return adminFetch(path, opts).then(function(r){return r.json()});
}

// ── TESTIMONIALS ──
function loadTestimonials() {
  api('/admin/api/testimonials').then(function(data) {
    var items = data.items || [];
    var html = '';
    if (!items.length) {
      html = '<div class="table-empty">No testimonials yet. Add one to get started.</div>';
    } else {
      items.forEach(function(t) {
        html += '<div class="card"><div class="card-content"><div class="title">' + escapeHtml(t.author) + (t.role ? ' <span style="color:#5A7A9F;font-weight:400">· ' + escapeHtml(t.role) + '</span>' : '') + (t.rating ? ' <span style="color:#C9A84C">' + '★'.repeat(t.rating) + '</span>' : '') + '</div><div class="sub">' + escapeHtml((t.content || '').slice(0, 120)) + (t.content && t.content.length > 120 ? '...' : '') + '</div></div><div class="card-actions"><button class="btn btn-ghost" onclick="editTestimonial(' + t.id + ')">Edit</button><button class="btn btn-danger" onclick="deleteTestimonial(' + t.id + ')">Delete</button></div></div>';
      });
    }
    document.getElementById('testimonialsList').innerHTML = html;
  });
}

function showForm(type, data) {
  var form = document.getElementById(type + 'Form');
  if (type === 'testimonial') {
    var a = data ? escapeHtml(data.author || '') : '';
    var r = data ? escapeHtml(data.role || '') : '';
    var rt = data ? escapeHtml(String(data.rating || 5)) : '5';
    var c = data ? escapeHtml(data.content || '') : '';
    form.innerHTML = '<h3>' + (data ? 'Edit Testimonial' : 'New Testimonial') + '</h3><div class="fields"><div class="field-row"><div class="field"><label>Author</label><input id="tAuthor" value="' + a + '"></div><div class="field"><label>Role</label><input id="tRole" value="' + r + '"></div><div class="field"><label>Rating (1-5)</label><input id="tRating" type="number" min="1" max="5" value="' + rt + '"></div></div><div class="field"><label>Content</label><textarea id="tContent">' + c + '</textarea></div></div><div class="form-actions"><button class="btn btn-gold" onclick="saveTestimonial(' + (data ? data.id : 'null') + ')">Save</button><button class="btn btn-ghost" onclick="hideForm(\'testimonial\')">Cancel</button></div>';
  } else if (type === 'stat') {
    var sl = data ? escapeHtml(data.label || '') : '';
    var sv = data ? escapeHtml(data.value || '') : '';
    var si = data ? escapeHtml(data.icon || '') : '';
    var so = data ? escapeHtml(String(data.sort_order || 0)) : '0';
    form.innerHTML = '<h3>' + (data ? 'Edit Stat' : 'New Stat') + '</h3><div class="fields"><div class="field-row"><div class="field"><label>Label</label><input id="sLabel" value="' + sl + '"></div><div class="field"><label>Value</label><input id="sValue" value="' + sv + '"></div><div class="field"><label>Icon (emoji)</label><input id="sIcon" value="' + si + '"></div></div><div class="field"><label>Sort Order</label><input id="sOrder" type="number" value="' + so + '"></div></div><div class="form-actions"><button class="btn btn-gold" onclick="saveStat(' + (data ? data.id : 'null') + ')">Save</button><button class="btn btn-ghost" onclick="hideForm(\'stat\')">Cancel</button></div>';
  } else if (type === 'gallery') {
    var gt = data ? escapeHtml(data.title || '') : '';
    var gc = data ? escapeHtml(data.category || '') : '';
    var go = data ? escapeHtml(String(data.sort_order || 0)) : '0';
    var gi = data ? escapeHtml(data.image_url || '') : '';
    var gd = data ? escapeHtml(data.description || '') : '';
    form.innerHTML = '<h3>' + (data ? 'Edit Gallery Item' : 'New Gallery Item') + '</h3><div class="fields"><div class="field-row"><div class="field"><label>Title</label><input id="gTitle" value="' + gt + '"></div><div class="field"><label>Category</label><input id="gCategory" value="' + gc + '"></div><div class="field"><label>Sort Order</label><input id="gOrder" type="number" value="' + go + '"></div></div><div class="field"><label>Image URL</label><input id="gImage" value="' + gi + '"></div><div class="field"><label>Description</label><textarea id="gDesc">' + gd + '</textarea></div></div><div class="form-actions"><button class="btn btn-gold" onclick="saveGallery(' + (data ? data.id : 'null') + ')">Save</button><button class="btn btn-ghost" onclick="hideForm(\'gallery\')">Cancel</button></div>';
  }
  form.style.display = 'block';
}

function hideForm(type) {
  document.getElementById(type + 'Form').style.display = 'none';
}

function saveTestimonial(id) {
  var body = {author: document.getElementById('tAuthor').value, role: document.getElementById('tRole').value, content: document.getElementById('tContent').value, rating: parseInt(document.getElementById('tRating').value) || 5};
  var method = id ? 'PUT' : 'POST';
  var url = '/admin/api/testimonials' + (id ? '?id=' + id : '');
  api(url, {method:method, body:JSON.stringify(body), headers:{'Content-Type':'application/json'}}).then(function() {
    hideForm('testimonial');
    loadTestimonials();
  });
}

function editTestimonial(id) {
  api('/admin/api/testimonials?id=' + id).then(function(t) {
    showForm('testimonial', t);
  });
}

function deleteTestimonial(id) {
  if (!confirm('Delete this testimonial?')) return;
  api('/admin/api/testimonials?id=' + id, {method:'DELETE'}).then(function(data) {
    if (data && data.status === 'ok') loadTestimonials();
    else Toast.error(data.message || data.error || 'Delete failed');
  }).catch(function(e) {
    Toast.error('Network error: ' + (e.message || 'Could not reach server'));
  });
}

// ── STATS ──
function loadStats() {
  api('/admin/api/stats').then(function(data) {
    var items = data.items || [];
    var html = '';
    if (!items.length) {
      html = '<div class="table-empty">No stats yet. Add one to get started.</div>';
    } else {
      items.forEach(function(s) {
        html += '<div class="card"><div class="card-content"><div class="title">' + escapeHtml(s.icon || '') + ' ' + escapeHtml(s.label) + ': <span style="color:#C9A84C">' + escapeHtml(s.value) + '</span></div><div class="sub">Order: ' + escapeHtml(String(s.sort_order || 0)) + '</div></div><div class="card-actions"><button class="btn btn-ghost" onclick="editStat(' + s.id + ')">Edit</button><button class="btn btn-danger" onclick="deleteStat(' + s.id + ')">Delete</button></div></div>';
      });
    }
    document.getElementById('statsList').innerHTML = html;
  });
}

function saveStat(id) {
  var body = {label: document.getElementById('sLabel').value, value: document.getElementById('sValue').value, icon: document.getElementById('sIcon').value, sort_order: parseInt(document.getElementById('sOrder').value) || 0};
  var method = id ? 'PUT' : 'POST';
  var url = '/admin/api/stats' + (id ? '?id=' + id : '');
  api(url, {method:method, body:JSON.stringify(body), headers:{'Content-Type':'application/json'}}).then(function() {
    hideForm('stat');
    loadStats();
  });
}

function editStat(id) {
  api('/admin/api/stats?id=' + id).then(function(s) {
    showForm('stat', s);
  });
}

function deleteStat(id) {
  if (!confirm('Delete this stat?')) return;
  api('/admin/api/stats?id=' + id, {method:'DELETE'}).then(function(data) {
    if (data && data.status === 'ok') loadStats();
    else Toast.error(data.message || data.error || 'Delete failed');
  }).catch(function(e) {
    Toast.error('Network error: ' + (e.message || 'Could not reach server'));
  });
}

// ── GALLERY ──
function loadGallery() {
  api('/admin/api/gallery').then(function(data) {
    var items = data.items || [];
    var html = '';
    if (!items.length) {
      html = '<div class="table-empty">No gallery items yet. Add one to get started.</div>';
    } else {
      items.forEach(function(g) {
        html += '<div class="card"><img src="' + escapeHtml(g.image_url || '') + '" alt="' + escapeHtml(g.title || 'Gallery image') + '" class="gallery-img" onerror="this.style.display=\'none\'"><div class="card-content"><div class="title">' + escapeHtml(g.title) + (g.category ? ' <span style="color:#5A7A9F;font-weight:400">· ' + escapeHtml(g.category) + '</span>' : '') + '</div><div class="sub">' + escapeHtml((g.description || '').slice(0, 80)) + (g.description && g.description.length > 80 ? '...' : '') + '</div></div><div class="card-actions"><button class="btn btn-ghost" onclick="editGallery(' + g.id + ')">Edit</button><button class="btn btn-danger" onclick="deleteGallery(' + g.id + ')">Delete</button></div></div>';
      });
    }
    document.getElementById('galleryList').innerHTML = html;
  });
}

function saveGallery(id) {
  var body = {title: document.getElementById('gTitle').value, description: document.getElementById('gDesc').value, image_url: document.getElementById('gImage').value, category: document.getElementById('gCategory').value, sort_order: parseInt(document.getElementById('gOrder').value) || 0};
  var method = id ? 'PUT' : 'POST';
  var url = '/admin/api/gallery' + (id ? '?id=' + id : '');
  api(url, {method:method, body:JSON.stringify(body), headers:{'Content-Type':'application/json'}}).then(function() {
    hideForm('gallery');
    loadGallery();
  });
}

function editGallery(id) {
  api('/admin/api/gallery?id=' + id).then(function(g) {
    showForm('gallery', g);
  });
}

function deleteGallery(id) {
  if (!confirm('Delete this gallery item?')) return;
  api('/admin/api/gallery?id=' + id, {method:'DELETE'}).then(function(data) {
    if (data && data.status === 'ok') loadGallery();
    else Toast.error(data.message || data.error || 'Delete failed');
  }).catch(function(e) {
    Toast.error('Network error: ' + (e.message || 'Could not reach server'));
  });
}

// Init
loadTestimonials();
</script>
</body>
</html>
