<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classifieds — Admin · Studio Gabochie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.tabs{display:flex;gap:4px;margin-bottom:20px;background:#0F1E38;border:1px solid #1E3250;border-radius:10px;padding:4px}
.tab{flex:1;padding:8px 16px;border:none;border-radius:8px;font-family:Syne,sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:#5A7A9F;transition:all .2s;text-align:center}
.tab:hover{color:#E8EEF7}
.tab.active{background:#C9A84C;color:#0A1628}
.tab .count{font-size:10px;opacity:.7;margin-left:4px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#0F1E38;border:1px solid #1E3250;border-radius:8px;padding:12px;text-align:center}
.stat .num{font-family:Syne,sans-serif;font-size:24px;font-weight:700;color:#C9A84C;display:block}
.stat .label{font-size:10px;color:#5A7A9F;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters select,.filters input{background:#0A1628;border:1px solid #1E3250;border-radius:6px;padding:8px 12px;color:#CDD5E0;font-size:12px;font-family:Inter,sans-serif}
.filters input{flex:1;min-width:180px}
.list{display:grid;gap:10px}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-title{font-family:Syne,sans-serif;font-size:15px;font-weight:600;color:#F1F5F9;flex:1}
.card-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#5A7A9F;font-family:Inter,sans-serif}
.card-meta span{background:#0A1628;padding:3px 8px;border-radius:4px}
.card-body{font-size:13px;color:#94A3B8;line-height:1.6}
.card-actions{display:flex;gap:8px;margin-top:4px}
.badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-family:Inter,sans-serif}
.badge.pending{background:rgba(234,179,8,.15);color:#F59E0B}
.badge.approved{background:rgba(34,197,94,.15);color:#22C55E}
.badge.rejected{background:rgba(239,68,68,.15);color:#EF4444}
.badge.expired{background:rgba(107,114,128,.15);color:#6B7280}
.badge.featured{background:rgba(245,194,0,.2);color:#F5C200}
.empty{text-align:center;padding:40px;color:#5A7A9F;font-size:13px}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:20px}
.page-btn{background:#0F1E38;border:1px solid #1E3250;border-radius:6px;padding:6px 14px;color:#CDD5E0;font-size:12px;cursor:pointer;font-family:Inter,sans-serif}
.page-btn:hover{border-color:#C9A84C;color:#C9A84C}
.page-btn.active{background:#C9A84C;color:#0A1628;border-color:#C9A84C}
</style>
</head>
<body>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<div class="wrap">
  <div class="header">
    <a href="../index.html" class="header-brand"><img src="../assets/images/logo.png" alt=""><span>Studio Gabochie</span></a>
    <span class="header-tag">Admin Panel</span>
    <div class="header-nav">
      <a href="index.html">Dashboard</a>
      <a href="classifieds.html" class="active">Classifieds</a>
    </div>
  </div>

  <h1>📋 <span style="color:#C9A84C">Classifieds</span> Moderation</h1>
  <p style="color:#5A7A9F;font-size:13px;margin-bottom:20px">Review, approve, reject, and manage classified listings from the public submission form.</p>

  <div class="stat-row" id="statsRow"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" onclick="setFilter('status','')">All</button>
    <button class="tab" onclick="setFilter('status','pending')">Pending</button>
    <button class="tab" onclick="setFilter('status','approved')">Approved</button>
    <button class="tab" onclick="setFilter('status','rejected')">Rejected</button>
    <button class="tab" onclick="setFilter('status','expired')">Expired</button>
  </div>

  <div class="filters">
    <select id="categoryFilter" onchange="loadList()">
      <option value="">All Categories</option>
      <option value="jobs">Jobs</option>
      <option value="services">Services</option>
      <option value="products">Products</option>
      <option value="events">Events</option>
      <option value="housing">Housing</option>
      <option value="community">Community</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search title, name, email..." onkeyup="if(event.key==='Enter')loadList()">
    <button class="btn btn-ghost" onclick="loadList()" style="padding:8px 16px;font-size:12px">Search</button>
  </div>

  <div class="list" id="listContainer"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
var currentFilter = { status: '', category: '', search: '', page: 1 };

function setFilter(key, val) {
  currentFilter[key] = val;
  currentFilter.page = 1;
  document.querySelectorAll('#tabs .tab').forEach(function(t,i){
    t.classList.toggle('active', (key === 'status' && val === '' && i === 0) || (key === 'status' && t.textContent.trim().toLowerCase() === val));
  });
  loadList();
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['X-Admin-Key'] = getAdminKey();
  return fetch(path, opts).then(function(r){return r.json()});
}

function loadList() {
  var params = '?page=' + currentFilter.page + '&limit=30';
  if (currentFilter.status) params += '&status=' + currentFilter.status;
  if (currentFilter.category) params += '&category=' + currentFilter.category;
  var search = document.getElementById('searchInput').value.trim();
  if (search) params += '&search=' + encodeURIComponent(search);

  api('/admin/api/classifieds' + params).then(function(data) {
    if (data.status !== 'ok') throw new Error(data.error);
    renderStats(data.stats || []);
    renderList(data.items || []);
    renderPagination(data);
  }).catch(function(err) {
    document.getElementById('listContainer').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
  });
}

function renderStats(stats) {
  var html = '';
  var map = {};
  stats.forEach(function(s){ map[s.status] = s.c; });
  map['_total'] = (map['pending'] || 0) + (map['approved'] || 0) + (map['rejected'] || 0) + (map['expired'] || 0);
  var items = [
    { label: 'Total', key: '_total' },
    { label: 'Pending', key: 'pending' },
    { label: 'Approved', key: 'approved' },
    { label: 'Rejected', key: 'rejected' },
    { label: 'Expired', key: 'expired' },
  ];
  items.forEach(function(item) {
    html += '<div class="stat"><span class="num">' + (map[item.key] || 0) + '</span><span class="label">' + item.label + '</span></div>';
  });
  document.getElementById('statsRow').innerHTML = html;
}

function renderList(items) {
  var html = '';
  if (!items.length) {
    html = '<div class="empty">No listings found.</div>';
  } else {
    items.forEach(function(item) {
      var statusClass = item.status;
      var statusBadge = '<span class="badge ' + statusClass + '">' + item.status + '</span>';
      if (item.featured) statusBadge += ' <span class="badge featured">Featured</span>';
      var expiry = item.expires_at ? new Date(item.expires_at + 'Z').toLocaleDateString() : 'Never';
      var createdAt = item.created_at ? new Date(item.created_at + 'Z').toLocaleDateString() : '';
      html += '<div class="card">';
      html += '<div class="card-header">';
      html += '<div><div class="card-title">' + escapeHtml(item.title) + '</div>';
      html += '<div class="card-meta"><span>' + escapeHtml(item.category) + '</span><span>' + escapeHtml(item.listing_type) + '</span>' + (item.price ? '<span>' + escapeHtml(item.price) + '</span>' : '') + (item.location ? '<span>' + escapeHtml(item.location) + '</span>' : '') + '<span>Created: ' + createdAt + '</span><span>Expires: ' + expiry + '</span></div></div>';
      html += '<div>' + statusBadge + '</div>';
      html += '</div>';
      if (item.description) html += '<div class="card-body">' + escapeHtml(item.description) + '</div>';
      html += '<div class="card-meta">' +
        (item.contact_name ? '<span>👤 ' + escapeHtml(item.contact_name) + '</span>' : '') +
        (item.contact_email ? '<span>📧 ' + escapeHtml(item.contact_email) + '</span>' : '') +
        (item.contact_phone ? '<span>📞 ' + escapeHtml(item.contact_phone) + '</span>' : '') +
        (item.website ? '<span>🌐 ' + escapeHtml(item.website) + '</span>' : '') +
      '</div>';
      html += '<div class="card-actions">';
      if (item.status === 'pending') {
        html += '<button class="btn btn-ghost" onclick="updateStatus(' + item.id + ',\'approved\')" style="color:#22C55E;font-size:12px">✓ Approve</button>';
        html += '<button class="btn btn-ghost" onclick="updateStatus(' + item.id + ',\'rejected\')" style="color:#EF4444;font-size:12px">✗ Reject</button>';
      }
      if (item.status === 'approved') {
        html += '<button class="btn btn-ghost" onclick="toggleFeatured(' + item.id + ',' + (item.featured ? 0 : 1) + ')" style="color:#F5C200;font-size:12px">' + (item.featured ? 'Unfeature' : '⭐ Feature') + '</button>';
        html += '<button class="btn btn-ghost" onclick="updateStatus(' + item.id + ',\'expired\')" style="color:#6B7280;font-size:12px">Expire</button>';
      }
      html += '<button class="btn btn-danger" onclick="deleteListing(' + item.id + ')" style="font-size:12px">Delete</button>';
      html += '</div></div>';
    });
  }
  document.getElementById('listContainer').innerHTML = html;
}

function renderPagination(data) {
  var html = '';
  if (data.pages > 1) {
    for (var i = 1; i <= data.pages; i++) {
      html += '<button class="page-btn' + (i === data.page ? ' active' : '') + '" onclick="currentFilter.page=' + i + ';loadList()">' + i + '</button>';
    }
  }
  document.getElementById('pagination').innerHTML = html;
}

function updateStatus(id, status) {
  api('/admin/api/classifieds?id=' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': getAdminKey() },
    body: JSON.stringify({ status: status })
  }).then(function(data) {
    if (data.status === 'ok') loadList();
    else Toast.error(data.error || 'Update failed');
  }).catch(function(e) { Toast.error('Error: ' + e.message); });
}

function toggleFeatured(id, val) {
  api('/admin/api/classifieds?id=' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': getAdminKey() },
    body: JSON.stringify({ featured: val })
  }).then(function(data) {
    if (data.status === 'ok') loadList();
    else Toast.error(data.error || 'Update failed');
  }).catch(function(e) { Toast.error('Error: ' + e.message); });
}

function deleteListing(id) {
  if (!confirm('Delete this listing?')) return;
  api('/admin/api/classifieds?id=' + id, { method: 'DELETE', headers: { 'X-Admin-Key': getAdminKey() } }).then(function(data) {
    if (data.status === 'ok') loadList();
    else Toast.error(data.error || 'Delete failed');
  }).catch(function(e) { Toast.error('Error: ' + e.message); });
}

loadList();
</script>
</body>
</html>
