<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveys — Admin · Studio Gabochie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">

  <h1 class="page-title">Learning <span>Survey</span></h1>
  <p class="page-desc">Responses from the conversational survey on <a href="../survey/" target="_blank" style="color:#C9A84C">/survey/</a></p>

  <div class="stats-row" style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
    <div class="stat-card" style="background:#0F1E38;border:1px solid #1E3250;border-radius:8px;padding:12px 20px;min-width:120px">
      <div style="font-size:11px;color:#5A7A9F;text-transform:uppercase;letter-spacing:.5px">Total</div>
      <div id="totalCount" style="font-size:28px;font-weight:700;color:#E8EEF7;margin-top:2px">-</div>
    </div>
    <button class="btn btn-outline" onclick="loadSurveys()">&#8635; Refresh</button>
    <button class="btn btn-gold" onclick="exportCSV()">&#8595; Export CSV</button>
  </div>

  <div id="topicFilters" style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap"></div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Topic</th><th>Learning Style</th><th>Time</th><th>Program</th><th>Date</th><th>Source</th><th></th></tr></thead>
      <tbody id="surveysBody"><tr><td colspan="9" style="text-align:center;padding:32px;color:#3A5278">Loading responses&hellip;</td></tr></tbody>
    </table>
  </div>
</div>
<div class="footer"><a href="index.html">&larr; Dashboard</a></div>

<div class="m-overlay" id="detailModal">
  <div class="m">
    <div class="m-title" id="detailTitle">Response</div>
    <div class="m-body" id="detailBody"></div>
    <div class="m-footer"><button class="btn btn-secondary" onclick="Modal.close('detailModal')">Close</button></div>
  </div>
</div>

<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
var currentTopic = '';

if (!getAdminKey()) ensureAdminKey();

function loadSurveys() {
  var url = '/api/admin/surveys';
  if (currentTopic) url += '?topic=' + encodeURIComponent(currentTopic);
  document.getElementById('surveysBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#3A5278">Loading&hellip;</td></tr>';
  adminFetch(url).then(function(r){return r.json()}).then(function(d){
    if(d.status!=='ok') throw new Error(d.message);
    var items = d.items || [];
    var topic_counts = d.topic_counts || [];
    document.getElementById('totalCount').textContent = items.length;

    renderTopicFilters(topic_counts);

    if(!items.length){
      document.getElementById('surveysBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#3A5278">No responses yet</td></tr>';
      return;
    }
    var html = items.map(function(s){
      var prog = s.recommended_program || '';
      var progLabel = prog.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase()}).slice(0,20);
      var recShort = s.recommendation ? s.recommendation.slice(0,60) + (s.recommendation.length>60?'...':'') : '-';
      return '<tr>' +
        '<td><strong>' + escapeHtml(s.name||'-') + '</strong></td>' +
        '<td style="font-family:monospace;font-size:12px;color:#C9A84C">' + escapeHtml(s.phone||'-') + '</td>' +
        '<td><span class="source-tag">' + escapeHtml(s.topic||'-') + '</span></td>' +
        '<td style="font-size:12px;color:#5A7A9F">' + escapeHtml(s.learning_style||'-') + '</td>' +
        '<td style="font-size:12px;color:#5A7A9F">' + escapeHtml(s.time_commitment||'-') + '</td>' +
        '<td style="font-size:11px;color:#C9A84C;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(prog) + '">' + escapeHtml(progLabel) + '</td>' +
        '<td style="font-size:11px;color:#5A7A9F;white-space:nowrap">' + escapeHtml(new Date(s.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})) + '</td>' +
        '<td><span class="source-tag">' + escapeHtml(s.source||'web') + '</span></td>' +
        '<td><button class="btn-icon" onclick="viewResponse(' + escapeHtml(s.id) + ')" title="View">&#8594;</button></td>' +
        '</tr>';
    }).join('');
    document.getElementById('surveysBody').innerHTML = html;
  }).catch(function(e){
    document.getElementById('surveysBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#E8637A">Failed: ' + escapeHtml(e.message) + '</td></tr>';
  });
}

function renderTopicFilters(topic_counts) {
  var container = document.getElementById('topicFilters');
  var html = '<button class="tag' + (!currentTopic ? ' tag-green' : '') + '" style="cursor:pointer" onclick="filterTopic(\'\')">All</button>';
  topic_counts.forEach(function(t) {
    if (!t.topic) return;
    var active = currentTopic === t.topic;
    html += '<button class="tag' + (active ? ' tag-green' : '') + '" style="cursor:pointer" onclick="filterTopic(\'' + escapeHtml(t.topic) + '\')">' + escapeHtml(t.topic) + ' (' + t.c + ')</button>';
  });
  container.innerHTML = html;
}

function filterTopic(topic) {
  currentTopic = topic;
  loadSurveys();
}

function exportCSV() {
  window.open('/api/admin/surveys?export=csv&_=' + Date.now(), '_blank');
}

function viewResponse(id) {
  adminFetch('/api/admin/surveys').then(function(r){return r.json()}).then(function(d){
    var s = (d.items||[]).filter(function(x){return x.id===id})[0];
    if(!s){Toast.error('Not found');return;}
    var h = '';
    h += '<div class="m-detail-row"><span class="mdl-l">Name</span><span class="mdl-v"><strong>' + escapeHtml(s.name||'-') + '</strong></span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Phone</span><span class="mdl-v" style="font-family:monospace;color:#C9A84C">' + escapeHtml(s.phone||'-') + '</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Topic</span><span class="mdl-v"><span class="source-tag">' + escapeHtml(s.topic||'-') + '</span></span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Learning Style</span><span class="mdl-v">' + escapeHtml(s.learning_style||'-') + '</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Time Commitment</span><span class="mdl-v">' + escapeHtml(s.time_commitment||'-') + '</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Recommended Program</span><span class="mdl-v" style="color:#C9A84C">' + escapeHtml(s.recommended_program||'-') + '</span></div>';
    if (s.recommendation) {
      h += '<div class="m-detail-row"><span class="mdl-l">Recommendation</span><span class="mdl-v" style="font-size:13px;line-height:1.6;max-height:150px;overflow-y:auto">' + escapeHtml(s.recommendation) + '</span></div>';
    }
    h += '<div class="m-detail-row"><span class="mdl-l">Source</span><span class="mdl-v"><span class="source-tag">' + escapeHtml(s.source||'web') + '</span></span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Source URL</span><span class="mdl-v" style="font-size:11px;word-break:break-all">' + escapeHtml(s.source_url||'-') + '</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Date</span><span class="mdl-v">' + escapeHtml(new Date(s.created_at).toLocaleString()) + '</span></div>';
    h += '<div style="margin-top:14px;border-top:1px solid #1E3250;padding-top:14px">' +
      '<a href="https://wa.me/' + encodeURIComponent(s.phone.replace(/[^0-9]/g,'')) + '" target="_blank" class="btn btn-gold" style="display:inline-block;padding:10px 18px;font-size:12px;text-decoration:none">&#128172; Open WhatsApp</a>' +
      '</div>';
    document.getElementById('detailTitle').textContent = 'Response #' + s.id;
    document.getElementById('detailBody').innerHTML = h;
    document.getElementById('detailModal').classList.add('open');
  }).catch(function(e){Toast.error('Failed: ' + e.message);});
}

loadSurveys();
</script>
</body>
</html>
