<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submissions — Admin · Studio Gabochie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">

  <h1 class="page-title">Form <span>Submissions</span></h1>
  <p class="page-desc">Lead capture requests from the Manifesto form and other site forms.</p>

  <div style="margin-bottom:16px">
    <button class="btn btn-outline" onclick="loadSubmissions()">&#8635; Refresh</button>
    <span id="subCount" style="margin-left:10px;font-size:12px;color:#5A7A9F"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Date</th><th>Source</th><th>Status</th><th></th></tr></thead>
      <tbody id="subsBody"><tr><td colspan="7" style="text-align:center;padding:32px;color:#3A5278">Loading submissions&hellip;</td></tr></tbody>
    </table>
  </div>
</div>
<div class="footer"><a href="index.html">&larr; Dashboard</a></div>

<div class="m-overlay" id="detailModal">
  <div class="m">
    <div class="m-title" id="detailTitle">Submission</div>
    <div class="m-body" id="detailBody"></div>
    <div class="m-footer"><button class="btn btn-secondary" onclick="document.getElementById('detailModal').classList.remove('open')">Close</button></div>
  </div>
</div>

<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
if (!getAdminKey()) ensureAdminKey();
function loadSubmissions() {
  document.getElementById('subsBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#3A5278">Loading&hellip;</td></tr>';
  adminFetch('/api/admin/submissions').then(function(r){return r.json()}).then(function(d){
    if(d.status!=='ok')throw new Error(d.message);
    var items=d.items||[];
    document.getElementById('subCount').textContent = items.length + ' submission(s)';
    if(!items.length){
      document.getElementById('subsBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#3A5278">No submissions yet</td></tr>';
      return;
    }
    var html = items.map(function(s){
      var stCls = s.status==='new'?'tag-yellow':s.status==='read'?'tag-blue':s.status==='replied'?'tag-green':'tag-dim';
      return '<tr><td>'+escapeHtml(s.name||'-')+'</td><td>'+escapeHtml(s.email||'-')+'</td><td style="font-size:12px;color:#94A3B8;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(s.subject||'-')+'</td><td style="font-size:12px;color:#5A7A9F">'+escapeHtml(new Date(s.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}))+'</td><td><span class="source-tag">'+escapeHtml(s.source||'web')+'</span></td><td><span class="tag '+escapeHtml(stCls)+'">'+escapeHtml(s.status)+'</span></td><td><button class="btn-icon" onclick="viewSubmission('+escapeHtml(s.id)+')" title="View">&#8594;</button></td></tr>';
    }).join('');
    document.getElementById('subsBody').innerHTML = html;
  }).catch(function(e){
    document.getElementById('subsBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#E8637A">Failed: '+escapeHtml(e.message)+'</td></tr>';
  });
}

function viewSubmission(id) {
  adminFetch('/api/admin/submissions').then(function(r){return r.json()}).then(function(d){
    var s=(d.items||[]).filter(function(x){return x.id===id})[0];
    if(!s){Toast.error('Not found');return;}
    var h = '';
    h += '<div class="m-detail-row"><span class="mdl-l">Name</span><span class="mdl-v">'+escapeHtml(s.name||'-')+'</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Email</span><span class="mdl-v">'+escapeHtml(s.email||'-')+'</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Subject</span><span class="mdl-v">'+escapeHtml(s.subject||'-')+'</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Source</span><span class="mdl-v">'+escapeHtml(s.source||'web')+'</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Date</span><span class="mdl-v">'+escapeHtml(new Date(s.created_at).toLocaleString())+'</span></div>';
    if(s.message) h += '<div class="m-detail-row"><span class="mdl-l">Message</span><span class="mdl-v" style="font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto">'+escapeHtml(s.message)+'</span></div>';
    h += '<div class="m-detail-row"><span class="mdl-l">Status</span><span class="mdl-v">'+escapeHtml(s.status||'new')+'</span></div>';
    h += '<div style="display:flex;gap:6px;margin-top:14px">'+
      (s.status==='new'?'<button class="btn btn-secondary btn-sm" onclick="markSub('+id+',\'read\')">Mark Read</button>':'')+
      (s.status==='read'?'<button class="btn btn-primary btn-sm" onclick="markSub('+id+',\'replied\')">Mark Replied</button>':'')+
      '</div>';
    document.getElementById('detailTitle').textContent = 'Submission #'+id;
    document.getElementById('detailBody').innerHTML = h;
    document.getElementById('detailModal').classList.add('open');
  }).catch(function(e){Toast.error('Failed: '+e.message);});
}

function markSub(id, status) {
  adminFetch('/api/admin/submissions?id='+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})}).then(function(r){return r.json()}).then(function(d){
    if(d.status==='ok'){document.getElementById('detailModal').classList.remove('open');loadSubmissions();}
    else throw new Error(d.message);
  }).catch(function(e){Toast.error('Failed: '+e.message);});
}

loadSubmissions();
</script>
</body>
</html>
