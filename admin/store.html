<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store — Admin · GideonAbochie Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
.tab-bar{display:flex;gap:4px;margin-bottom:20px;background:#0F1E38;border-radius:8px;padding:4px;border:1px solid #1E3250}
.tab-btn{flex:1;padding:10px;border:none;border-radius:6px;background:transparent;color:#5A7A9F;font-family:Inter,sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.tab-btn.active{background:#C9A84C;color:#0A1628;font-weight:600}
.tab-btn:hover:not(.active){background:#1E3250;color:#CBD5E1}
.tab-content{display:none}
.tab-content.active{display:block}
.delivery-status{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.delivery-status.pending{background:rgba(201,168,76,.12);color:#C9A84C}
.delivery-status.confirmed{background:rgba(99,102,241,.12);color:#818CF8}
.delivery-status.shipped{background:rgba(52,199,123,.12);color:#34C77B}
.delivery-status.delivered{background:rgba(34,197,94,.15);color:#22C55E}
.delivery-status.cancelled{background:rgba(232,99,122,.12);color:#E8637A}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.inv-card{background:#0F1E38;border:1px solid #1E3250;border-radius:8px;padding:14px}
.inv-card h4{font-family:Syne,sans-serif;font-size:13px;color:#F1F5F9;margin:0 0 8px}
.inv-card .size-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1E3250}
.inv-card .size-row:last-child{border-bottom:none}
.inv-card .size-row .sz{color:#8A9BB5;font-size:12px;font-weight:500}
.inv-card .size-row input{width:60px;background:#0A1628;border:1px solid #1E3250;border-radius:4px;padding:4px 6px;color:#E8EEF7;font-size:12px;text-align:center;font-family:Space Mono,monospace}
.inv-card .size-row .qty-ok{color:#34C77B;font-size:11px}
.inv-card .size-row .qty-low{color:#C9A84C;font-size:11px}
.inv-card .size-row .qty-out{color:#E8637A;font-size:11px}
.order-detail{font-size:12px;color:#5A7A9F;line-height:1.6}
.order-detail strong{color:#CBD5E1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,22,40,.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#0F1E38;border:1px solid #1E3250;border-radius:12px;padding:24px;width:100%;max-width:440px;position:relative}
.modal-box h3{font-family:Syne,sans-serif;font-size:16px;color:#F1F5F9;margin:0 0 16px}
.modal-box label{display:block;font-size:12px;color:#94A3B8;font-weight:500;margin-bottom:4px}
.modal-box input,.modal-box select{width:100%;background:#0A1628;border:1px solid #1E3250;border-radius:6px;padding:8px 12px;color:#E8EEF7;font-size:13px;font-family:inherit;outline:none;margin-bottom:14px;box-sizing:border-box}
.modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:6px 10px;background:#0A1628;border:1px solid #1E3250;border-radius:6px;color:#CBD5E1;font-size:12px;font-family:Inter,sans-serif;outline:none}
.filter-bar select option{background:#0A1628}
</style>
</head>
<body>
<div class="wrap">

  <h1 class="page-title">Store <span>Management</span></h1>
  <p class="page-desc">Manage merch orders, inventory, and delivery settings.</p>

  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="inventory">Inventory</button>
    <button class="tab-btn" data-tab="settings">Settings</button>
  </div>

  <!-- ─── Orders Tab ─── -->
  <div class="tab-content active" id="tabOrders">
    <div class="section-title">&#128230; Orders</div>
    <div class="filter-bar">
      <select id="orderStatusFilter"><option value="">All statuses</option><option value="pending">Pending</option><option value="completed">Completed (paid)</option></select>
      <select id="deliveryFilter"><option value="">All delivery</option><option value="pending">Pending delivery</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option></select>
      <button class="btn-sm" onclick="loadOrders()">&#8635; Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Customer</th><th>Item</th><th>Amount</th><th>Delivery</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ─── Inventory Tab ─── -->
  <div class="tab-content" id="tabInventory">
    <div class="section-title">&#128230; Stock Levels</div>
    <p class="page-desc">Edit quantities and press Save on each row.</p>
    <div class="inv-grid" id="invGrid"></div>
  </div>

  <!-- ─── Settings Tab ─── -->
  <div class="tab-content" id="tabSettings">
    <div class="section-title">&#9881; Delivery Settings</div>
    <div style="max-width:400px">
      <label style="display:block;font-size:12px;color:#94A3B8;font-weight:500;margin-bottom:4px">Accra/Tema Delivery Fee (GH¢)</label>
      <input id="feeLocal" type="number" step="1" min="0" style="width:100%;background:#0A1628;border:1px solid #1E3250;border-radius:6px;padding:8px 12px;color:#E8EEF7;font-size:13px;font-family:inherit;outline:none;margin-bottom:14px;box-sizing:border-box">
      <label style="display:block;font-size:12px;color:#94A3B8;font-weight:500;margin-bottom:4px">Upcountry Delivery Fee (GH¢)</label>
      <input id="feeUpcountry" type="number" step="1" min="0" style="width:100%;background:#0A1628;border:1px solid #1E3250;border-radius:6px;padding:8px 12px;color:#E8EEF7;font-size:13px;font-family:inherit;outline:none;margin-bottom:14px;box-sizing:border-box">
      <label style="display:block;font-size:12px;color:#94A3B8;font-weight:500;margin-bottom:4px">Free Delivery Threshold (GH¢, 0 = disabled)</label>
      <input id="feeThreshold" type="number" step="1" min="0" style="width:100%;background:#0A1628;border:1px solid #1E3250;border-radius:6px;padding:8px 12px;color:#E8EEF7;font-size:13px;font-family:inherit;outline:none;margin-bottom:18px;box-sizing:border-box">
      <p id="settingsMsg" style="font-size:12px;margin:0 0 10px;display:none"></p>
      <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>

</div>
<div class="footer"><a href="index.html">&larr; Dashboard</a></div>
<script src="admin-ui.js"></script>
<script src="admin.js"></script>
<script src="sidebar.js"></script>
<script>
if (!getAdminKey()) ensureAdminKey();

var PRODUCT_NAMES = { 'soc-tshirt': 'School of Creativity T-Shirt', 'nation-builder-tee': 'Nation Builder Tee', 'studio-hoodie': 'Studio Logo Hoodie', 'wisdom-cap': 'Wisdom Cap' };
var PRODUCT_ORDER = ['soc-tshirt', 'nation-builder-tee', 'studio-hoodie', 'wisdom-cap'];

// ── Tab switching ──
document.getElementById('tabBar').addEventListener('click', function(e) {
  var btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab' + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add('active');
  if (btn.dataset.tab === 'orders') loadOrders();
  if (btn.dataset.tab === 'inventory') loadInventory();
  if (btn.dataset.tab === 'settings') loadSettings();
});

// ── Orders ──
function loadOrders() {
  var url = '/admin/api/store/orders';
  var params = [];
  var statusVal = document.getElementById('orderStatusFilter').value;
  var deliveryVal = document.getElementById('deliveryFilter').value;
  if (statusVal) params.push('status=' + encodeURIComponent(statusVal));
  if (deliveryVal) params.push('delivery_status=' + encodeURIComponent(deliveryVal));
  if (params.length) url += '?' + params.join('&');
  adminFetch(url).then(function(r){ return r.json(); }).then(function(d){
    var items = d.orders || [];
    var tbody = document.getElementById('ordersBody');
    if (!items.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#5A7A9F;padding:30px">No orders found.</td></tr>'; return; }
    tbody.innerHTML = items.map(function(o){
      var ds = o.delivery_status || 'pending';
      var dsClass = ds;
      var statusLabel = o.status || 'pending';
      return '<tr>' +
        '<td style="white-space:nowrap;font-size:11px">' + (o.created_at || '').slice(0,10) + '</td>' +
        '<td><strong>' + (o.customer_name || '') + '</strong><br><span style="font-size:11px;color:#5A7A9F">' + (o.customer_email || '') + '</span></td>' +
        '<td>' + (o.item_name || '') + '<br><span style="font-size:11px;color:#5A7A9F">' + (o.item_variant || '') + '</span></td>' +
        '<td>GH¢ ' + (o.amount || 0) + (o.delivery_fee ? '<br><span style="font-size:11px;color:#5A7A9F">+ GH¢' + o.delivery_fee + ' delivery</span>' : '') + '</td>' +
        '<td style="max-width:150px;font-size:11px;color:#5A7A9F">' + (o.shipping_city || '') + (o.shipping_region ? ', ' + o.shipping_region : '') + '<br>' + (o.customer_phone || '') + '</td>' +
        '<td><span class="delivery-status ' + dsClass + '">' + ds + '</span><br><span style="font-size:10px;color:#3A5278">' + statusLabel + '</span></td>' +
        '<td style="white-space:nowrap">' +
          actionButtons(o) +
        '</td></tr>';
    }).join('');
  }).catch(function(){ document.getElementById('ordersBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#E8637A;padding:30px">Error loading orders.</td></tr>'; });
}

function actionButtons(o) {
  var ds = o.delivery_status || 'pending';
  var btns = '';
  if (ds === 'pending' || ds === 'confirmed') {
    btns += '<button class="btn-xs" onclick="openShipModal(' + o.id + ',\'' + (o.courier_name || '') + '\',\'' + (o.tracking_info || '') + '\')">Ship</button> ';
  }
  if (ds === 'shipped') {
    btns += '<button class="btn-xs" onclick="updateDelivery(' + o.id + ',\'delivered\')">Delivered</button> ';
  }
  btns += '<button class="btn-xs" onclick="showOrderDetail(' + o.id + ')">Detail</button>';
  return btns;
}

function updateDelivery(id, status) {
  if (!confirm('Mark as ' + status + '?')) return;
  adminFetch('/admin/api/store/orders', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, delivery_status: status })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.status === 'ok') loadOrders();
  }).catch(function(){ alert('Error updating order.'); });
}

function openShipModal(id, courier, tracking) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML =
    '<div class="modal-box">' +
      '<button onclick="this.closest(\'.modal-overlay\').remove()" style="position:absolute;top:10px;right:14px;background:none;border:none;color:#5A7A9F;font-size:18px;cursor:pointer">&times;</button>' +
      '<h3>Mark as Shipped</h3>' +
      '<label>Courier / Delivery Service</label>' +
      '<input id="shipCourier" value="' + courier + '" placeholder="e.g. Bolt, Ghana Post">' +
      '<label>Tracking ID / Reference</label>' +
      '<input id="shipTracking" value="' + tracking + '" placeholder="Tracking number or reference">' +
      '<div class="btn-row">' +
        '<button class="btn btn-outline" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
        '<button class="btn btn-primary" id="shipConfirmBtn">Confirm Shipped</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('shipConfirmBtn').addEventListener('click', function() {
    var courier = document.getElementById('shipCourier').value.trim();
    var tracking = document.getElementById('shipTracking').value.trim();
    adminFetch('/admin/api/store/orders', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, delivery_status: 'shipped', courier_name: courier, tracking_info: tracking })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.status === 'ok') { overlay.remove(); loadOrders(); }
    }).catch(function(){ alert('Error.'); });
  });
}

function showOrderDetail(id) {
  adminFetch('/admin/api/store/orders').then(function(r){ return r.json(); }).then(function(d){
    var o = (d.orders || []).find(function(x){ return x.id === id; });
    if (!o) { alert('Order not found'); return; }
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal-box" style="max-width:500px">' +
        '<button onclick="this.closest(\'.modal-overlay\').remove()" style="position:absolute;top:10px;right:14px;background:none;border:none;color:#5A7A9F;font-size:18px;cursor:pointer">&times;</button>' +
        '<h3>Order #' + o.id + '</h3>' +
        '<div class="order-detail">' +
          '<p><strong>Date:</strong> ' + (o.created_at || '') + '</p>' +
          '<p><strong>Customer:</strong> ' + (o.customer_name || '') + ' (' + (o.customer_email || '') + ')</p>' +
          '<p><strong>Phone:</strong> ' + (o.customer_phone || '—') + '</p>' +
          '<p><strong>Item:</strong> ' + (o.item_name || '') + ' — ' + (o.item_variant || '') + '</p>' +
          '<p><strong>Amount:</strong> GH¢ ' + (o.amount || 0) + (o.delivery_fee ? ' + GH¢ ' + o.delivery_fee + ' delivery' : '') + '</p>' +
          '<p><strong>Delivery Address:</strong> ' + (o.shipping_city || '') + (o.shipping_region ? ', ' + o.shipping_region : '') + '</p>' +
          '<p><strong>Digital Address:</strong> ' + (o.shipping_digital_address || '—') + '</p>' +
          '<p><strong>Delivery Status:</strong> <span class="delivery-status ' + (o.delivery_status || 'pending') + '">' + (o.delivery_status || 'pending') + '</span></p>' +
          '<p><strong>Courier:</strong> ' + (o.courier_name || '—') + '</p>' +
          '<p><strong>Tracking:</strong> ' + (o.tracking_info || '—') + '</p>' +
          '<p><strong>Transaction:</strong> <code style="font-size:11px;color:#5A7A9F">' + (o.tx_ref || '') + '</code></p>' +
        '</div>' +
        '<div class="btn-row"><button class="btn btn-outline" onclick="this.closest(\'.modal-overlay\').remove()">Close</button></div>' +
      '</div>';
    document.body.appendChild(overlay);
  }).catch(function(){ alert('Error loading order.'); });
}

// ── Inventory ──
function loadInventory() {
  adminFetch('/admin/api/store/inventory').then(function(r){ return r.json(); }).then(function(d){
    var items = d.items || [];
    var bySlug = {};
    items.forEach(function(i){
      if (!bySlug[i.product_slug]) bySlug[i.product_slug] = [];
      bySlug[i.product_slug].push(i);
    });
    var grid = document.getElementById('invGrid');
    grid.innerHTML = PRODUCT_ORDER.map(function(slug){
      var rows = bySlug[slug] || [];
      var name = PRODUCT_NAMES[slug] || slug;
      var sizeHtml = rows.map(function(r){
        var cls = r.quantity > 3 ? 'qty-ok' : r.quantity > 0 ? 'qty-low' : 'qty-out';
        var label = r.quantity > 3 ? 'In Stock' : r.quantity > 0 ? 'Low (' + r.quantity + ')' : 'Out';
        return '<div class="size-row">' +
          '<span class="sz">' + r.size + '</span>' +
          '<div><input type="number" min="0" id="inv-' + r.id + '" value="' + r.quantity + '" style="display:inline-block;width:50px">' +
          '<span class="' + cls + '" style="margin-left:6px">' + label + '</span>' +
          '<button class="btn-xs" onclick="saveInv(' + r.id + ')" style="margin-left:4px">Save</button></div>' +
        '</div>';
      }).join('');
      return '<div class="inv-card"><h4>' + name + '</h4>' + sizeHtml + '</div>';
    }).join('');
  }).catch(function(){ document.getElementById('invGrid').innerHTML = '<p style="color:#E8637A">Error loading inventory.</p>'; });
}

function saveInv(id) {
  var qty = parseInt(document.getElementById('inv-' + id).value) || 0;
  adminFetch('/admin/api/store/inventory', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, quantity: qty })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.status === 'ok') loadInventory();
  }).catch(function(){ alert('Error saving.'); });
}

// ── Settings ──
function loadSettings() {
  fetch('/api/store/config').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('feeLocal').value = d.delivery_fee_local || 20;
    document.getElementById('feeUpcountry').value = d.delivery_fee_upcountry || 50;
    document.getElementById('feeThreshold').value = d.delivery_free_threshold || 0;
  }).catch(function(){});
}

function saveSettings() {
  var local = document.getElementById('feeLocal').value;
  var upcountry = document.getElementById('feeUpcountry').value;
  var threshold = document.getElementById('feeThreshold').value;
  var msg = document.getElementById('settingsMsg');
  var key = getAdminKey();
  Promise.all([
    fetch('/api/admin/update-setting', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ key: 'merch_delivery_fee_local', value: String(parseFloat(local) || 20) })
    }),
    fetch('/api/admin/update-setting', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ key: 'merch_delivery_fee_upcountry', value: String(parseFloat(upcountry) || 50) })
    }),
    fetch('/api/admin/update-setting', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
      body: JSON.stringify({ key: 'merch_delivery_free_threshold', value: String(parseFloat(threshold) || 0) })
    })
  ]).then(function(){
    msg.textContent = 'Settings saved!';
    msg.style.color = '#34C77B';
    msg.style.display = 'block';
    __storeConfig = null; // clear cached config
    setTimeout(function(){ msg.style.display = 'none'; }, 3000);
  }).catch(function(){
    msg.textContent = 'Error saving settings.';
    msg.style.color = '#E8637A';
    msg.style.display = 'block';
  });
}

// Init
loadOrders();
</script>
</body>
</html>
