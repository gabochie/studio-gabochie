<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tuner — Gideon Guitar Method</title>
<link rel="stylesheet" href="/assets/css/design.css"><link rel="stylesheet" href="/assets/css/guitar.css">
</head>
<body>
<div class="screen active">
  <div class="hdr"><div class="logo">🎸 Tuner</div></div>
  <div style="flex:1;overflow-y:auto;padding:16px 20px;max-width:700px;margin:0 auto;width:100%">

    <div id="tuner-request-microphone" style="text-align:center;padding:40px 0">
      <div style="font-size:48px;margin-bottom:12px">🎤</div>
      <div class="section-title" style="justify-content:center">Chromatic Guitar Tuner</div>
      <div class="section-sub">Allow microphone access to start tuning</div>
      <button class="btn-primary" id="request-mic-btn">Enable Microphone <i class="ti ti-microphone"></i></button>
      <p id="mic-error" style="color:var(--red-light);font-size:12px;margin-top:12px;display:none"></p>
    </div>

    <div id="tuner-active" style="display:none;text-align:center">
      <div style="position:relative;width:120px;height:120px;margin:20px auto">
        <canvas id="tuner-canvas" width="120" height="120" style="width:120px;height:120px"></canvas>
        <div id="tuner-note" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:700;font-family:'Syne',sans-serif;color:var(--gold)">--</div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:12px" id="tuner-octave">--</div>
      <div id="tuner-freq" style="font-size:11px;color:var(--text3);margin-bottom:12px;font-family:monospace">--- Hz</div>
      <div id="tuner-string" style="padding:4px 12px;border-radius:20px;background:var(--surface2);display:inline-block;font-size:11px;color:var(--text2)">--</div>
      <div id="tuner-cents" style="height:4px;background:var(--grey2);border-radius:2px;margin:16px 0;max-width:240px;margin-left:auto;margin-right:auto;position:relative">
        <div style="position:absolute;left:50%;top:-6px;width:2px;height:16px;background:var(--text3)"></div>
        <div id="tuner-cents-fill" style="height:100%;width:50%;border-radius:2px;background:var(--green-light);transition:width .1s"></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px">
        <span class="tuner-string-green" onclick="playTargetNote(6)">E</span>
        <span class="tuner-string-green" onclick="playTargetNote(5)">A</span>
        <span class="tuner-string-green" onclick="playTargetNote(4)">D</span>
        <span class="tuner-string-green" onclick="playTargetNote(3)">G</span>
        <span class="tuner-string-green" onclick="playTargetNote(2)">B</span>
        <span class="tuner-string-green" onclick="playTargetNote(1)">e</span>
      </div>
      <button class="btn-secondary" id="tuner-stop-btn" style="margin-top:16px">Stop Tuner</button>
    </div>

    <div id="tuner-history" style="margin-top:20px"></div>
  </div>

  <div class="bottom-nav" style="border-top:1px solid rgba(255,255,255,.06);padding:6px 0 10px">
    <a class="nav-item" href="/guitar/"><i class="ti ti-home"></i><span>Home</span></a>
    <a class="nav-item" href="/guitar/learn/"><i class="ti ti-book"></i><span>Learn</span></a>
    <a class="nav-item" href="/guitar/practice/"><i class="ti ti-player-play"></i><span>Practice</span></a>
    <a class="nav-item" href="/guitar/dashboard/"><i class="ti ti-trending-up"></i><span>Progress</span></a>
    <a class="nav-item" href="/guitar/songs/"><i class="ti ti-music"></i><span>Songs</span></a>
    <a class="nav-item active" href="/guitar/tuner/"><i class="ti ti-ear"></i><span>Tuner</span></a>
  </div>
</div>

<script src="/assets/js/guitar/app.js"></script>
<script src="/assets/js/guitar/tuner.js"></script>
<script>
const STRING_TARGETS = {6:82.41,5:110,4:146.83,3:196,2:246.94,1:329.63};
let tuner;

async function playTargetNote(stringNum) {
  try {
    if (!tuner) tuner = new GuitarTuner();
    const freq = STRING_TARGETS[stringNum];
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.1;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
    osc.stop(ctx.currentTime + 0.8);
  } catch(e) {}
}

document.getElementById('request-mic-btn').onclick = async function() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, echoCancellation: false, noiseSuppression: false, autoGainControl: false });
    document.getElementById('tuner-request-microphone').style.display = 'none';
    document.getElementById('tuner-active').style.display = 'block';

    tuner = new GuitarTuner();
    tuner.start(stream, function(result) {
      if (!result) {
        document.getElementById('tuner-note').textContent = '--';
        document.getElementById('tuner-freq').textContent = '--- Hz';
        document.getElementById('tuner-string').textContent = '--';
        return;
      }
      document.getElementById('tuner-note').textContent = result.note;
      document.getElementById('tuner-octave').textContent = 'Octave ' + result.octave;
      document.getElementById('tuner-freq').textContent = result.frequency.toFixed(1) + ' Hz';
      document.getElementById('tuner-string').textContent = result.closestString || '--';

      // Cents meter
      const cents = Math.min(Math.max(result.centsOffset + 50, 0), 100);
      const fill = document.getElementById('tuner-cents-fill');
      fill.style.width = cents + '%';
      fill.style.background = Math.abs(result.centsOffset) < 5 ? 'var(--green-light)' : Math.abs(result.centsOffset) < 15 ? 'var(--gold)' : 'var(--red-light)';

      // Canvas needle visualization
      const canvas = document.getElementById('tuner-canvas');
      const ctx = canvas.getContext('2d');
      const cx = 60, cy = 60, r = 50;
      ctx.clearRect(0, 0, 120, 120);
      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI * 0.75, Math.PI * 0.25);
      ctx.strokeStyle = 'rgba(255,255,255,.1)';
      ctx.lineWidth = 4;
      ctx.stroke();
      const angle = -Math.PI * 0.75 + (Math.PI * (cents / 100));
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * r * 0.7, cy + Math.sin(angle) * r * 0.7);
      ctx.strokeStyle = Math.abs(result.centsOffset) < 5 ? 'var(--green-light)' : 'var(--gold)';
      ctx.lineWidth = 3;
      ctx.stroke();
    });
  } catch(e) {
    document.getElementById('mic-error').textContent = 'Microphone access denied. Please allow microphone access in your browser settings.';
    document.getElementById('mic-error').style.display = 'block';
  }
};

document.getElementById('tuner-stop-btn').onclick = function() {
  if (tuner) { tuner.stop(); }
  document.getElementById('tuner-request-microphone').style.display = 'block';
  document.getElementById('tuner-active').style.display = 'none';
};
</script>
</body></html>
