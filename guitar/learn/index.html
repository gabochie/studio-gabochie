<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Structured guitar curriculum — 16 modules from beginner chords to barre chords, fingerpicking, and soloing. Free lessons available."><meta property="og:title" content="Learn Guitar — Gideon Guitar Method"><meta property="og:description" content="Structured guitar curriculum — 16 modules from beginner chords to barre chords, fingerpicking, and soloing. Free lessons available."><meta property="og:type" content="website"><meta property="og:url" content="https://gideonabochie.org/guitar/learn/"><title>Learn — Gideon Guitar Method</title>
<link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/guitar.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
.readaloud-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;margin-bottom:12px;flex-wrap:wrap}
.readaloud-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;letter-spacing:.08em;text-transform:uppercase}
.readaloud-btn.play{background:#C9A84C;color:#0A1628}
.readaloud-btn.play:hover{background:#D9B85C}
.readaloud-btn.play.active{background:#E8637A}
.readaloud-btn.play.active:hover{background:#EF7A94}
.readaloud-btn.stop{background:rgba(255,255,255,.06);color:#CBD5E1;border:1px solid #1E3250}
.readaloud-btn.stop:hover{background:rgba(255,255,255,.1)}
.readaloud-status{font-size:12px;color:#8A9BB5;flex:1;min-width:100px}
.readaloud-voice{background:#0A1628;border:1px solid #1E3250;border-radius:6px;color:#CBD5E1;font-size:11px;padding:5px 8px;font-family:inherit;max-width:180px;cursor:pointer}
.readaloud-rate{display:flex;align-items:center;gap:4px;font-size:11px;color:#8A9BB5}
.readaloud-rate input{width:60px;accent-color:#C9A84C;cursor:pointer}
.readaloud-highlight{background:rgba(201,168,76,.15);border-radius:2px;transition:background .2s}
</style>
</head>

<div class="screen active">
  <div class="hdr"><div class="hdr-logo"><span class="icon">🎸</span> Learn</div><div id="om-progress" style="font-size:11px;color:var(--text3)"></div><div id="user-area"></div></div>
  <div id="learn-content" class="scrollable" style="flex:1;overflow-y:auto;padding:16px 20px;max-width:700px;margin:0 auto;width:100%"><div style="padding:20px"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text" style="width:80%"></div><div style="margin-top:16px"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></div></div>
  <nav class="bottom-nav">
    <a class="nav-item" href="/guitar/"><i class="ti ti-home"></i><span>Home</span></a>
    <a class="nav-item active" href="/guitar/learn/"><i class="ti ti-book"></i><span>Learn</span></a>
    <a class="nav-item" href="/guitar/practice/"><i class="ti ti-player-play"></i><span>Practice</span></a>
    <a class="nav-item" href="/guitar/dashboard/"><i class="ti ti-trending-up"></i><span>Progress</span></a>
    <a class="nav-item" href="/guitar/songs/"><i class="ti ti-music"></i><span>Songs</span></a>
    <a class="nav-item" href="/guitar/tuner/"><i class="ti ti-ear"></i><span>Tuner</span></a>
  </nav>
</div>

<script src="/assets/js/guitar/app.js"></script>
<script>
const MODULES = [
  {id:1,tier:'bronze',title:'Meet Your Guitar',lessons:[{id:1,title:'Parts of the Guitar',video:'',duration:5},{id:2,title:'How to Hold the Guitar',video:'',duration:5},{id:3,title:'How to Tune Your Guitar',video:'',duration:8},{id:4,title:'Posture & Ergonomics Check',video:'',duration:4}]},
  {id:2,tier:'bronze',title:'The Fretboard',lessons:[{id:5,title:'Open String Names',video:'',duration:5},{id:6,title:'Finger Independence Exercises',video:'',duration:8},{id:7,title:'Natural Notes on the Fretboard',video:'',duration:8},{id:8,title:'Fretboard Quiz',video:'',duration:5}]},
  {id:3,tier:'bronze',title:'The Power 5 Chords',lessons:[{id:9,title:'Em — The Easiest Chord',video:'',duration:6},{id:10,title:'Am — Your Second Chord',video:'',duration:6},{id:11,title:'G + C + D — The Big Three',video:'',duration:10},{id:12,title:'Chord Change Bootcamp',video:'',duration:10}]},
  {id:4,tier:'bronze',title:'Rhythm Foundation',lessons:[{id:13,title:'Understanding Rhythm',video:'',duration:6},{id:14,title:'Down-Only Strumming',video:'',duration:8},{id:15,title:'The Metronome Challenge',video:'',duration:8},{id:16,title:'Practice Session Structure',video:'',duration:4}]},
  {id:5,tier:'bronze',title:'One-Minute Changes',lessons:[{id:17,title:'Em ↔ Am Speed Drill',video:'',duration:8},{id:18,title:'Am ↔ G Speed Drill',video:'',duration:8},{id:19,title:'G ↔ C ↔ D Circuit',video:'',duration:10},{id:20,title:'One-Minute Championship',video:'',duration:12}]},
  {id:6,tier:'silver',title:'Your First Song',lessons:[{id:21,title:'2-Chord Songs Overview',video:'',duration:10},{id:22,title:'Wish Me Well — Sarkodie',video:'',duration:15},{id:23,title:'Playing with the Recording',video:'',duration:10},{id:24,title:'Song Learning Method',video:'',duration:5}]},
  {id:7,tier:'silver',title:'New Chords',lessons:[{id:25,title:'Dm — The Sad Chord',video:'',duration:8},{id:26,title:'A — Full Major Sound',video:'',duration:8},{id:27,title:'E — Big Open Chord',video:'',duration:8},{id:28,title:'B7 — Blues Essential',video:'',duration:8}]},
  {id:8,tier:'silver',title:'Strumming Patterns',lessons:[{id:29,title:'Down-Up Strumming',video:'',duration:10},{id:30,title:'Muting & Accents',video:'',duration:8},{id:31,title:'Dynamics & Feel',video:'',duration:10},{id:32,title:'Strumming Pattern Challenge',video:'',duration:12}]},
  {id:9,tier:'silver',title:'Scales & Melody',lessons:[{id:33,title:'C Major Scale — Open Position',video:'',duration:10},{id:34,title:'Playing Simple Melodies',video:'',duration:10},{id:35,title:'Ear Training Basics',video:'',duration:8},{id:36,title:'Two-Note Power Chords',video:'',duration:8}]},
  {id:10,tier:'silver',title:'Barre Chords',lessons:[{id:37,title:'The F Chord Challenge',video:'',duration:12},{id:38,title:'Bm — Barre Shape Mastery',video:'',duration:10},{id:39,title:'Movable Major Shapes',video:'',duration:10},{id:40,title:'Barre Chord Progressions',video:'',duration:12}]},
  {id:11,tier:'gold',title:'Fingerpicking',lessons:[{id:41,title:'Thumb-Index Pattern',video:'',duration:10},{id:42,title:'Travis Picking',video:'',duration:12},{id:43,title:'Fingerstyle Arpeggios',video:'',duration:10},{id:44,title:'Fingerstyle Song Study',video:'',duration:15}]},
  {id:12,tier:'gold',title:'Advanced Rhythm',lessons:[{id:45,title:'16th Note Strumming',video:'',duration:10},{id:46,title:'Syncopation',video:'',duration:10},{id:47,title:'Swing & Shuffle Feel',video:'',duration:8},{id:48,title:'Odd Time Signatures',video:'',duration:12}]},
  {id:13,tier:'gold',title:'Pentatonic & Soloing',lessons:[{id:49,title:'A Minor Pentatonic Shape',video:'',duration:10},{id:50,title:'String Bends & Slides',video:'',duration:10},{id:51,title:'Blues Licks & Phrasing',video:'',duration:12},{id:52,title:'Solo Over a Backing Track',video:'',duration:15}]},
  {id:14,tier:'gold',title:'Chord Theory',lessons:[{id:53,title:'How Chords Are Built',video:'',duration:10},{id:54,title:'Major & Minor Explained',video:'',duration:8},{id:55,title:'Chord Inversions',video:'',duration:10},{id:56,title:'Common Progression Analysis',video:'',duration:12}]},
  {id:15,tier:'gold',title:'Performance & Expression',lessons:[{id:57,title:'Playing with Dynamics',video:'',duration:8},{id:58,title:'Stage Presence Basics',video:'',duration:10},{id:59,title:'Playing with Other Musicians',video:'',duration:10},{id:60,title:'Building a Setlist',video:'',duration:8}]},
  {id:16,tier:'gold',title:'Next Steps',lessons:[{id:61,title:'Building a Practice Routine',video:'',duration:8},{id:62,title:'Introduction to Recording',video:'',duration:10},{id:63,title:'Guitar Gear Guide',video:'',duration:10},{id:64,title:'Your Guitar Journey Ahead',video:'',duration:8}]}
];

(async function() {
  let user, enrollStatus = null;
  try {
    user = await Guitar.init();
  } catch(e) { user = null; }
  Guitar.applyConfig();
  try {
    var vidData = await (await fetch('/api/guitar/lessons/videos')).json();
    if (vidData.videos) {
      MODULES.forEach(function(m) { m.lessons.forEach(function(l) { if (vidData.videos[l.id]) l.video = vidData.videos[l.id]; }); });
    }
  } catch(e) { /* keep hardcoded video IDs */ }
  const c = document.getElementById('learn-content');
  const p = new URLSearchParams(location.search);
  const modId = p.get('module') ? parseInt(p.get('module')) : null;
  const lesId = p.get('lesson') ? parseInt(p.get('lesson')) : null;
  try { enrollStatus = await Guitar.getEnrollStatus(); } catch(e) {}

  function isModuleAccessible(m) {
    if (m.id <= 3) return true;
    if (m.id <= 5) return !!user;
    return enrollStatus?.unlocked === true;
  }

  function renderModules() {
    c.innerHTML = `<div class="section-title">📚 All Modules</div><div class="section-sub">Select a module to start learning</div>`;
    const tiers = ['bronze','silver','gold'];
    const td = { bronze:{icon:'🥉',name:'Foundation'}, silver:{icon:'🥈',name:'Songcraft'}, gold:{icon:'🥇',name:'Expression'} };
    for (const t of tiers) {
      const ms = MODULES.filter(m => m.tier === t);
      if (!ms.length) continue;
      c.innerHTML += `<div class="curriculum-tier"><div class="tier-header" style="margin-top:16px"><span class="tier-badge">${td[t].icon}</span><div><div class="tier-title">${td[t].name}</div></div></div>`;
      ms.forEach(m => {
        const access = isModuleAccessible(m);
        c.innerHTML += `<div class="module-card card-hover" ${access?`onclick="location.href='?module=${m.id}'"`:''} style="${access?'':'opacity:.5;cursor:default'}"><div class="module-num">${access?'✓':'🔒'}</div><div class="module-info"><div class="module-name">${m.title}</div><div class="module-lessons">${m.lessons.length} lessons</div></div>${access?'<i class="ti ti-chevron-right" style="color:var(--text3);font-size:16px"></i>':''}</div>`;
      });
      c.innerHTML += `</div>`;
    }
    if (!user) {
      c.innerHTML += `<div style="text-align:center;margin-top:24px;padding:20px;background:rgba(255,255,255,.04);border-radius:var(--radius-lg)"><div style="font-size:14px;margin-bottom:8px">🔓 Modules 1-${Guitar.FREE_MODULES} are free</div><div style="font-size:12px;color:var(--text3);margin-bottom:16px">Sign in to unlock Modules 4-5. Purchase full access for all 16 modules.</div><button class="btn btn-primary btn-sm" onclick="Guitar.showRegisterModal({redirect:'/guitar/learn/'})">Sign In <i class="ti ti-arrow-right"></i></button></div>`;
    } else if (!enrollStatus?.unlocked) {
      c.innerHTML += `<div style="text-align:center;margin-top:24px;padding:20px;background:rgba(255,255,255,.04);border-radius:var(--radius-lg)"><div style="font-size:14px;margin-bottom:8px">🔓 Premium Locked</div><div style="font-size:12px;color:var(--text3);margin-bottom:16px">Modules 6-16 are premium. Pay once, unlock forever.</div><a href="/guitar/songs/" class="btn btn-primary btn-sm">Pay ${Guitar.CURRENCY_SYMBOL} ${Guitar.PRICE} <i class="ti ti-arrow-right"></i></a></div>`;
      Guitar.trackEvent('paywall_view', { page: 'learn_modules' });
    }
    document.querySelectorAll('.card-hover').forEach((el,i) => { el.style.animation = `fadeUp .4s var(--ease-out) both`; el.style.animationDelay = `${i*60}ms`; });
  }

  async function renderModule(id) {
    Guitar.loading(c);
    const mod = MODULES.find(m => m.id === id);
    if (!mod) { renderModules(); return; }
    if (!isModuleAccessible(mod)) {
      c.innerHTML = `<button class="back-btn" onclick="location.href='/guitar/learn/'"><i class="ti ti-arrow-left"></i>All Modules</button>
        <div style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">🔒</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:8px">Module Locked</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:20px">${user?'Purchase full access to unlock this module.':'Sign in to unlock Modules 4-5, or purchase full access for all 16.'}</div>
        ${user?`<a href="/guitar/songs/" class="btn btn-primary">Pay ${Guitar.CURRENCY_SYMBOL} ${Guitar.PRICE}</a>`:'<button class="btn btn-primary" onclick="Guitar.showRegisterModal({redirect:\'/guitar/learn/\'})">Sign In</button>'}</div>`;
      Guitar.trackEvent('paywall_view', { page: 'learn_module_locked', module: id });
      return;
    }
    let progress = {};
    if (user) { try { const d = await Guitar.getModule(id); if (d.progress) progress = d.progress; } catch(e) {} }
    const done = Object.values(progress).filter(p => p.completed).length;
    const pct = Math.round((done/mod.lessons.length)*100);
    c.innerHTML = `<button class="back-btn" onclick="location.href='/guitar/learn/'"><i class="ti ti-arrow-left"></i>All Modules</button>
      <div class="section-title">${mod.title}</div>
      <div class="section-sub">${mod.lessons.length} lessons · ${mod.tier.charAt(0).toUpperCase()+mod.tier.slice(1)} tier</div>
      <div class="progress-bar mb-md"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    mod.lessons.forEach((l,i) => {
      const d = progress[l.id]?.completed;
      c.innerHTML += `<div class="lesson-card" onclick="location.href='?module=${id}&lesson=${l.id}'" style="animation:fadeUp .4s var(--ease-out) both;animation-delay:${i*60}ms">
        <div style="width:28px;height:28px;border-radius:50%;background:${d?'var(--gld)':'rgba(255,255,255,.06)'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:${d?'var(--black)':'var(--text3)'}">${d?'✓':l.id}</div>
        <div class="module-info"><div style="font-size:14px;font-weight:600">${l.title}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${l.duration} min</div></div>
        <i class="ti ti-player-play" style="color:var(--gld);font-size:18px"></i>
      </div>`;
    });
  }

  async function renderLesson(modId, lesId) {
    Guitar.loading(c);
    const mod = MODULES.find(m => m.id === modId);
    if (!mod) { renderModules(); return; }
    const lesson = mod.lessons.find(l => l.id === lesId);
    if (!lesson) { renderModule(modId); return; }

    c.innerHTML = `<button class="back-btn" onclick="location.href='?module=${modId}'"><i class="ti ti-arrow-left"></i>${mod.title}</button>
      <div class="section-title" style="font-size:17px">${lesson.title}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:16px">${lesson.duration} min · ${mod.tier.charAt(0).toUpperCase()+mod.tier.slice(1)}</div>`;

    if (lesson.video) {
      c.innerHTML += `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius-lg);margin-bottom:16px;background:rgba(0,0,0,.3)">
        <iframe src="${lesson.video}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen></iframe>
      </div>`;
    } else {
      c.innerHTML += `<div style="border-radius:var(--radius-lg);margin-bottom:16px;background:rgba(201,168,76,.06);border:1px dashed rgba(201,168,76,.25);padding:32px 20px;text-align:center">
        <div style="font-size:40px;margin-bottom:8px">🎥</div>
        <div style="font-family:'Syne',sans-serif;font-weight:600;color:var(--gld);font-size:14px">Video lesson coming soon</div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px">Follow the written guide below for now</div>
      </div>`;
    }

    const body = loadBody(modId, lesId);
    c.innerHTML += `<div class="readaloud-bar no-print" id="readAloudBar1" style="display:none">
      <button class="readaloud-btn play" id="playBtn1" onclick="toggleReadAloud('lessonBody','playBtn1','status1')">&#9654; Read Aloud</button>
      <button class="readaloud-btn stop" onclick="stopReadAloud()" style="display:none" id="stopBtn1">&#9632; Stop</button>
      <span class="readaloud-status" id="status1">Ready</span>
      <select class="readaloud-voice" id="voiceSelect1" onchange="changeVoice()"></select>
      <span class="readaloud-rate">Speed <input type="range" min="0.5" max="2" step="0.25" value="1" id="rateInput" oninput="changeRate(this.value)"></span>
    </div>`;
    c.innerHTML += `<div class="lesson-viewer" id="lessonBody">${body}</div>`;
    showReadAloud('1');

    if (user) {
      const prog = await Guitar.getModule(modId);
      const done = prog.progress?.[lesson.id]?.completed;
      c.innerHTML += `<div style="display:flex;gap:8px;margin-top:24px">
        <button class="btn btn-primary btn-block" id="complete-btn" data-done="${done?'1':'0'}">${done?'✓ Completed':'Mark Complete +10 XP'}</button>
      </div>`;
      document.getElementById('complete-btn').onclick = async function() {
        const isDone = this.dataset.done === '1';
        try {
          if (isDone) {
            await Guitar.fetch('/progress',{method:'POST',body:JSON.stringify({lesson_id:lesson.id,action:'uncomplete'})});
            this.dataset.done='0'; this.innerHTML='Mark Complete +10 XP';
          } else {
            const d = await Guitar.completeLesson(lesson.id);
            this.dataset.done='1'; this.innerHTML='✓ Completed';
            if (d.xpEarned) Guitar.showXP(d.xpEarned);
          }
        } catch(e) { Guitar.showToast('Error saving progress','error'); }
      };
    }

    const idx = mod.lessons.findIndex(l => l.id === lesId);
    const prev = idx > 0 ? mod.lessons[idx-1] : null;
    const next = idx < mod.lessons.length-1 ? mod.lessons[idx+1] : null;
    c.innerHTML += `<div style="display:flex;justify-content:space-between;margin-top:16px;gap:8px">
      ${prev?`<button class="btn btn-ghost" onclick="location.href='?module=${modId}&lesson=${prev.id}'"><i class="ti ti-arrow-left"></i>Previous</button>`:'<div></div>'}
      ${next?`<button class="btn btn-primary" onclick="location.href='?module=${modId}&lesson=${next.id}'">Next<i class="ti ti-arrow-right"></i></button>`:`<a href="/guitar/practice/" class="btn btn-primary">Practice Now <i class="ti ti-arrow-right"></i></a>`}
    </div>`;
  }

  function loadBody(modId, lesId) {
    const content = {
      1:'<p>The guitar has three main sections: the <strong>headstock</strong> (top), the <strong>neck</strong> (middle), and the <strong>body</strong> (bottom).</p><ul><li><strong>Headstock</strong> — holds the tuning pegs. Turn them to tighten or loosen strings.</li><li><strong>Nut</strong> — the small white slot where strings rest before the tuning pegs.</li><li><strong>Frets</strong> — the metal strips on the neck. Pressing a string behind a fret changes its pitch.</li><li><strong>Soundhole</strong> (acoustic) or <strong>pickups</strong> (electric) — where the sound comes out.</li><li><strong>Bridge</strong> — holds the strings at the body end.</li></ul><p>Touch each part on your actual guitar as you read — builds physical memory.</p>',
      2:'<p>Good posture prevents injury and makes playing easier.</p><p><strong>Sitting position:</strong> Sit on the edge of a chair. Rest the guitar on your picking-leg thigh. The neck points upward at about 45°. Keep your back straight.</p><p><strong>Left hand (fretting):</strong> Thumb behind the neck, opposite index finger. Curl fingers so tips press strings.</p><p><strong>Right hand (picking):</strong> Rest forearm lightly on the guitar body. Keep wrist relaxed.</p>',
      3:'<p><strong>Standard tuning (EADGBe):</strong></p><ul><li>String 6 (thickest) — E</li><li>String 5 — A</li><li>String 4 — D</li><li>String 3 — G</li><li>String 2 — B</li><li>String 1 (thinnest) — e</li></ul><p>Mnemonic: <strong>E</strong>ddie <strong>A</strong>te <strong>D</strong>ynamite <strong>G</strong>ood <strong>B</strong>ye <strong>E</strong>ddie</p><p>Use our <a href="/guitar/tuner/" style="color:var(--gld)">built-in tuner</a> to get in tune.</p>',
      4:'<p>Good ergonomics prevent fatigue and let you play longer.</p><p><strong>Chair height:</strong> Knees should be at a 90° angle. If your chair is too high, use a footstool under your picking foot.</p><p><strong>Guitar angle:</strong> The neck should point upward at 30-45°. This gives your fretting hand room to move freely.</p><p><strong>Wrist check:</strong> Your fretting wrist should be straight, not bent. If it bends, adjust the guitar angle or your sitting height.</p><p>Set a 5-minute timer and practice holding the guitar in good posture. Rest for 30 seconds, then repeat.</p>',
      5:'<p>Your guitar has 6 strings. From thickest to thinnest: <strong>E</strong> (6th), <strong>A</strong> (5th), <strong>D</strong> (4th), <strong>G</strong> (3rd), <strong>B</strong> (2nd), <strong>e</strong> (1st).</p><p>Drill: Name each string from thickest to thinnest 5 times without looking.</p>',
      6:'<p>Finger independence is the foundation of clean playing.</p><p><strong>Exercise 1 — Spider Walk:</strong> Place fingers 1-2-3-4 on frets 1-2-3-4 of string 6. Play each note one at a time. Move to string 5, repeat. Go across all 6 strings.</p><p><strong>Exercise 2 — 1-3-2-4:</strong> On string 6, play fret 1, then 3, then 2, then 4. Keep each finger down as you play. Move to the next string.</p><p>Start at 60 BPM. Only increase when every note rings cleanly.</p>',
      7:'<p>The notes on the fretboard repeat in patterns called <strong>octaves</strong>.</p><p><strong>Natural notes:</strong> A, B, C, D, E, F, G. No sharps or flats.</p><p>On string 5 (A): Open = A, Fret 2 = B, Fret 3 = C, Fret 5 = D, Fret 7 = E, Fret 8 = F, Fret 10 = G.</p><p>On string 6 (E): Open = E, Fret 1 = F, Fret 3 = G, Fret 5 = A, Fret 7 = B, Fret 8 = C, Fret 10 = D.</p><p><strong>Drill:</strong> Find every natural E on the fretboard. Then A. Then C. Use the <a href="/guitar/practice/?section=fretboard" style="color:var(--gld)">fretboard tool</a> to visualise.</p>',
      8:'<p>Test your fretboard knowledge with these challenges:</p><p><strong>Challenge 1:</strong> Name the note on string 6, fret 5. (Answer: A)</p><p><strong>Challenge 2:</strong> Find 3 different places to play the note A on the fretboard.</p><p><strong>Challenge 3:</strong> Play the C major scale — starting on string 5, fret 3 (C), go up to fret 5 (D), then string 4 open (G), fret 2 (A), etc.</p><p>Use the <a href="/guitar/practice/?section=fretboard" style="color:var(--gld)">fretboard tool</a> to check your answers.</p>',
      9:'<p><strong>Em (E minor)</strong> — only 2 fingers!</p><ul><li>Middle finger: String 5, Fret 2</li><li>Ring finger: String 4, Fret 2</li><li>Play all 6 strings</li></ul><p>Check: Are your fingertips pressing? Does every string ring clearly?</p>',
      10:'<p><strong>Am (A minor)</strong></p><ul><li>Index: String 2, Fret 1</li><li>Middle: String 4, Fret 2</li><li>Ring: String 3, Fret 2</li><li>Play strings 1-5 only</li></ul>',
      11:'<p><strong>G (G major)</strong></p><ul><li>Middle: String 6, Fret 3</li><li>Index: String 5, Fret 2</li><li>Ring: String 1, Fret 3</li><li>Play all 6 strings</li></ul><p><strong>C (C major)</strong></p><ul><li>Index: String 2, Fret 1</li><li>Middle: String 4, Fret 2</li><li>Ring: String 5, Fret 3</li><li>Do not play string 6</li></ul><p><strong>D (D major)</strong></p><ul><li>Index: String 3, Fret 2</li><li>Ring: String 1, Fret 2</li><li>Middle: String 2, Fret 3</li><li>Do not play strings 5 or 6</li></ul>',
      12:'<p>Chord changes are the #1 skill to master. Here is a bootcamp drill:</p><p><strong>Drill 1 — Silent Changes:</strong> Form Em. Lift all fingers. Form Am. Keep repeating. Do not strum. Just move. 20 reps.</p><p><strong>Drill 2 — Two-chord loop:</strong> Em → Am → G → Em. Strum once per chord. Focus on landing all fingers at the same time.</p><p><strong>Drill 3 — The full set:</strong> Em → Am → G → C → D. One strum per chord. Eyes on your fretting hand. Speed is not the goal — accuracy is.</p><p>Use the <a href="/guitar/practice/?section=one-minute" style="color:var(--gld)">One-Minute Drill</a> to test yourself.</p>',
      13:'<p><strong>What is 4/4 time?</strong> Count "1, 2, 3, 4". Each number is a <strong>beat</strong>.</p><p>With a metronome at 60 BPM: say "1, 2, 3, 4" with each click. Tap your foot on beats 1 and 3. Strum muted strings on each click.</p>',
      14:'<p>Start with downstrokes only.</p><p><strong>Exercise:</strong> Set metronome to 60 BPM. Strum down on each click. Count aloud: "1, 2, 3, 4".</p><p>Keep your wrist relaxed. The motion should come from your forearm rotating, not your whole arm.</p><p><strong>Tip:</strong> Imagine you are waving at someone — that same loose wrist motion is what you want.</p>',
      15:'<p>Using a metronome is the fastest way to improve your timing.</p><p><strong>Challenge 1:</strong> Set BPM to 70. Strum down on each click for 2 minutes.</p><p><strong>Challenge 2:</strong> At 70 BPM, strum on beats 1 and 3 only (half notes). Count the missing beats aloud.</p><p><strong>Challenge 3:</strong> At 80 BPM, alternate down-up on each click. Each click = one down or one up.</p><p>Use the <a href="/guitar/practice/?section=metronome" style="color:var(--gld)">metronome</a> in the practice section.</p>',
      16:'<p>A structured practice session is more effective than random playing.</p><p><strong>Recommended 20-minute split:</strong></p><ul><li><strong>Warmup (3 min):</strong> Finger independence, silent chord changes</li><li><strong>Drill (5 min):</strong> Isolate one weakness — chord changes, strumming, or scales</li><li><strong>Song practice (7 min):</strong> Play through real songs slowly</li><li><strong>Free play (5 min):</strong> Have fun — make up progressions, experiment</li></ul><p>Use the <a href="/guitar/practice/" style="color:var(--gld)">Practice Session Timer</a> to stay on track.</p>',
      17:'<p><strong>Goal:</strong> Switch between Em and Am as fast and cleanly as possible in 60 seconds.</p><p>Both chords share two fingers on frets 2. The difference: Em uses strings 5+4, Am uses strings 4+3+2.</p><p><strong>Technique:</strong> Keep your ring finger on string 4, fret 2. Only move your middle finger from string 5 to string 3.</p><p>Start slow. Accuracy first, speed will follow. Track your progress with the <a href="/guitar/practice/?section=one-minute" style="color:var(--gld)">One-Minute Drill</a>.</p>',
      18:'<p><strong>Goal:</strong> Switch between Am and G in 60 seconds.</p><p>Am has fingers on strings 2-4. G has fingers on strings 1, 5, 6. Both chords look very different.</p><p><strong>Anchor trick:</strong> When moving from Am to G, keep your ring finger hovering over strings 1-3. Plant it first on string 1, fret 3, then add the other fingers.</p><p><strong>From G to Am:</strong> Lift all fingers and drop them into the Am shape. Fight the urge to place them one at a time.</p>',
      19:'<p><strong>Goal:</strong> Cycle through G → C → D → G in 60 seconds.</p><p>This is the I-IV-V progression in G major — the most common progression in popular music.</p><p><strong>G → C:</strong> Your index finger goes to string 2. Middle moves from string 6 to string 4. Ring from string 1 to string 5.</p><p><strong>C → D:</strong> Lift all fingers. Index goes to string 3. Middle goes to string 2. Ring goes to string 1. Skip strings 5 and 6.</p><p><strong>D → G:</strong> Lift all fingers. Middle goes to string 6. Index goes to string 5. Ring goes to string 1.</p>',
      20:'<p>This is the final test: cycle through Em → Am → G → C → D continuously for 60 seconds.</p><p>One complete cycle = 5 chord changes. Count how many complete cycles you can do.</p><p><strong>Pro tip:</strong> Look ahead to the next chord while your fingers play the current one. Your brain processes the next shape before your hands move.</p><p>Record your score and try to beat it next session. Use the <a href="/guitar/practice/?section=one-minute" style="color:var(--gld)">One-Minute Drill</a>.</p>',
      21:'<p>Some of the best songs use only 2 chords. Here is how to spot them:</p><p>Look for songs where the chorus and verse use the same two chords. Common pairs: Em-Am, G-D, C-G, Am-Em.</p><p>Try playing these 2-chord progressions:</p><ul><li>Em → Am (minor, soulful)</li><li>G → D (major, uplifting)</li><li>Am → G (folk, narrative)</li><li>C → G (bright, open)</li></ul>',
      22:'<p><strong>Wish Me Well — Sarkodie</strong></p><p><strong>Chords:</strong> Em, Am</p><p><strong>Progression:</strong> Em → Am → Em → Am</p><p><strong>Strum:</strong> Down, down-down-up</p><p>Practice transitions first without strumming, then add the pattern.</p>',
      23:'<p>Playing along with a recording builds your sense of timing and feel.</p><p><strong>Step 1:</strong> Listen to the song once without playing. Notice where the chords change.</p><p><strong>Step 2:</strong> Mute the strings with your left hand and strum along to the recording. Match the rhythm exactly.</p><p><strong>Step 3:</strong> Play the chords along with the recording. If you get lost, jump back in at the next chord.</p><p><strong>Step 4:</strong> Record yourself playing along. Listen back. Compare your timing with the original.</p>',
      24:'<p>Learning a new song is a skill that improves with practice. Here is the method:</p><p><strong>1. Listen first:</strong> Listen to the song 3 times. Focus on the chord changes and structure.</p><p><strong>2. Learn the progression:</strong> Practice the chord changes without strumming. Get them smooth.</p><p><strong>3. Add the strum pattern:</strong> Use a simple downstroke pattern first. Get comfortable before adding complexity.</p><p><strong>4. Play along:</strong> Use the recording. Accept that you will make mistakes. Keep going.</p><p><strong>5. Polish:</strong> Focus on the tricky transitions. Drill them 10 times. Then play the whole song through.</p>',
      25:'<p><strong>Dm (D minor)</strong></p><ul><li>Index: String 1, Fret 1</li><li>Middle: String 3, Fret 2</li><li>Ring: String 2, Fret 3</li><li>Do not play strings 5 or 6</li></ul><p>Dm is the relative minor of F major. It appears in countless songs. The finger stretch between strings 1-3 is good practice for finger independence.</p><p><strong>Drill:</strong> Switch between Am and Dm 10 times. The index finger stays on string 1 in both chords — use it as an anchor.</p>',
      26:'<p><strong>A (A major)</strong></p><ul><li>Index: String 4, Fret 2</li><li>Middle: String 3, Fret 2</li><li>Ring: String 2, Fret 2</li><li>Do not play string 6</li></ul><p>Three fingers on the same fret — this is called a <strong>barre</strong> using three fingers. Keep your knuckles curved so only fingertips touch the strings.</p><p><strong>Alternate fingering:</strong> Many guitarists barre all three strings with just the index finger. Try both and see which feels better.</p>',
      27:'<p><strong>E (E major)</strong></p><ul><li>Index: String 3, Fret 1</li><li>Middle: String 5, Fret 2</li><li>Ring: String 4, Fret 2</li><li>Play all 6 strings</li></ul><p>E major sounds bright and full. It is the I chord in the key of E — one of the most guitar-friendly keys.</p><p>Compare E major with Em (the very first chord you learned). The only difference: your index finger presses string 3, fret 1. That one note changes the chord from minor (sad) to major (happy).</p>',
      28:'<p><strong>B7 (B dominant 7th)</strong></p><ul><li>Index: String 4, Fret 1</li><li>Middle: String 5, Fret 2</li><li>Ring: String 3, Fret 2</li><li>Pinky: String 1, Fret 2</li><li>Do not play string 6</li></ul><p>B7 is essential for blues and rock. It creates a tension that wants to resolve back to E.</p><p><strong>Classic progression:</strong> E → A → B7. This I-IV-V in E is the backbone of blues, rock, and highlife music.</p>',
      29:'<p>Down-up strumming unlocks twice the rhythmic possibilities.</p><p><strong>Technique:</strong> Your wrist should move in a continuous motion — down on the beat, up on the off-beat. Think of it like a pendulum.</p><p><strong>Exercise:</strong> Set metronome to 80 BPM. Strum down on 1, 2, 3, 4. Now add an up-strum between each beat: "1 and 2 and 3 and 4 and". Down on numbers, up on "and".</p>',
      30:'<p>Muting creates rhythm by silencing strings at specific moments.</p><p><strong>How to mute:</strong> Lightly touch all strings with your fretting hand without pressing down. Strum — you will hear a percussive "chuck" sound.</p><p><strong>Accents:</strong> A strum that is louder than the others. Accent beat 1 in 4/4 time for a strong downbeat feel.</p><p><strong>Pattern:</strong> Down (accent), mute, down-up, mute. This is the reggae skank rhythm.</p>',
      31:'<p>Dynamics make your playing expressive. <strong>Piano</strong> = soft, <strong>forte</strong> = loud.</p><p><strong>Exercise 1:</strong> Strum Em softly 4 times, then loudly 4 times. Repeat the cycle.</p><p><strong>Exercise 2:</strong> Start a G chord very softly. Gradually get louder over 8 beats (crescendo). Then gradually get softer (decrescendo).</p><p><strong>Song feel:</strong> Verses are usually softer, choruses louder. Practice playing any 2-chord song with this dynamic contrast.</p>',
      32:'<p>Combine everything you have learned into a strumming challenge.</p><p><strong>Pattern 1 — Rock:</strong> Down, down, down-up, down-up</p><p><strong>Pattern 2 — Folk:</strong> Down, down-up, down-up, down-up</p><p><strong>Pattern 3 — Reggae:</strong> Down (muted), up, down (muted), up</p><p><strong>Challenge:</strong> Play Pattern 1 with Em-Am. Then Pattern 2 with G-D. Then Pattern 3 with Am-G. All at 80 BPM.</p>',
      33:'<p>The C major scale is the most important scale in Western music.</p><p><strong>Open position:</strong> C (string 5, fret 3), D (string 4, open), E (string 4, fret 2), F (string 4, fret 3), G (string 3, open), A (string 3, fret 2), B (string 2, open), C (string 2, fret 1).</p><p>Play it ascending and descending. Use one finger per fret. Keep your picking hand moving in a steady down-up motion.</p>',
      34:'<p>Melodies are just scales played in a specific order.</p><p><strong>Learn "Twinkle Twinkle":</strong> C-C-G-G-A-A-G, F-F-E-E-D-D-C. These are all notes from the C major scale.</p><p><strong>Your turn:</strong> Try to figure out "Happy Birthday" on one string first. Find the notes by ear. This builds musical intuition.</p><p>Once you find a melody, try playing it on different string sets. The same notes exist in multiple places on the fretboard.</p>',
      35:'<p>Ear training helps you play what you hear.</p><p><strong>Exercise 1 — Same or different:</strong> Play two notes. Guess if the second is higher or lower than the first.</p><p><strong>Exercise 2 — Call and response:</strong> Play a short 3-note melody. Sing it back. Then play it again to check.</p><p><strong>Exercise 3 — Find the root:</strong> Play a chord (e.g., Em). Hum the lowest note. Find that note on string 6. That is the root.</p>',
      36:'<p>Power chords use only the root and fifth — no third, so they are neither major nor minor.</p><p><strong>Shape:</strong> Index finger on the root string. Ring finger two frets up on the next string. Pinky two frets up on the string after that (optional).</p><p><strong>E5 on string 6:</strong> Index on fret 0 (open E), ring on fret 2 (A string), pinky on fret 2 (D string).</p><p><strong>G5 on string 6:</strong> Index on fret 3, ring on fret 5, pinky on fret 5.</p><p>Power chords are the foundation of rock, punk, and metal. They are movable — learn one shape and you can play any power chord.</p>',
      37:'<p><strong>F (F major)</strong> — the barre chord that every beginner struggles with.</p><p><strong>Shape:</strong> Barre all 6 strings at fret 1 with your index finger. Then form an E shape with your other fingers: middle on string 3, fret 2; ring on string 5, fret 3; pinky on string 4, fret 3.</p><p><strong>Tips:</strong> Place your index finger slightly on its side (the bony edge presses better). Keep your thumb centered on the back of the neck for maximum pressure.</p>',
      38:'<p><strong>Bm (B minor)</strong></p><p>Shape: Barre all strings at fret 2 with index. Form an Am shape with your other fingers: ring on string 4, fret 4; pinky on string 3, fret 4; middle on string 2, fret 3.</p><p>This is the same shape as Fm (barre at fret 1). Everything is movable. Learn this shape in one position and you can play any minor barre chord.</p>',
      39:'<p>Once you can barre, you can play every major chord up and down the neck.</p><p><strong>E-form barre:</strong> The F chord shape (E form) moved up. Barre at fret 3 with E shape = G. Fret 5 = A. Fret 7 = B.</p><p><strong>A-form barre:</strong> Barre with index, form an A shape above it. Barre at fret 1 with A form = Bb. Fret 3 = C. Fret 5 = D.</p><p>Practice moving between E-form and A-form barre chords. This is how guitarists play in any key.</p>',
      40:'<p>Barre chord progressions are the backbone of soul, reggae, and funk.</p><p><strong>Progression 1:</strong> Bm → A → G → A (i-VII-VI-VII in B minor). Common in reggae and rock.</p><p><strong>Progression 2:</strong> F → G → Am → C (I-II-III-V in F). A classic pop progression.</p><p><strong>Progression 3:</strong> C → G → Am → F (I-V-vi-IV). The most common progression in pop music.</p><p>Practice each progression slowly. Focus on smooth transitions. Use a metronome at 60 BPM.</p>',
      41:'<p>Fingerpicking uses your thumb and fingers independently.</p><p><strong>Setup:</strong> Thumb on strings 4-5-6 (bass). Index on string 3. Middle on string 2. Ring on string 1.</p><p><strong>Basic pattern:</strong> Thumb (string 4 or 5), index (string 3), middle (string 2), ring (string 1). Repeat.</p><p>Play this pattern on an Em chord. Keep the thumb steady like a heartbeat while the fingers pick the melody.</p>',
      42:'<p>Travis picking is named after Merle Travis — a steady thumb pattern with syncopated melody.</p><p><strong>Thumb pattern:</strong> Alternates between two bass strings. On Em: thumb picks string 6, then string 4, then 6, then 4.</p><p><strong>Add fingers:</strong> On each bass note, add a finger note between: thumb + index, thumb + middle, etc.</p><p><strong>Full pattern:</strong> Thumb (6), index (3), thumb (4), middle (2), thumb (6), ring (1), thumb (4), middle (2).</p>',
      43:'<p>Arpeggios are chords played one note at a time.</p><p><strong>Am arpeggio:</strong> Pick strings 5-4-3-2-1 in sequence. Use thumb for string 5, then fingers for 4-3-2-1.</p><p><strong>C arpeggio:</strong> Pick strings 5-4-3-2-1. Same pattern, different chord shape.</p><p><strong>Rolling arpeggio:</strong> Thumb (bass), then quickly roll index-middle-ring across strings 3-2-1. This sounds like a harp.</p>',
      44:'<p>Learn a complete fingerstyle arrangement.</p><p><strong>Song: "Wish Me Well" (Em-Am)</strong></p><p><strong>Bass pattern:</strong> Thumb alternates string 6 (Em) and string 5 (Am).</p><p><strong>Finger pattern:</strong> On each chord, play: thumb, index, middle, thumb, middle, ring, thumb, index.</p><p>Start without the recording. Once the pattern feels natural, play along with the original song.</p>',
      45:'<p>Sixteenth notes divide each beat into 4 equal parts.</p><p>Count: "1 e and a, 2 e and a, 3 e and a, 4 e and a."</p><p><strong>Exercise:</strong> Set metronome to 60 BPM. Strum down on each number. Now add up-strums on "e" and "a". Keep your wrist moving in a steady pendulum.</p>',
      46:'<p>Syncopation means accenting the off-beats.</p><p>In 4/4 time, beats 2 and 4 are the "backbeat". Accent them for a syncopated feel.</p><p><strong>Exercise:</strong> Strum muted strings. Accent beats 2 and 4 (the "and" of each beat). This is the core of funk and reggae rhythm.</p>',
      47:'<p>Swing feel is a triplet-based rhythm where the first two eighth notes are played long and the third short.</p><p><strong>Straight vs swing:</strong> Straight eighth notes are even. Swing eighth notes are uneven — "long-short, long-short."</p><p><strong>Exercise:</strong> Set metronome to 80 BPM. Play Em with a swing strum: "down, (rest), up, down, (rest), up."</p>',
      48:'<p>Not all music is in 4/4. 3/4 (waltz) and 6/8 (jig) are common alternatives.</p><p><strong>3/4 time:</strong> Count "1, 2, 3". Strum down on 1, up on 2 and 3. Practice with Em-Am.</p><p><strong>6/8 time:</strong> Count "1, 2, 3, 4, 5, 6" with emphasis on 1 and 4. Practice with G-C.</p>',
      49:'<p>The A minor pentatonic scale is the most used scale in rock and blues.</p><p><strong>Box 1 (5th fret):</strong> Index on fret 5. Pattern: string 6 (5-8), string 5 (5-7), string 4 (5-7), string 3 (5-7), string 2 (5-8), string 1 (5-8).</p><p>Play it ascending and descending. Use one finger per fret. Index for fret 5, ring for 7, pinky for 8.</p>',
      50:'<p>Bends and slides add vocal-like expression to single notes.</p><p><strong>Full bend:</strong> Play string 3, fret 7 (D). Bend the string up until the pitch sounds like fret 9 (E). Use 2-3 fingers for strength.</p><p><strong>Slide:</strong> Play string 1, fret 5 (A). Slide up to fret 8 (C) without lifting your finger.</p><p><strong>Practice:</strong> Play the A minor pentatonic scale using only slides between notes.</p>',
      51:'<p>Blues phrasing is about what you do not play as much as what you do.</p><p><strong>Call and response:</strong> Play a short phrase (2-4 notes). Pause. Play a different phrase that answers the first.</p><p><strong>Lick 1 (Em):</strong> String 3, fret 4 → bend to 5 → release → string 2, fret 3 → string 1, fret 3.</p><p><strong>Lick 2 (Am):</strong> String 2, fret 5 → slide to 8 → string 1, fret 5 → string 1, fret 8.</p>',
      52:'<p>Put your soloing skills to the test over a backing track.</p><p><strong>Track:</strong> Em → Am → Em → Am (80 BPM, 12 bars).</p><p><strong>Guidelines:</strong> Use only the A minor pentatonic scale (fret 5 box). Start with simple quarter notes. Add rhythm variation. End phrases on the root note (E for Em, A for Am).</p>',
      53:'<p>Chords are built from scales by stacking every other note.</p><p><strong>Major chord:</strong> Root (1) + Major 3rd (4 semitones up) + Perfect 5th (7 semitones up). C-E-G = C major.</p><p><strong>Minor chord:</strong> Root (1) + Minor 3rd (3 semitones up) + Perfect 5th (7 semitones up). C-Eb-G = C minor.</p>',
      54:'<p>The difference between major and minor is a single note — the 3rd.</p><p><strong>Major 3rd:</strong> Sounds bright, happy, resolved.</p><p><strong>Minor 3rd:</strong> Sounds dark, sad, tense.</p><p><strong>Exercise:</strong> Play an E chord (major). Now lift your index finger to make it Em (minor). Hear the difference? That one note changes the entire mood.</p>',
      55:'<p>Inversions are chords where the root is not the lowest note.</p><p><strong>Root position:</strong> C-E-G (C is lowest).</p><p><strong>First inversion:</strong> E-G-C (E is lowest).</p><p><strong>Second inversion:</strong> G-C-E (G is lowest).</p><p>Inversions create smooth bass lines. Try playing C, then C/E, then C/G — hear how the bass moves without changing the chord.</p>',
      56:'<p>The I-V-vi-IV progression appears in thousands of hit songs.</p><p>In C major: C (I), G (V), Am (vi), F (IV). Songs using it: "Let It Be", "No Woman No Cry", "Someone Like You", "Africa".</p><p><strong>Exercise:</strong> Play C → G → Am → F. Use a metronome at 70 BPM. One strum per chord. Listen for how each chord feels.</p>',
      57:'<p>Dynamics make a performance engaging. Play with intention.</p><p><strong>Verse:</strong> Softer dynamics (piano). Muted strums or fingerpicking.</p><p><strong>Chorus:</strong> Louder dynamics (forte). Full strums, open chords.</p><p><strong>Bridge:</strong> Build from soft to loud to create tension before the final chorus.</p>',
      58:'<p>Stage presence is about connecting with your audience.</p><p><strong>Eye contact:</strong> Look at your audience, not your guitar. Know your chords well enough to play without staring at the fretboard.</p><p><strong>Movement:</strong> Move to the rhythm. Nod your head. Tap your foot. Your body language communicates confidence.</p>',
      59:'<p>Jamming with others is a different skill than playing alone.</p><p><strong>Listen first:</strong> Hear what the other musicians are playing. Lock in with the drummer or the bass player.</p><p><strong>Stay in your lane:</strong> Do not play every second. Leave space. A well-placed chord every 4 bars can sound better than constant strumming.</p>',
      60:'<p>A setlist is a planned sequence of songs for a performance.</p><p><strong>Structure:</strong> Open strong, vary the energy, end with your best song. Plan transitions between keys for smooth flow.</p><p><strong>Sample setlist:</strong> Upbeat song → mid-tempo → ballad → upbeat → closer. 5 songs = ~20 minutes of music.</p>',
      61:'<p>Consistent practice beats marathon sessions.</p><p><strong>Daily minimum:</strong> 10 minutes every day is better than 2 hours once a week.</p><p><strong>Structure:</strong> Warmup (2 min) → Weakness drill (3 min) → Song (3 min) → Fun (2 min).</p><p>Use the practice timer to track your sessions.</p>',
      62:'<p>Recording yourself is the best way to hear your true playing.</p><p><strong>Phone recording:</strong> Your phone microphone is good enough to start. Record a 30-second clip of you playing a song.</p><p><strong>Listen critically:</strong> Compare your timing, chord clarity, and dynamics to the original. Pick one thing to improve next session.</p>',
      63:'<p>You do not need expensive gear to sound good.</p><p><strong>Essential:</strong> A working guitar that stays in tune, a tuner, a strap, and extra strings.</p><p><strong>Nice to have:</strong> A capo (lets you play in different keys), a pick variety pack, a music stand, and a phone stand for recording.</p>',
      64:'<p>You have completed all 16 modules of the Gideon Guitar Method.</p><p><strong>Where to go next:</strong></p><ul><li>Keep using the Practice section — the One-Minute Drill and Metronome will always challenge you</li><li>Learn songs by your favourite artists using the Song Learning Method</li><li>Record yourself and share your progress</li><li>Consider finding a teacher or joining a band to keep growing</li></ul><p>Music is a lifelong journey. The 64 lessons here are your foundation — what you build on top is up to you.</p>'
    };
