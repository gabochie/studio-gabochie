<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Learn — Gideon Guitar Method</title>
<link rel="stylesheet" href="/assets/css/design.css"><link rel="stylesheet" href="/assets/css/guitar.css">
</head>
<body>
<div class="screen active">
  <div class="hdr"><div class="logo">🎸 Learn</div><div id="om-progress" style="font-size:11px;color:var(--text3)"></div></div>
  <div id="learn-content" style="flex:1;overflow-y:auto;padding:16px 20px;max-width:700px;margin:0 auto;width:100%"></div>
  <div class="bottom-nav" style="border-top:1px solid rgba(255,255,255,.06);padding:6px 0 10px">
    <a class="nav-item" href="/guitar/"><i class="ti ti-home"></i><span>Home</span></a>
    <a class="nav-item active" href="/guitar/learn/"><i class="ti ti-book"></i><span>Learn</span></a>
    <a class="nav-item" href="/guitar/practice/"><i class="ti ti-player-play"></i><span>Practice</span></a>
    <a class="nav-item" href="/guitar/dashboard/"><i class="ti ti-trending-up"></i><span>Progress</span></a>
    <a class="nav-item" href="/guitar/songs/"><i class="ti ti-music"></i><span>Songs</span></a>
    <a class="nav-item" href="/guitar/tuner/"><i class="ti ti-ear"></i><span>Tuner</span></a>
  </div>
</div>

<div id="auth-overlay" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:flex-end;justify-content:center">
  <div class="modal-sheet" style="background:var(--surface);border-radius:24px 24px 0 0;padding:24px;max-width:400px;width:100%">
    <div class="modal-handle"></div>
    <div class="modal-title" style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:4px">Start Learning</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">Sign in to track your progress.</p>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="auth-email" type="email" placeholder="your@email.com"></div>
    <button class="btn-primary w-full" id="auth-send-otp">Send OTP</button>
    <div id="auth-otp-section" style="display:none;margin-top:12px">
      <div class="form-group"><label class="form-label">OTP Code</label><input class="form-input" id="auth-otp" type="text" placeholder="6-digit code" maxlength="6"></div>
      <button class="btn-primary w-full" id="auth-verify-otp">Verify & Sign In</button>
    </div>
    <p id="auth-error" style="color:var(--red-light);font-size:12px;margin-top:8px;display:none"></p>
  </div>
</div>

<script src="/assets/js/guitar/app.js"></script>
<script>
const MODULES = [
  {id:1, tier:'bronze', title:'Meet Your Guitar', lessons:[
    {id:1, title:'Parts of the Guitar', video:'https://www.youtube.com/embed/4WUlLx6a9BU', duration:5},
    {id:2, title:'How to Hold the Guitar', video:'https://www.youtube.com/embed/6YNWkR7mh4Y', duration:5},
    {id:3, title:'How to Tune Your Guitar', video:'https://www.youtube.com/embed/xcmUReUJhpM', duration:8},
    {id:4, title:'Posture & Ergonomics Check', video:'https://www.youtube.com/embed/01gRTiVyBQ0', duration:4}
  ]},
  {id:2, tier:'bronze', title:'The Fretboard', lessons:[
    {id:5, title:'Open String Names', video:'https://www.youtube.com/embed/9Z6UkC3ebFc', duration:5},
    {id:6, title:'Finger Independence Exercises', video:'https://www.youtube.com/embed/fZ9uHWoP2r8', duration:8},
    {id:7, title:'Natural Notes on the Fretboard', video:'https://www.youtube.com/embed/xl5Mcd0xCPQ', duration:8},
    {id:8, title:'Fretboard Quiz', video:'https://www.youtube.com/embed/UKjRwDapGhs', duration:5}
  ]},
  {id:3, tier:'bronze', title:'The Power 5 Chords', lessons:[
    {id:9, title:'Em — The Easiest Chord', video:'https://www.youtube.com/embed/PKB-p8UpC9I', duration:6},
    {id:10, title:'Am — Your Second Chord', video:'https://www.youtube.com/embed/IQrbbnn8EHM', duration:6},
    {id:11, title:'G + C + D — The Big Three', video:'https://www.youtube.com/embed/gL6uG79dRG4', duration:10},
    {id:12, title:'Chord Change Bootcamp', video:'https://www.youtube.com/embed/IaBmhFy1E6U', duration:10}
  ]},
  {id:4, tier:'bronze', title:'Rhythm Foundation', lessons:[
    {id:13, title:'Understanding Rhythm', video:'https://www.youtube.com/embed/I_7JwjiKF3c', duration:6},
    {id:14, title:'Down-Only Strumming', video:'https://www.youtube.com/embed/Ko52hf-eBNc', duration:8},
    {id:15, title:'The Metronome Challenge', video:'https://www.youtube.com/embed/KYgphdFxw9Q', duration:8},
    {id:16, title:'Practice Session Structure', video:'https://www.youtube.com/embed/mMpF50G9wME', duration:4}
  ]},
  {id:5, tier:'bronze', title:'One-Minute Changes', lessons:[
    {id:17, title:'Em ↔ Am Speed Drill', video:'https://www.youtube.com/embed/pH5nw0FQ30A', duration:8},
    {id:18, title:'Am ↔ G Speed Drill', video:'https://www.youtube.com/embed/qwQvPSvdxb8', duration:8},
    {id:19, title:'G ↔ C ↔ D Circuit', video:'https://www.youtube.com/embed/WI63eA0S3a4', duration:10},
    {id:20, title:'One-Minute Championship', video:'https://www.youtube.com/embed/lkfFbr9XeLY', duration:12}
  ]},
  {id:6, tier:'silver', title:'Your First Song', lessons:[
    {id:21, title:'2-Chord Songs Overview', video:'https://www.youtube.com/embed/vErm6lJg8pQ', duration:10},
    {id:22, title:'Wish Me Well — Sarkodie', video:'https://www.youtube.com/embed/HnXo2LsYbMg', duration:15},
    {id:23, title:'Playing with the Recording', video:'https://www.youtube.com/embed/KxGSDsxG_JE', duration:10},
    {id:24, title:'Song Learning Method', video:'https://www.youtube.com/embed/ywJzvobXrx8', duration:5}
  ]}
];

(async function() {
  const user = await Guitar.init();
  const container = document.getElementById('learn-content');
  const params = new URLSearchParams(location.search);
  const moduleId = params.get('module') ? parseInt(params.get('module')) : null;
  const lessonId = params.get('lesson') ? parseInt(params.get('lesson')) : null;

  function renderModules() {
    container.innerHTML = `<div class="section-title" style="margin-bottom:4px">📚 All Modules</div><div class="section-sub" style="margin-bottom:16px">Select a module to start learning</div>`;
    const tiers = ['bronze','silver','gold'];
    const tierData = { bronze: { icon:'🥉', name:'Foundation' }, silver: { icon:'🥈', name:'Songcraft' }, gold: { icon:'🥇', name:'Expression' }};
    for (const tier of tiers) {
      const tierModules = MODULES.filter(m => m.tier === tier);
      if (!tierModules.length) continue;
      container.innerHTML += `<div class="curriculum-tier"><div class="tier-header" style="margin-top:16px"><span class="tier-badge">${tierData[tier].icon}</span><div><div class="tier-title">${tierData[tier].name}</div></div></div>`;
      for (const mod of tierModules) {
        container.innerHTML += `<div class="module-card" onclick="location.href='?module=${mod.id}'">
          <div class="module-num">${mod.id}</div>
          <div class="module-info"><div class="module-name">${mod.title}</div><div class="module-lessons">${mod.lessons.length} lessons</div></div>
          <i class="ti ti-chevron-right" style="color:var(--text3)"></i>
        </div>`;
      }
      container.innerHTML += `</div>`;
    }
  }

  async function renderModule(id) {
    const mod = MODULES.find(m => m.id === id);
    if (!mod) { renderModules(); return; }
    let progress = {};
    if (user) {
      try {
        const res = await fetch(`/api/guitar/modules/${id}`, { headers: Guitar.headers() });
        const data = await res.json();
        if (data.progress) progress = data.progress;
      } catch(e) {}
    }
    let completedCount = Object.values(progress).filter(p => p.completed).length;
    container.innerHTML = `<button class="back-btn" onclick="location.href='/guitar/learn/'"><i class="ti ti-arrow-left"></i>All Modules</button>
      <div class="section-title">${mod.title}</div><div class="section-sub">${mod.lessons.length} lessons · ${mod.tier.charAt(0).toUpperCase() + mod.tier.slice(1)} tier</div>
      <div class="mod-progress" style="margin-bottom:16px"><div class="mod-progress-fill" style="width:${Math.round((completedCount/mod.lessons.length)*100)}%"></div></div>`;
    for (const lesson of mod.lessons) {
      const done = progress[lesson.id]?.completed;
      container.innerHTML += `<div class="lesson-card" style="background:var(--surface2);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px" onclick="location.href='?module=${id}&lesson=${lesson.id}'">
        <div style="width:24px;height:24px;border-radius:50%;background:${done ? 'var(--green-light)' : 'var(--grey2)'};display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${done ? '✓' : (lesson.id)}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:500">${lesson.title}</div><div style="font-size:10px;color:var(--text3)">${lesson.duration} min</div></div>
        <i class="ti ti-player-play" style="color:var(--gold);font-size:16px"></i>
      </div>`;
    }
  }

  async function renderLesson(modId, lesId) {
    const mod = MODULES.find(m => m.id === modId);
    if (!mod) { renderModules(); return; }
    const lesson = mod.lessons.find(l => l.id === lesId);
    if (!lesson) { renderModule(modId); return; }

    container.innerHTML = `<button class="back-btn" onclick="location.href='?module=${modId}'"><i class="ti ti-arrow-left"></i>${mod.title}</button>
      <div class="section-title" style="font-size:16px">${lesson.title}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:12px">${lesson.duration} min · ${mod.tier.charAt(0).toUpperCase() + mod.tier.slice(1)} tier</div>`;

    if (lesson.video) {
      container.innerHTML += `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius-lg);margin-bottom:16px">
        <iframe src="${lesson.video}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen></iframe>
      </div>`;
    }

    const body = await loadLessonBody(modId, lesId);
    container.innerHTML += `<div class="lesson-content">${body}</div>`;

    if (user) {
      const prog = await (await fetch(`/api/guitar/modules/${modId}`, { headers: Guitar.headers() })).json();
      const done = prog.progress?.[lesson.id]?.completed;
      container.innerHTML += `<div style="display:flex;gap:8px;margin-top:20px">
        <button class="btn-primary w-full" id="complete-btn" data-done="${done ? '1' : '0'}">
          ${done ? '✓ Completed' : 'Mark Complete +10 XP'}
        </button>
      </div>`;
      document.getElementById('complete-btn').onclick = async function() {
        const isDone = this.dataset.done === '1';
        try {
          if (isDone) {
            await fetch('/api/guitar/progress', { method:'POST', headers:{...Guitar.headers(),'Content-Type':'application/json'}, body: JSON.stringify({lesson_id: lesson.id, action:'uncomplete'}) });
            this.dataset.done = '0'; this.innerHTML = 'Mark Complete +10 XP';
          } else {
            const r = await fetch('/api/guitar/progress', { method:'POST', headers:{...Guitar.headers(),'Content-Type':'application/json'}, body: JSON.stringify({lesson_id: lesson.id, action:'complete'}) });
            const d = await r.json();
            this.dataset.done = '1'; this.innerHTML = '✓ Completed';
            if (d.xpEarned) Guitar.showXP(d.xpEarned);
          }
        } catch(e) { Guitar.showToast('Error saving progress','error'); }
      };
    }

    // Next/prev navigation
    const currentIdx = mod.lessons.findIndex(l => l.id === lesId);
    const prevL = currentIdx > 0 ? mod.lessons[currentIdx - 1] : null;
    const nextL = currentIdx < mod.lessons.length - 1 ? mod.lessons[currentIdx + 1] : null;
    container.innerHTML += `<div style="display:flex;justify-content:space-between;margin-top:16px;gap:8px">
      ${prevL ? `<button class="btn-secondary" onclick="location.href='?module=${modId}&lesson=${prevL.id}'"><i class="ti ti-arrow-left"></i>Previous</button>` : '<div></div>'}
      ${nextL ? `<button class="btn-primary" onclick="location.href='?module=${modId}&lesson=${nextL.id}'">Next<i class="ti ti-arrow-right"></i></button>` : `<a href="/guitar/practice/" class="btn-primary">Practice Now <i class="ti ti-arrow-right"></i></a>`}
    </div>`;
  }

  async function loadLessonBody(modId, lesId) {
    // Return the lesson content HTML from our embedded data
    const lessonContent = {
      1: '<p>The guitar has three main sections: the <strong>headstock</strong> (top), the <strong>neck</strong> (middle), and the <strong>body</strong> (bottom).</p><ul><li><strong>Headstock</strong> — holds the tuning pegs. Turn them to tighten or loosen strings.</li><li><strong>Nut</strong> — the small white slot where strings rest before the tuning pegs.</li><li><strong>Frets</strong> — the metal strips on the neck. Pressing a string behind a fret changes its pitch.</li><li><strong>Soundhole</strong> (acoustic) or <strong>pickups</strong> (electric) — where the sound comes out.</li><li><strong>Bridge</strong> — holds the strings at the body end.</li></ul><p>Spend 2 minutes identifying each part on your actual guitar. Touch each part as you read its name — this builds physical memory.</p>',
      2: '<p>Good posture prevents injury and makes playing easier.</p><p><strong>Sitting position:</strong> Sit on the edge of a chair. Rest the guitar on your picking-leg thigh. The neck points upward at about 45°. Keep your back straight — don\'t hunch over.</p><p><strong>Left hand (fretting):</strong> Your thumb rests behind the neck, opposite your index finger. Curl your fingers so the tips press the strings.</p><p><strong>Right hand (picking):</strong> Rest your forearm lightly on the guitar body. Keep your wrist relaxed.</p>',
      3: '<p><strong>Standard tuning (EADGBe):</strong></p><ul><li>String 6 (thickest) — E</li><li>String 5 — A</li><li>String 4 — D</li><li>String 3 — G</li><li>String 2 — B</li><li>String 1 (thinnest) — e</li></ul><p>Mnemonic: <strong>E</strong>ddie <strong>A</strong>te <strong>D</strong>ynamite <strong>G</strong>ood <strong>B</strong>ye <strong>E</strong>ddie</p><p>Use our <a href="/guitar/tuner/">built-in tuner</a> to get in tune.</p>',
      5: '<p>Your guitar has 6 strings. From thickest to thinnest: E (6th), A (5th), D (4th), G (3rd), B (2nd), e (1st).</p><p>Drill: Name each string from thickest to thinnest 5 times without looking.</p>',
      9: '<p><strong>Em (E minor)</strong> — only 2 fingers!</p><ul><li>Middle finger: String 5, Fret 2</li><li>Ring finger: String 4, Fret 2</li><li>Play all 6 strings</li></ul><p>Check: Are your fingertips pressing? Does every string ring clearly?</p>',
      10: '<p><strong>Am (A minor)</strong></p><ul><li>Index: String 2, Fret 1</li><li>Middle: String 4, Fret 2</li><li>Ring: String 3, Fret 2</li><li>Play strings 1-5 only</li></ul>',
      13: '<p><strong>What is 4/4 time?</strong> Count "1, 2, 3, 4". Each number is a <strong>beat</strong>.</p><p>Exercise with a metronome at 60 BPM: say "1, 2, 3, 4" with each click. Tap your foot on beats 1 and 3. Strum muted strings on each click. Do this for 2 minutes.</p>',
      22: '<p><strong>Song:</strong> Wish Me Well — Sarkodie</p><p><strong>Chords:</strong> Em, Am</p><p><strong>Progression:</strong> Em → Am → Em → Am (repeat)</p><p><strong>Strum:</strong> Down, down-down-up</p><p>This is your first real song! Practice transitions first without strumming, then add the strum pattern.</p>'
    };
    return lessonContent[lesId] || '<p>Complete this lesson by watching the video above. Practice along with your guitar.</p>';
  }

  if (moduleId && lessonId) await renderLesson(moduleId, lessonId);
  else if (moduleId) await renderModule(moduleId);
  else renderModules();
})();
</script>
</body></html>
