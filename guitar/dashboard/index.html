<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard — Gideon Guitar Method</title>
<link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/guitar.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</head>
<body class="guitar-app">
<div class="screen active">
  <div class="hdr"><div class="hdr-logo"><span class="icon">🎸</span> Progress</div><div id="xp-header" style="font-size:12px;color:var(--gld);font-weight:600"></div></div>
  <div class="scrollable" style="flex:1;overflow-y:auto;padding:16px 20px;max-width:700px;margin:0 auto;width:100%">
    <!-- Auth -->
    <div id="dash-auth" class="text-center" style="padding:60px 0">
      <div style="font-size:56px;margin-bottom:12px">📊</div>
      <div class="section-title" style="justify-content:center">Your Progress Dashboard</div>
      <div class="section-sub">Sign in to track your learning journey</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:300px;margin:16px auto">
        <button class="btn btn-primary" onclick="Guitar.showRegisterModal({redirect:'/guitar/dashboard/'})">Sign In <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>

    <!-- Content -->
    <div id="dash-content" style="display:none">
      <div class="dashboard-grid stagger">
        <div class="stat-card"><div class="stat-value" id="stat-level">-</div><div class="stat-label">Level</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-xp">-</div><div class="stat-label">XP</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-streak">-</div><div class="stat-label">Day Streak</div></div>
        <div class="stat-card"><div class="stat-value" id="stat-lessons">-</div><div class="stat-label">Lessons</div></div>
      </div>

      <div class="mt-lg">
        <div class="section-title">🏆 Achievements</div>
        <div id="achievements-grid" class="badge-grid" style="margin-top:8px"></div>
      </div>

      <div class="mt-lg">
        <div class="section-title">🔥 Leaderboard</div>
        <div class="section-sub">Top streak holders this week</div>
        <div id="leaderboard" class="glass p-md mt-sm"><div class="text-center" style="padding:12px;color:var(--text3);font-size:13px">Loading...</div></div>
      </div>

      <div class="mt-lg">
        <div class="section-title">📈 Practice History</div>
        <div id="practice-chart" class="glass p-md mt-sm"><div class="text-center" style="padding:12px;color:var(--text3);font-size:13px">Loading...</div></div>
      </div>

      <div class="mt-lg">
        <div class="section-title">⚡ One-Minute Records</div>
        <div id="om-records" class="mt-sm"></div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a class="nav-item" href="/guitar/"><i class="ti ti-home"></i><span>Home</span></a>
    <a class="nav-item" href="/guitar/learn/"><i class="ti ti-book"></i><span>Learn</span></a>
    <a class="nav-item" href="/guitar/practice/"><i class="ti ti-player-play"></i><span>Practice</span></a>
    <a class="nav-item active" href="/guitar/dashboard/"><i class="ti ti-trending-up"></i><span>Progress</span></a>
    <a class="nav-item" href="/guitar/songs/"><i class="ti ti-music"></i><span>Songs</span></a>
    <a class="nav-item" href="/guitar/waitlist/"><i class="ti ti-star"></i><span>Presale</span></a>
    <a class="nav-item" href="/guitar/tuner/"><i class="ti ti-ear"></i><span>Tuner</span></a>
  </nav>
</div>

<script src="/assets/js/guitar/app.js"></script>
<script>
async function renderDashboard(user) {
  const section = document.getElementById('dash-content');
  section.style.display = 'block';
  document.getElementById('dash-auth').style.display = 'none';

  try {
    const data = await Guitar.getProgress();
    const stats = data.stats || {};
    const earnedKeys = (data.badges||[]).map(b => b.key || b.achievement_key);

    const lvl = stats.level || 1;
    document.getElementById('stat-level').textContent = lvl;
    document.getElementById('stat-xp').textContent = (stats.total_xp || 0) + ' XP';
    document.getElementById('stat-streak').textContent = (stats.streak || 0) + ' days';
    const completedLessons = (data.progress||[]).filter(p => p.completed).length;
    document.getElementById('stat-lessons').textContent = completedLessons + '/64';
    document.getElementById('xp-header').textContent = `${stats.total_xp||0}/${50*lvl} XP`;

    // Animate stats
    document.querySelectorAll('.stat-value').forEach(el => {
      const num = parseInt(el.textContent);
      if (!isNaN(num)) { el.textContent = '0'; Guitar.countUp(el, num, 600); }
    });

    // Achievements
    try {
      const achData = await Guitar.getAchievements();
      const achievements = achData.achievements || [];
      const grid = document.getElementById('achievements-grid');
      grid.innerHTML = achievements.length ? achievements.map(a => `<div class="badge-item ${a.earned||earnedKeys.includes(a.key)?'badge-unlocked':''}"><div class="badge-icon">${(a.earned||earnedKeys.includes(a.key))?(a.icon||'🏆'):'🔒'}</div><div class="badge-name">${a.title||a.name}</div></div>`).join('') : '<div style="color:var(--text3);font-size:13px;padding:8px 0">Complete lessons to unlock achievements</div>';
    } catch(e) {}

    // Leaderboard
    try {
      const lbData = await Guitar.getLeaderboard('weekly');
      const lb = lbData.leaderboard || [];
      const lbEl = document.getElementById('leaderboard');
      if (lb.length) {
        lbEl.innerHTML = lb.map((r,i) => `<div class="flex items-center" style="gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px">
          <span style="font-family:'Syne',sans-serif;font-weight:700;color:${i<3?'var(--gld)':'var(--text3)'}">#${i+1}</span>
          <span class="flex-1">${r.nickname||r.email||'User'}</span>
          <span style="color:var(--gld);font-weight:600">${r.xp||0} XP</span>
        </div>`).join('');
      } else {
        lbEl.innerHTML = '<div class="text-center" style="color:var(--text3);font-size:13px;padding:12px">No leaderboard data yet</div>';
      }
    } catch(e) {}

    // Practice chart
    try {
      const sessData = await Guitar.getSessions(7);
      const sessions = sessData.sessions || [];
      const phEl = document.getElementById('practice-chart');
      if (sessions.length) {
        const week = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        let html = '<div class="flex" style="gap:6px;justify-content:center;padding:8px 0">';
        for (let d = 6; d >= 0; d--) {
          const date = new Date(); date.setDate(date.getDate()-d);
          const ds = date.toISOString().split('T')[0];
          const day = sessions.filter(s => s.date === ds);
          const count = day.length;
          const maxH = 64, h = Math.min(count * 22, maxH);
          html += `<div class="text-center"><div style="height:${maxH}px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px"><div style="width:28px;border-radius:6px 6px 0 0;background:var(--gld);height:${h}px;opacity:${count>.5?.6+count*.1:.1};transition:height .5s var(--ease-out)"></div></div><div style="font-size:9px;color:var(--text3)">${week[date.getDay()]}</div></div>`;
        }
        html += '</div>';
        phEl.innerHTML = html;
      } else {
        phEl.innerHTML = '<div class="text-center" style="color:var(--text3);font-size:13px;padding:12px">No sessions yet</div>';
      }
    } catch(e) {}

    // One-minute records
    try {
      const omData = await Guitar.getRecords();
      const records = omData.records || [];
      const omEl = document.getElementById('om-records');
      if (records.length) {
        omEl.innerHTML = records.slice(-5).reverse().map(r =>
          `<div class="flex justify-between" style="padding:8px 14px;background:rgba(255,255,255,.04);border-radius:var(--radius-md);margin-bottom:6px;font-size:12px"><span>${r.chord_pair}</span><span style="color:var(--gld);font-weight:600">${r.best_score||r.score} changes</span></div>`
        ).join('');
      } else {
        omEl.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:8px 0">No one-minute records yet</div>';
      }
    } catch(e) {}
  } catch(e) {
    document.getElementById('stat-level').textContent = '1';
    document.getElementById('stat-xp').textContent = '--';
  }
}

(async function() {
  const user = await Guitar.init();
  if (user) await renderDashboard(user);
})();
</script>
</body></html>
