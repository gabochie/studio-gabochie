<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<title>Archive — The Studio Weekly</title>
<link rel="canonical" href="https://news.gideonabochie.org/archive">
<meta property="og:title" content="Archive — The Studio Weekly">
<meta property="og:description" content="Browse past issues of The Studio Weekly — Ghana's youth development newsletter.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://news.gideonabochie.org/archive">
<meta property="og:image" content="https://gideonabochie.org/assets/images/banner.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5C200;--navy:#1A1E3C;--white:#FFFFFF;--ink:#1C1C2E;--gray:#6B7280}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#EBEBEB;color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
#masthead{background:linear-gradient(180deg,#0d1128 0%,#1A1E3C 60%,#252a52 100%);border-bottom:5px solid var(--gold);padding:40px 20px;text-align:center}
#masthead h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(28px,5vw,48px);color:var(--white);font-weight:900}
#masthead h1 span{color:var(--gold)}
#masthead p{color:rgba(255,255,255,.6);margin-top:8px;font-size:14px}
#masthead a{color:var(--gold);text-decoration:none}
.wrap{max-width:800px;margin:0 auto;padding:40px 20px}
.issue{background:var(--white);border-radius:8px;padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.issue h3{font-family:'Source Serif 4',Georgia,serif;font-size:18px;color:var(--ink)}
.issue .date{color:var(--gray);font-size:13px;margin-top:2px}
.issue a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--gold);color:var(--navy);border-radius:4px;font-size:13px;font-weight:600;text-decoration:none;transition:opacity .2s}
.issue a:hover{opacity:.85}
.empty{text-align:center;padding:60px 20px;color:var(--gray)}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:8px}
.footer{text-align:center;padding:24px 20px;color:var(--gray);font-size:12px;border-top:1px solid #D1D5DB}
.footer a{color:var(--navy);text-decoration:underline}
</style>
</head>
<body>
<div id="masthead">
  <h1>The Studio <span>Weekly</span></h1>
  <p>Archive &mdash; <a href="/">Back to current issue</a></p>
</div>
<div class="wrap">
  <div class="empty">
    <h2>Archive coming soon</h2>
    <p>Past issues will appear here once the newsletter has been published.</p>
    <p style="margin-top:16px"><a href="/" style="color:var(--gold);font-weight:600">Read the latest issue &rarr;</a></p>
  </div>
</div>
<div class="footer">
  <p><a href="https://gideonabochie.org">GideonAbochie Studio</a> &mdash; School of Creativity, Love &amp; Wisdom</p>
</div>
</body>
</html>
