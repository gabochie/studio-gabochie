<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0F1F35"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#D9B85C"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B85C"/>
      <stop offset="100%" stop-color="#B8942F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Bold brand border frame -->
  <rect x="20" y="20" width="1040" height="1040" rx="12" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.3"/>
  <rect x="28" y="28" width="1024" height="1024" rx="8" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.15"/>

  <!-- Top brand bar with gold -->
  <rect x="0" y="0" width="1080" height="6" fill="#C9A84C"/>

  <!-- Brand header stripe -->
  <rect x="0" y="0" width="1080" height="170" fill="rgba(201,168,76,0.04)"/>

  <!-- Logo (large and bold) -->
  <image x="315" y="30" width="450" height="120" xlink:href="https://studio.gabochie.com/assets/images/logo.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- Brand name -->
  <text x="540" y="160" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="16" font-weight="700" fill="#C9A84C" text-anchor="middle" letter-spacing="8" text-transform="uppercase">GIDEONABOCHIE STUDIO</text>

  <!-- Gold divider -->
  <line x1="200" y1="185" x2="880" y2="185" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="540" y="215" font-family="'Libre Baskerville',Georgia,serif" font-size="14" font-style="italic" fill="#6B7F9A" text-anchor="middle" letter-spacing="3">School of Creativity, Love &amp; Wisdom</text>

  <!-- Headline -->
  <text x="540" y="320" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="92" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="2">Play Guitar.</text>
  <text x="540" y="388" font-family="'Barlow Condensed','Arial',sans-serif" font-size="36" font-weight="400" fill="#6B7F9A" text-anchor="middle" letter-spacing="6" text-transform="uppercase">In 30 Days. No Experience Needed.</text>

  <!-- Price badge -->
  <rect x="340" y="430" width="400" height="64" rx="32" fill="url(#gold)"/>
  <text x="540" y="472" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="32" font-weight="700" fill="#0A1628" text-anchor="middle">GH¢ 299  <tspan fill="#5A3D1A" font-size="20" text-decoration="line-through" font-weight="400">was GH¢ 500</tspan></text>

  <!-- Divider -->
  <line x1="200" y1="510" x2="880" y2="510" stroke="#1E3456" stroke-width="1"/>

  <!-- Bullet points -->
  <g font-family="'DM Sans','Arial',sans-serif" font-size="26" fill="#CDD5E0">
    <rect x="250" y="542" width="12" height="12" rx="6" fill="#C9A84C"/>
    <text x="280" y="555">Beginner to intermediate — step by step</text>

    <rect x="250" y="602" width="12" height="12" rx="6" fill="#C9A84C"/>
    <text x="280" y="615">Highlife / Gospel / Contemporary Ghanaian songs</text>

    <rect x="250" y="662" width="12" height="12" rx="6" fill="#C9A84C"/>
    <text x="280" y="675">Video lessons — watch anytime, replay as needed</text>

    <rect x="250" y="722" width="12" height="12" rx="6" fill="#C9A84C"/>
    <text x="280" y="735">Lifetime access — one payment, no subscriptions</text>

    <rect x="250" y="782" width="12" height="12" rx="6" fill="#C9A84C"/>
    <text x="280" y="795">Learn on phone, tablet, or laptop</text>
  </g>

  <!-- Bold CTA section -->
  <rect x="0" y="850" width="1080" height="1" fill="#1E3456"/>

  <!-- CTA Button -->
  <rect x="240" y="880" width="600" height="76" rx="38" fill="url(#goldH)" filter="url(#shadow)"/>
  <rect x="244" y="884" width="592" height="68" rx="34" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <text x="540" y="929" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="30" font-weight="700" fill="#0A1628" text-anchor="middle" letter-spacing="4">ENROLL NOW — LIMITED SPOTS</text>

  <!-- URL -->
  <text x="540" y="992" font-family="'Courier New',monospace" font-size="16" fill="#6B7F9A" text-anchor="middle">studio.gabochie.com/school/guitar/buy</text>

  <!-- Payment icons text -->
  <text x="540" y="1035" font-family="'DM Sans',sans-serif" font-size="14" fill="#4A5F7A" text-anchor="middle">Pay via Mobile Money  &middot;  Card  &middot;  Flutterwave</text>

  <!-- Bottom gold bar -->
  <rect x="0" y="1074" width="1080" height="6" fill="#C9A84C"/>

  <!-- Footer -->
  <text x="540" y="1035" font-family="'Barlow Condensed','Arial',sans-serif" font-size="14" font-weight="600" fill="#4A5F7A" text-anchor="middle" letter-spacing="3">GIDEONABOCHIE STUDIO</text>
  <text x="540" y="1055" font-family="'Libre Baskerville',Georgia,serif" font-size="11" font-style="italic" fill="#3A5278" text-anchor="middle">School of Creativity, Love &amp; Wisdom</text>
</svg>
