<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0F1E38"/>
      <stop offset="100%" stop-color="#1A2D4A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E2C567"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B85C"/>
      <stop offset="100%" stop-color="#8B7034"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Subtle radial accent -->
  <circle cx="540" cy="480" r="420" fill="none" stroke="rgba(201,168,76,0.04)" stroke-width="120"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1080" height="4" fill="url(#gold)"/>

  <!-- Guitar icon (simplified) -->
  <g transform="translate(540,200)" opacity="0.15">
    <ellipse cx="0" cy="0" rx="60" ry="80" fill="none" stroke="#C9A84C" stroke-width="3"/>
    <rect x="-3" y="60" width="6" height="120" rx="3" fill="#C9A84C"/>
  </g>

  <!-- Headline -->
  <text x="540" y="160" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="72" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="2">Play Guitar</text>
  <text x="540" y="230" font-family="'Barlow Condensed','Arial',sans-serif" font-size="38" font-weight="400" fill="#5A7A9F" text-anchor="middle" letter-spacing="6" text-transform="uppercase">In 30 Days. No Experience Needed.</text>

  <!-- Price pill -->
  <rect x="340" y="280" width="400" height="64" rx="32" fill="url(#gold)"/>
  <text x="540" y="322" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="32" font-weight="700" fill="#0A1628" text-anchor="middle">GH¢ 299  <tspan fill="#5A3D1A" font-size="20" text-decoration="line-through" font-weight="400">was GH¢ 500</tspan></text>

  <!-- Bullet points -->
  <g font-family="'Barlow','Arial',sans-serif" font-size="24" fill="#CBD5E1">
    <text x="290" y="400">🎸  Beginner to intermediate step-by-step</text>
    <text x="290" y="460">🇬🇭  Highlife / Gospel / Contemporary Ghanaian songs</text>
    <text x="290" y="520">🎥  Video lessons — replay anytime</text>
    <text x="290" y="580">⏳  Lifetime access — pay once</text>
    <text x="290" y="640">📱  Learn on phone, tablet or laptop</text>
  </g>

  <!-- CTA Button -->
  <rect x="240" y="720" width="600" height="72" rx="36" fill="url(#goldH)" filter="url(#shadow)"/>
  <text x="540" y="767" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="30" font-weight="700" fill="#0A1628" text-anchor="middle" letter-spacing="3">ENROLL NOW — LIMITED SPOTS</text>

  <!-- URL -->
  <text x="540" y="840" font-family="'Courier New',monospace" font-size="18" fill="#5A7A9F" text-anchor="middle">gideonabochie.org/school/guitar</text>

  <!-- Bottom bar -->
  <rect x="0" y="1076" width="1080" height="4" fill="url(#gold)"/>

  <!-- Footer text -->
  <text x="540" y="940" font-family="'Barlow',sans-serif" font-size="14" fill="#3A5278" text-anchor="middle">GideonAbochie Studio &middot; School of Creativity, Love &amp; Wisdom</text>

  <!-- Logo mark -->
  <circle cx="540" cy="1010" r="20" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.3"/>
  <text x="540" y="1016" font-family="'Barlow Condensed',sans-serif" font-size="16" font-weight="700" fill="#C9A84C" text-anchor="middle" opacity="0.3">GA</text>
</svg>
