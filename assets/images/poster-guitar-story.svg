<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="40%" stop-color="#0F1F35"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#D9B85C"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B85C"/>
      <stop offset="100%" stop-color="#B8942F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Bold brand border frame -->
  <rect x="20" y="20" width="1040" height="1880" rx="16" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.25"/>
  <rect x="28" y="28" width="1024" height="1864" rx="12" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.12"/>

  <!-- Top brand bar -->
  <rect x="0" y="0" width="1080" height="6" fill="#C9A84C"/>

  <!-- Brand header stripe -->
  <rect x="0" y="0" width="1080" height="170" fill="rgba(201,168,76,0.04)"/>

  <!-- Logo (large and bold) -->
  <image x="315" y="28" width="450" height="120" xlink:href="https://gideonabochie.org/assets/images/logo.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- Brand name text -->
  <text x="540" y="160" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="18" font-weight="700" fill="#C9A84C" text-anchor="middle" letter-spacing="10" text-transform="uppercase">GIDEONABOCHIE STUDIO</text>

  <!-- Gold divider -->
  <line x1="200" y1="185" x2="880" y2="185" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="540" y="215" font-family="'Libre Baskerville',Georgia,serif" font-size="14" font-style="italic" fill="#6B7F9A" text-anchor="middle" letter-spacing="3">School of Creativity, Love &amp; Wisdom</text>

  <!-- Spacer -->
  <text x="540" y="250" font-family="'Arial',sans-serif" font-size="10" fill="none" text-anchor="middle"> </text>

  <!-- Main headline -->
  <text x="540" y="380" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="120" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="2">Play Guitar.</text>
  <text x="540" y="470" font-family="'Barlow Condensed','Arial',sans-serif" font-size="44" font-weight="500" fill="#6B7F9A" text-anchor="middle" letter-spacing="7" text-transform="uppercase">In 30 Days. No Experience Needed.</text>

  <!-- Price badge -->
  <rect x="290" y="530" width="500" height="80" rx="40" fill="url(#gold)" filter="url(#shadow)"/>
  <rect x="294" y="534" width="492" height="72" rx="36" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="540" y="584" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="40" font-weight="700" fill="#0A1628" text-anchor="middle">GH¢ 299  <tspan fill="#5A3D1A" font-size="26" text-decoration="line-through" font-weight="400">was GH¢ 500</tspan></text>

  <!-- Divider -->
  <line x1="200" y1="650" x2="880" y2="650" stroke="#1E3456" stroke-width="1.5"/>

  <!-- Bullet points -->
  <g font-family="'DM Sans','Arial',sans-serif" font-size="32" fill="#CDD5E0">
    <g transform="translate(220,710)">
      <rect x="0" y="4" width="18" height="18" rx="9" fill="#C9A84C"/>
      <text x="32" y="22">Beginner to intermediate — step by step</text>
    </g>
    <g transform="translate(220,800)">
      <rect x="0" y="4" width="18" height="18" rx="9" fill="#C9A84C"/>
      <text x="32" y="22">Highlife / Gospel / Contemporary Ghanaian songs</text>
    </g>
    <g transform="translate(220,890)">
      <rect x="0" y="4" width="18" height="18" rx="9" fill="#C9A84C"/>
      <text x="32" y="22">Video lessons — watch anytime, replay as needed</text>
    </g>
    <g transform="translate(220,980)">
      <rect x="0" y="4" width="18" height="18" rx="9" fill="#C9A84C"/>
      <text x="32" y="22">Lifetime access — one payment, no subscriptions</text>
    </g>
    <g transform="translate(220,1070)">
      <rect x="0" y="4" width="18" height="18" rx="9" fill="#C9A84C"/>
      <text x="32" y="22">Learn on phone, tablet, or laptop</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="200" y1="1150" x2="880" y2="1150" stroke="#1E3456" stroke-width="1.5"/>

  <!-- Testimonial -->
  <text x="540" y="1240" font-family="'Libre Baskerville',Georgia,serif" font-size="24" font-style="italic" fill="#6B7F9A" text-anchor="middle">"I never thought I could play — now</text>
  <text x="540" y="1276" font-family="'Libre Baskerville',Georgia,serif" font-size="24" font-style="italic" fill="#6B7F9A" text-anchor="middle">I lead worship at my church."</text>
  <text x="540" y="1320" font-family="'DM Sans',sans-serif" font-size="18" fill="#4A5F7A" text-anchor="middle">— Emmanuel K., Accra</text>

  <!-- CTA section -->
  <rect x="0" y="1390" width="1080" height="1" fill="#1E3456"/>

  <!-- CTA Button -->
  <rect x="190" y="1440" width="700" height="90" rx="45" fill="url(#goldH)" filter="url(#shadow)"/>
  <rect x="195" y="1445" width="690" height="80" rx="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="540" y="1499" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="36" font-weight="700" fill="#0A1628" text-anchor="middle" letter-spacing="5">ENROLL NOW — LIMITED SPOTS</text>

  <!-- URL -->
  <text x="540" y="1580" font-family="'Courier New',monospace" font-size="20" fill="#6B7F9A" text-anchor="middle" filter="url(#glow)">gideonabochie.org/school/guitar/buy</text>

  <!-- Payment options -->
  <text x="540" y="1650" font-family="'DM Sans',sans-serif" font-size="16" fill="#4A5F7A" text-anchor="middle">Pay via Mobile Money  &middot;  Card  &middot;  Flutterwave</text>

  <!-- Bottom gold bar -->
  <rect x="0" y="1914" width="1080" height="6" fill="#C9A84C"/>

  <!-- Footer -->
  <text x="540" y="1720" font-family="'Barlow Condensed','Arial',sans-serif" font-size="16" font-weight="700" fill="#4A5F7A" text-anchor="middle" letter-spacing="4">GIDEONABOCHIE STUDIO</text>
  <text x="540" y="1750" font-family="'Libre Baskerville',Georgia,serif" font-size="13" font-style="italic" fill="#3A5278" text-anchor="middle">School of Creativity, Love &amp; Wisdom</text>

  <!-- Logo mark -->
  <g transform="translate(540,1830)" opacity="0.1">
    <image x="-25" y="-15" width="50" height="30" xlink:href="https://gideonabochie.org/assets/images/logo.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
