<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#0F1F35"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#D9B85C"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B85C"/>
      <stop offset="100%" stop-color="#B8942F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <circle cx="540" cy="700" r="500" fill="none" stroke="rgba(201,168,76,0.03)" stroke-width="200"/>

  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="1080" height="6" fill="#C9A84C"/>

  <!-- Logo -->
  <image x="466" y="40" width="148" height="40" xlink:href="https://gideonabochie.org/assets/images/logo.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- Decorative line -->
  <line x1="340" y1="100" x2="740" y2="100" stroke="#1E3456" stroke-width="1.5"/>

  <!-- Main headline - big -->
  <text x="540" y="340" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="110" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="2">Play Guitar.</text>
  <text x="540" y="430" font-family="'Barlow Condensed','Arial',sans-serif" font-size="42" font-weight="400" fill="#6B7F9A" text-anchor="middle" letter-spacing="6" text-transform="uppercase">In 30 Days. No Experience Needed.</text>

  <!-- Price badge -->
  <rect x="290" y="490" width="500" height="76" rx="38" fill="url(#gold)" filter="url(#shadow)"/>
  <text x="540" y="540" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="38" font-weight="700" fill="#0A1628" text-anchor="middle">GH¢ 299  <tspan fill="#5A3D1A" font-size="24" text-decoration="line-through" font-weight="400">was GH¢ 500</tspan></text>

  <!-- Divider -->
  <line x1="200" y1="600" x2="880" y2="600" stroke="#1E3456" stroke-width="1.5"/>

  <!-- Bullet points -->
  <g font-family="'DM Sans','Arial',sans-serif" font-size="30" fill="#CDD5E0">
    <!-- Each row: icon + text -->
    <g transform="translate(250,660)">
      <rect x="0" y="4" width="16" height="16" rx="8" fill="#C9A84C"/>
      <text x="30" y="18">Beginner to intermediate — step by step</text>
    </g>
    <g transform="translate(250,740)">
      <rect x="0" y="4" width="16" height="16" rx="8" fill="#C9A84C"/>
      <text x="30" y="18">Highlife / Gospel / Contemporary Ghanaian songs</text>
    </g>
    <g transform="translate(250,820)">
      <rect x="0" y="4" width="16" height="16" rx="8" fill="#C9A84C"/>
      <text x="30" y="18">Video lessons — watch anytime, replay as needed</text>
    </g>
    <g transform="translate(250,900)">
      <rect x="0" y="4" width="16" height="16" rx="8" fill="#C9A84C"/>
      <text x="30" y="18">Lifetime access — one payment, no subscriptions</text>
    </g>
    <g transform="translate(250,980)">
      <rect x="0" y="4" width="16" height="16" rx="8" fill="#C9A84C"/>
      <text x="30" y="18">Learn on phone, tablet, or laptop</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="200" y1="1050" x2="880" y2="1050" stroke="#1E3456" stroke-width="1.5"/>

  <!-- Testimonial / urgency -->
  <text x="540" y="1140" font-family="'Libre Baskerville',Georgia,serif" font-size="22" font-style="italic" fill="#6B7F9A" text-anchor="middle">"I never thought I could play guitar. Now I lead worship at my church."</text>
  <text x="540" y="1175" font-family="'DM Sans',sans-serif" font-size="16" fill="#4A5F7A" text-anchor="middle">— Emmanuel K., Accra</text>

  <!-- CTA Button -->
  <rect x="190" y="1280" width="700" height="84" rx="42" fill="url(#goldH)" filter="url(#shadow)"/>
  <text x="540" y="1336" font-family="'Barlow Condensed','Arial Black',sans-serif" font-size="34" font-weight="700" fill="#0A1628" text-anchor="middle" letter-spacing="4">ENROLL NOW — LIMITED SPOTS</text>

  <!-- URL -->
  <text x="540" y="1415" font-family="'Courier New',monospace" font-size="20" fill="#6B7F9A" text-anchor="middle" filter="url(#glow)">gideonabochie.org/school/guitar/buy</text>

  <!-- Payment options -->
  <text x="540" y="1500" font-family="'DM Sans',sans-serif" font-size="16" fill="#4A5F7A" text-anchor="middle">Pay via Mobile Money &middot; Card &middot; Flutterwave</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="1914" width="1080" height="6" fill="#C9A84C"/>

  <!-- Footer -->
  <text x="540" y="1580" font-family="'DM Sans',sans-serif" font-size="14" fill="#4A5F7A" text-anchor="middle">GideonAbochie Studio &middot; School of Creativity, Love &amp; Wisdom</text>

  <!-- Logo mark -->
  <g transform="translate(540,1700)" opacity="0.12">
    <image x="-30" y="-18" width="60" height="36" xlink:href="https://gideonabochie.org/assets/images/logo.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
