<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tuner — Gideon Guitar Method</title>
<link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/guitar.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</head>
<body class="guitar-app">
<div class="screen active">
  <div class="hdr"><div class="hdr-logo"><span class="icon">🎸</span> Tuner</div></div>
  <div class="scrollable" style="flex:1;overflow-y:auto;padding:16px 20px;max-width:700px;margin:0 auto;width:100%">
    <!-- Mic Request -->
    <div id="tuner-mic" class="text-center" style="padding:60px 0">
      <div style="font-size:56px;margin-bottom:16px">🎤</div>
      <div class="section-title" style="justify-content:center">Chromatic Guitar Tuner</div>
      <div class="section-sub">Allow microphone access to start tuning</div>
      <button class="btn btn-primary" id="request-mic-btn">Enable Microphone <i class="ti ti-microphone"></i></button>
      <p id="mic-error" style="color:var(--red-light);font-size:13px;margin-top:12px;display:none"></p>
    </div>

    <!-- Active Tuner -->
    <div id="tuner-active" class="tuner-wrap" style="display:none">
      <div class="tuner-canvas-wrap">
        <canvas id="tuner-canvas" width="160" height="160"></canvas>
        <div class="tuner-note-display" id="tuner-note">--</div>
      </div>
      <div style="font-size:13px;color:var(--text3);margin-top:8px;font-family:monospace" id="tuner-freq">--- Hz</div>
      <div class="tuner-status" id="tuner-status">Listening...</div>
      <div style="width:200px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin:16px auto;position:relative">
        <div style="position:absolute;left:50%;top:-6px;width:2px;height:16px;background:var(--text3);border-radius:1px"></div>
        <div id="tuner-cents-fill" style="height:100%;width:50%;border-radius:2px;transition:width .1s"></div>
      </div>
      <div class="tuner-string-btns">
        <span class="tuner-string-btn" onclick="playRef(6)">E</span>
        <span class="tuner-string-btn" onclick="playRef(5)">A</span>
        <span class="tuner-string-btn" onclick="playRef(4)">D</span>
        <span class="tuner-string-btn" onclick="playRef(3)">G</span>
        <span class="tuner-string-btn" onclick="playRef(2)">B</span>
        <span class="tuner-string-btn" onclick="playRef(1)">e</span>
      </div>
      <button class="btn btn-secondary mt-md" id="tuner-stop-btn">Stop Tuner</button>
    </div>
  </div>
  <nav class="bottom-nav">
    <a class="nav-item" href="/school/guitar/"><i class="ti ti-home"></i><span>Home</span></a>
    <a class="nav-item" href="/school/guitar/learn/"><i class="ti ti-book"></i><span>Learn</span></a>
    <a class="nav-item" href="/school/guitar/practice/"><i class="ti ti-player-play"></i><span>Practice</span></a>
    <a class="nav-item" href="/school/guitar/dashboard/"><i class="ti ti-trending-up"></i><span>Progress</span></a>
    <a class="nav-item" href="/school/guitar/songs/"><i class="ti ti-music"></i><span>Songs</span></a>
    <a class="nav-item active" href="/school/guitar/tuner/"><i class="ti ti-ear"></i><span>Tuner</span></a>
  </nav>
</div>

<script src="/assets/js/guitar/app.js"></script>
<script src="/assets/js/guitar/tuner.js"></script>
<script>
const REF = {6:82.41,5:110,4:146.83,3:196,2:246.94,1:329.63};
let tuner;

window.playRef = function(n) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination);
    o.frequency.value = REF[n]; o.type = 'sine'; o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    o.stop(ctx.currentTime + 0.6);
  } catch(e) {}
};

document.getElementById('request-mic-btn').onclick = async function() {
  document.getElementById('tuner-mic').style.display = 'none';
  document.getElementById('tuner-active').style.display = 'flex';
  var tunerCtx = new (window.AudioContext || window.webkitAudioContext)();
  tuner = new GuitarTuner();
  tuner.onUpdate = function(note, cents, freq) {
    if (!note) { document.getElementById('tuner-note').textContent = '--'; document.getElementById('tuner-freq').textContent = '--- Hz'; document.getElementById('tuner-status').textContent = 'No note detected'; return; }
    document.getElementById('tuner-note').textContent = note.name + note.octave;
    document.getElementById('tuner-freq').textContent = freq.toFixed(1) + ' Hz';
    const pct = Math.min(Math.max(cents + 50, 0), 100);
    const fill = document.getElementById('tuner-cents-fill');
    fill.style.width = pct + '%';
    const inTune = Math.abs(cents) < 5;
    fill.style.background = inTune ? 'var(--green-light)' : Math.abs(cents) < 15 ? 'var(--gld)' : 'var(--red-light)';
    document.getElementById('tuner-status').textContent = inTune ? '✓ In Tune' : (cents < 0 ? '♭ Flat — tighten' : '♯ Sharp — loosen');
    document.getElementById('tuner-status').className = inTune ? 'tuner-status in-tune' : 'tuner-status';
    const cv = document.getElementById('tuner-canvas'), cx = cv.getContext('2d');
    const w=160,h=160,cx2=80,cy2=80,rad=70;
    cx.clearRect(0,0,w,h);
    cx.beginPath(); cx.arc(cx2,cy2,rad,-Math.PI*.75,Math.PI*.25); cx.strokeStyle='rgba(255,255,255,.06)'; cx.lineWidth=6; cx.stroke();
    const a = -Math.PI*.75 + (Math.PI*(pct/100));
    cx.beginPath(); cx.moveTo(cx2,cy2); cx.lineTo(cx2+Math.cos(a)*rad*.65, cy2+Math.sin(a)*rad*.65);
    cx.strokeStyle = inTune ? 'var(--green-light)' : 'var(--gld)'; cx.lineWidth=4; cx.stroke();
    cx.beginPath(); cx.arc(cx2,cy2,4,0,Math.PI*2); cx.fillStyle='var(--gld)'; cx.fill();
  };
  var ok = false;
  try {
    ok = await tuner.start(tunerCtx);
  } catch(e) { console.warn('Tuner start error:', e); }
  if (!ok) {
    document.getElementById('tuner-mic').style.display = 'block';
    document.getElementById('tuner-active').style.display = 'none';
    document.getElementById('mic-error').textContent = 'Microphone access denied. Click the lock/info icon in your browser address bar and enable microphone for this site, then try again.';
    document.getElementById('mic-error').style.display = 'block';
  }
};

document.getElementById('tuner-stop-btn').onclick = function() {
  if (tuner) tuner.stop();
  document.getElementById('tuner-mic').style.display = 'block';
  document.getElementById('tuner-active').style.display = 'none';
};
</script>
</body></html>
