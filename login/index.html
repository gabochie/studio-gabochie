<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C9A84C'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='%230A1628'>G</text></svg>">
<meta name="description" content="Log in to your Studio Gabochie account.">
<title>Log In — Studio Gabochie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<style>
:root{--content-max:1440px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0A1628;color:#CBD5E1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-wrap{width:100%;max-width:420px}
.logo{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#8B7034);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:24px;color:#0A1628;font-weight:700;font-family:'Barlow Condensed',sans-serif}
h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:#F1F5F9;text-align:center;margin-bottom:6px;letter-spacing:-.01em}
h1 span{color:#C9A84C}
.sub{font-size:14px;color:#6B7F9A;text-align:center;margin-bottom:32px}
.card{background:#0F1E38;border:1px solid #1E3250;border-radius:16px;padding:32px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:11px;color:#5A7A9F;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.input-group input{width:100%;padding:12px 14px;border:1px solid #1E3250;border-radius:8px;background:#0A1628;color:#CBD5E1;font-size:14px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif}
.input-group input:focus{border-color:#C9A84C}
.submit-btn{width:100%;padding:14px;border:none;border-radius:10px;background:#C9A84C;color:#0A1628;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:8px}
.submit-btn:hover{background:#D9B85C}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.form-msg{font-size:13px;padding:10px 14px;border-radius:8px;margin-top:12px;display:none}
.form-msg.error{display:block;background:rgba(232,99,122,.1);color:#E8637A;border:1px solid rgba(232,99,122,.2)}
.form-msg.success{display:block;background:rgba(34,197,94,.1);color:#22C55E;border:1px solid rgba(34,197,94,.2)}
.alt-link{text-align:center;margin-top:20px;font-size:13px;color:#6B7F9A}
.alt-link a{color:#C9A84C;text-decoration:none}
.alt-link a:hover{text-decoration:underline}
.alt-link .sep{padding:0 8px;color:#1E3250}
</style>
</head>
<body>
<div class="login-wrap">
  <a href="/" style="text-decoration:none"><img src="../assets/images/studio-logo2.png" alt="Studio Gabochie" style="width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 24px;object-fit:cover"></a>
  <h1>Welcome <span>Back</span></h1>
  <p class="sub">Log in to access your courses and membership.</p>
  <div class="card">
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password" style="padding-right:40px;width:100%;padding:12px 40px 12px 14px;border:1px solid #1E3250;border-radius:8px;background:#0A1628;color:#CBD5E1;font-size:14px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif">
          <span id="pwToggle" onclick="togglePw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#5A7A9F;font-size:18px;line-height:1" title="Show password">&#128065;</span>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Log In</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>
    <div class="alt-link">
      <a href="/register/">Create Account</a>
      <span class="sep">|</span>
      <a href="/forgot/">Forgot Password</a>
    </div>
  </div>
</div>
<script src="../assets/js/main.js"></script>
<script>
function getParam(name) {
  var m = window.location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var msg = document.getElementById('loginMsg');
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  if (!email || !password) { msg.className = 'form-msg error'; msg.textContent = 'Please fill in all fields.'; return false; }
  btn.disabled = true; btn.textContent = 'Logging in\u2026';
  fetch('/api/membership/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === 'ok') {
        msg.className = 'form-msg success'; msg.textContent = 'Logged in! Redirecting\u2026';
        document.cookie = 'ga_session=' + d.token + '; path=/; domain=.gabochie.com; max-age=' + (30 * 24 * 60 * 60) + '; SameSite=Lax; Secure';
        var redirect = getParam('redirect') || '/member/';
        setTimeout(function() { window.location.href = redirect; }, 500);
      } else {
        msg.className = 'form-msg error'; msg.textContent = d.message || 'Login failed.';
        btn.disabled = false; btn.textContent = 'Log In';
      }
    })
    .catch(function() {
      msg.className = 'form-msg error'; msg.textContent = 'Connection error. Please try again.';
      btn.disabled = false; btn.textContent = 'Log In';
    });
  return false;
}
function togglePw() {
  var el = document.getElementById('password');
  var eye = document.getElementById('pwToggle');
  if (el.type === 'password') { el.type = 'text'; eye.innerHTML = '&#128064;'; eye.title = 'Hide password'; }
  else { el.type = 'password'; eye.innerHTML = '&#128065;'; eye.title = 'Show password'; }
}
</script>
</body>
</html>
